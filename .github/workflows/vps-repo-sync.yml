# SINCRONIZAREA AUTOMATĂ A CUNOAȘTERII (Adrian, 11 iul: „să fie identic" —
# doc-ul de pe VPS se împrospăta doar la bridge-deploy manual, cu parolă).
# Instalează PE VPS un timer systemd care, la fiecare 5 minute, aduce
# /root/kelion/repo la zi cu origin/master — deci AI-HANDOFF.md pe care Kelion
# îl încarcă la fiecare amorsare e mereu proaspăt, fără nicio intervenție.
#
# SIGURANȚĂ (constructorul LUCREAZĂ în același repo):
#   - dacă există modificări locale necomise → ciclul e SĂRIT (nu se atinge nimic)
#   - doar fast-forward (git merge --ff-only) — NICIODATĂ reset peste comituri
#     locale; divergența se notează în jurnal și se rezolvă doar la bridge-deploy
#     (ancorarea manuală, cu parola, rămâne neschimbată).
# Rulare O SINGURĂ DATĂ (workflow_dispatch + parola); după aia e permanent.
name: vps-repo-sync

on:
  workflow_dispatch:
    inputs:
      vps_pass:
        description: 'Parola root VPS (mascată; nu se salvează)'
        required: true

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Instalează timer-ul de sincronizare + prima sincronizare
        env:
          VPS_PASS: ${{ inputs.vps_pass }}
        run: |
          set -euo pipefail
          echo "::add-mask::$VPS_PASS"
          VPS_HOST=164.68.120.87
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          export SSHPASS="$VPS_PASS"
          SSHOPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=25 -o PubkeyAuthentication=no -o PreferredAuthentications=password,keyboard-interactive -o NumberOfPasswordPrompts=1"

          sshpass -e ssh $SSHOPTS root@"$VPS_HOST" 'bash -s' <<'REMOTE'
          set -e
          cat > /root/kelion/repo-sync.sh <<'SYNC'
          #!/bin/bash
          cd /root/kelion/repo || exit 0
          # Constructorul lucrează (modificări locale)? Nu atinge NIMIC.
          [ -n "$(git status --porcelain)" ] && exit 0
          git fetch -q origin master || exit 0
          L=$(git rev-parse HEAD)
          R=$(git rev-parse origin/master)
          [ "$L" = "$R" ] && exit 0
          if git merge --ff-only origin/master >/dev/null 2>&1; then
            echo "$(date -Is) sincronizat la $R" >> /root/kelion/repo-sync.log
          else
            echo "$(date -Is) DIVERGENT (comituri locale nepublicate) — rezolvă cu bridge-deploy" >> /root/kelion/repo-sync.log
          fi
          tail -n 200 /root/kelion/repo-sync.log > /root/kelion/repo-sync.log.tmp && mv /root/kelion/repo-sync.log.tmp /root/kelion/repo-sync.log
          SYNC
          chmod +x /root/kelion/repo-sync.sh

          cat > /etc/systemd/system/kelion-repo-sync.service <<'UNIT'
          [Unit]
          Description=Kelion: sincronizeaza /root/kelion/repo cu origin/master (cunoasterea comuna)
          [Service]
          Type=oneshot
          ExecStart=/root/kelion/repo-sync.sh
          UNIT

          cat > /etc/systemd/system/kelion-repo-sync.timer <<'UNIT'
          [Unit]
          Description=Kelion: repo-sync la fiecare 5 minute
          [Timer]
          OnBootSec=2min
          OnUnitActiveSec=5min
          [Install]
          WantedBy=timers.target
          UNIT

          systemctl daemon-reload
          systemctl enable --now kelion-repo-sync.timer
          # Prima sincronizare, acum, ca dovadă:
          systemctl start kelion-repo-sync.service
          echo "=== HEAD repo după prima sincronizare ==="
          cd /root/kelion/repo && git log -1 --oneline
          echo "=== timer ==="
          systemctl list-timers kelion-repo-sync.timer --no-pager | head -3
          echo "=== jurnal sync ==="
          tail -3 /root/kelion/repo-sync.log 2>/dev/null || echo "(gol — repo era deja la zi)"
          REMOTE
