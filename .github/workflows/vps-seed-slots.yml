name: VPS Seed Missing Slots

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VPS_HOST: ${{ vars.VPS_HOST }}
      VPS_USER: ${{ vars.VPS_USER }}
      VPS_HOST_KEY: ${{ vars.VPS_HOST_KEY }}
      SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - name: Pre-creaza sloturile de secrete lipsa pe VPS
        run: |
          set -euo pipefail
          [ -n "$VPS_HOST" ] && [ -n "$VPS_USER" ] && [ -n "$VPS_HOST_KEY" ] && [ -n "$SSH_KEY" ]
          umask 077
          key_file=$(mktemp); known_hosts=$(mktemp)
          trap 'rm -f -- "$key_file" "$known_hosts"' EXIT
          printf '%s\n' "$SSH_KEY" > "$key_file"
          printf '%s\n' "$VPS_HOST_KEY" > "$known_hosts"
          chmod 0600 "$key_file" "$known_hosts"
          ssh -i "$key_file" -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known_hosts" \
              -o HostKeyAlgorithms=ssh-ed25519 -o BatchMode=yes -o ConnectTimeout=25 \
              "$VPS_USER@$VPS_HOST" bash -s << 'EOF'
            set -euo pipefail
            gen() {
              if command -v openssl >/dev/null 2>&1; then openssl rand -hex 32
              else head -c 32 /dev/urandom | od -An -tx1 | tr -d ' \n'; fi
            }
            ensure() {
              local path=$1 group=$2 mode=$3 gid parent
              parent=$(dirname "$path")
              if [ ! -d "$parent" ]; then install -d -o root -g root -m 0750 "$parent"; fi
              if [ ! -s "$path" ]; then printf '%s\n' "$(gen)" > "$path"; fi
              if [[ "$group" =~ ^[0-9]+$ ]]; then gid=$group
              else gid=$(getent group "$group" | awk -F: '{print $3}'); [ -n "$gid" ] || gid=0; fi
              chown root:"$gid" "$path"
              chmod "$mode" "$path"
            }
            ensure /root/kelion/secrets/github-release-oauth-token 10050 0440
            ensure /root/kelion/gate-secrets/github-ghcr-read-token 0 0400
            ensure /root/kelion/worker-secrets/github-worker-token 10050 0440
            ensure /root/kelion/publisher-secrets/github-publisher-token kelion-publisher 0440
            ensure /root/kelion/release-secrets/github-release-token kelion-release 0440
            echo SEED_OK
          EOF
