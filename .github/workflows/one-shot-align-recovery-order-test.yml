name: one-shot-align-recovery-order-test

on:
  push:
    branches:
      - chore/deploy-activation-gc-bootstrap-20260829

permissions:
  contents: write

concurrency:
  group: one-shot-align-recovery-order-test
  cancel-in-progress: false

jobs:
  patch:
    if: github.event.head_commit.message == 'align-one-shot-recovery-order-test'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: chore/deploy-activation-gc-bootstrap-20260829
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Aliniază reperul testului fără relaxarea invariantelor
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('deploy/lib/constructor-publication.test.mjs')
          source = path.read_text(encoding='utf-8')
          old = 'const oldRecovery = deploy.indexOf("# Jurnalele runtime/activare sunt recuperate cu helperul instalat")'
          new = 'const oldRecovery = deploy.indexOf("# Jurnalele runtime/activare sunt recuperate în mod normal cu helperul care le-a")'
          if source.count(old) != 1:
              raise SystemExit('contract drift: reperul vechi nu este unic')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY
          bash -n deploy/deploy.sh
          node --test \
            --test-name-pattern='markerul release și helperul de recovery sunt persistate în ordinea sigură|deploy-ul migrează one-shot numai deadlockul GC al activării' \
            deploy/lib/constructor-publication.test.mjs
          git diff --check
      - name: Publică ajustarea testului
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deploy/lib/constructor-publication.test.mjs
          git diff --cached --check
          git commit -m 'test(deploy): align recovery order boundary'
          git push origin HEAD:chore/deploy-activation-gc-bootstrap-20260829
