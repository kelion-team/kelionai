name: VPS auto-merge watchdog

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  monitor-vps-chore-prs:
    name: Monitor blocked VPS chore PRs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Track auto-merge status and flag blocks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          allowed_prefixes='.github/workflows/vps-run.yml .github/workflows/vps-set-env.yml .github/workflows/vps-diag.yml .github/workflows/deploy.yml'
          marker='🔎 [vps-auto-merge-watchdog]'

          prs=$(gh api "/repos/${GITHUB_REPOSITORY}/pulls?state=open&base=master&per_page=100")
          if [ "$(jq length <<<"$prs")" -eq 0 ]; then
            echo "No open PRs into master."
            exit 0
          fi

          for pr in $(jq -r '.[].number' <<<"$prs"); do
            head_ref=$(jq -r --argjson p "$pr" '.[] | select(.number == $p) | .head.ref' <<<"$prs")
            [[ "$head_ref" == chore/* ]] || continue

            json=$(gh api "/repos/${GITHUB_REPOSITORY}/pulls/$pr")
            auto_merge=$(jq -r '.auto_merge != null' <<<"$json")
            [ "$auto_merge" = "true" ] || continue

            merge_state=$(jq -r '.mergeable_state' <<<"$json")
            mergeable=$(jq -r '.mergeable' <<<"$json")

            files=$(gh api "/repos/${GITHUB_REPOSITORY}/pulls/$pr/files?per_page=100" --paginate --jq '.[].filename')
            has_invalid=0
            while IFS= read -r file; do
              allowed=0
              for p in $allowed_prefixes; do
                if [ "$file" = "$p" ]; then
                  allowed=1
                  break
                fi
              done
              if [ "$allowed" -ne 1 ]; then
                has_invalid=1
                break
              fi
            done <<< "$files"
            [ "$has_invalid" -eq 1 ] && continue

            if [ "$merge_state" != "clean" ] || [ "$mergeable" != "true" ]; then
              status="stuck"
              reason="merge_state=$merge_state mergeable=$mergeable"
            else
              status="ok"
              reason="mergeable and clean"
            fi

            comments=$(gh api "/repos/${GITHUB_REPOSITORY}/issues/${pr}/comments?per_page=100" | jq -r --arg marker "$marker" '.[] | select(.body | startswith($marker)) | .id')
            if [ "$status" = "stuck" ] && [ -z "$comments" ]; then
              gh pr comment "$pr" --repo "$GITHUB_REPOSITORY" --body "${marker} PR este blocat pe auto-merge: ${reason}. Verifică protecțiile branch/required checks."
            elif [ "$status" = "ok" ] && [ -n "$comments" ]; then
              gh pr comment "$pr" --repo "$GITHUB_REPOSITORY" --body "${marker} PR nu mai este blocat. mergeează automat când condițiile se normalizează."
            else
              echo "PR $pr: $status"
            fi
          done
