name: VPS remediation watchdog

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: vps-remediation-watchdog
  cancel-in-progress: false

jobs:
  guard-source:
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Refuză orice sursă diferită de masterul canonic
        shell: bash
        run: |
          set -Eeuo pipefail
          [ "$GITHUB_REPOSITORY" = kelion-team/kelionai ]
          [ "$GITHUB_REF" = refs/heads/master ]
          [ "$GITHUB_REF_NAME" = master ]
          [ "$(git rev-parse HEAD)" = "$GITHUB_SHA" ]

  remediate-and-track:
    needs: guard-source
    name: Track, retry twice, then open an incident
    runs-on: ubuntu-latest
    timeout-minutes: 95
    permissions:
      actions: write
      checks: read
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Rulează trackerul persistent și remediatorul fail-closed
        env:
          GH_TOKEN: ${{ github.token }}
          VPS_REMEDIATOR_FEEDBACK_MINUTES: ${{ vars.VPS_REMEDIATOR_FEEDBACK_MINUTES || '20' }}
          VPS_REMEDIATOR_LIVE_ORIGIN: ${{ vars.PUBLIC_APP_ORIGIN }}
        run: |
          set -euo pipefail
          for tick in 1 2 3 4 5; do
            node scripts/vps-pr-remediator.mjs
            [ "$tick" -eq 5 ] || sleep 55
          done
