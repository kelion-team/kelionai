name: one-shot-diagnose-gate-artifacts

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  guard-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/heads/master
          fetch-depth: 0
          persist-credentials: false

      - name: Validează sursa canonică fără secrete
        shell: bash
        run: |
          set -Eeuo pipefail
          [ "$GITHUB_REPOSITORY" = kelion-team/kelionai ] # hardcod-permis: identitatea tehnică imuabilă a repository-ului canonic
          [ "$GITHUB_REF" = refs/heads/master ]
          [ "$GITHUB_REF_NAME" = master ]
          [ "$(git rev-parse HEAD)" = "$GITHUB_SHA" ]
          [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/master)" ]

  diagnose:
    needs: guard-source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      VPS_HOST: ${{ vars.VPS_HOST }}
      VPS_USER: ${{ vars.VPS_USER }}
      VPS_HOST_KEY: ${{ vars.VPS_HOST_KEY }}
      SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - name: Diagnostichează artefactele de gate ramase (read-only)
        shell: bash
        run: |
          set -Eeuo pipefail
          [ "$VPS_USER" = root ]
          [ -n "$VPS_HOST" ] && [ -n "$VPS_HOST_KEY" ] && [ -n "$SSH_KEY" ]
          umask 077
          key_file=$(mktemp)
          known_hosts=$(mktemp)
          cleanup() { rm -f -- "$key_file" "$known_hosts"; }
          trap cleanup EXIT
          printf '%s\n' "$SSH_KEY" > "$key_file"
          printf '%s\n' "$VPS_HOST_KEY" > "$known_hosts"
          chmod 0600 "$key_file" "$known_hosts"
          ssh_opts=(
            -i "$key_file"
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$known_hosts"
            -o HostKeyAlgorithms=ssh-ed25519
            -o BatchMode=yes
            -o ConnectTimeout=25
          )
          ssh "${ssh_opts[@]}" "$VPS_USER@$VPS_HOST" bash -s <<'REMOTE'
          set -Eeuo pipefail
          echo '=== /root/kelion/runtime listing ==='
          ls -la /root/kelion/runtime/ 2>&1 || echo 'NO_DIR'
          echo '=== gate-related files (find) ==='
          find /root/kelion/runtime -maxdepth 1 \( \
            -name 'constructor-gate-refresh.journal' -o \
            -name 'constructor-gate-txn.*' -o \
            -name 'constructor-gate-discarded.*' -o \
            -name 'constructor-gate-gc.*' \
          \) -exec ls -la {} \; 2>&1
          echo '=== content of any found files (redacted) ==='
          find /root/kelion/runtime -maxdepth 1 \( \
            -name 'constructor-gate-refresh.journal' -o \
            -name 'constructor-gate-txn.*' -o \
            -name 'constructor-gate-discarded.*' -o \
            -name 'constructor-gate-gc.*' \
          \) -exec sh -c 'echo "--- {} ---"; sed -E "s/(password|token|secret|key)=[^[:space:]]+/\1=[REDACTED]/Ig" "{}"' \; 2>&1
          echo '=== kelion-runtime-config-recovery.service status ==='
          systemctl show kelion-runtime-config-recovery.service -p ActiveState,SubState,Result 2>&1 || true
          echo 'DIAG_DONE=yes'
          REMOTE
