name: private-ai-active-model-benchmark

on:
  push:
    branches:
      - ops/private-ai-install-20260830
    paths:
      - .github/private-ai/benchmark-active-model.py
      - .github/private-ai/benchmark-active-model.test.mjs
      - .github/workflows/private-ai-active-model-benchmark.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard-source:
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Validează sursa și contractul read-only
        shell: bash
        run: |
          set -Eeuo pipefail
          [ "$GITHUB_REPOSITORY" = kelion-team/kelionai ]
          [ "$GITHUB_REF" = refs/heads/ops/private-ai-install-20260830 ]
          [ "$GITHUB_REF_NAME" = ops/private-ai-install-20260830 ]
          [ "$(git rev-parse HEAD)" = "$GITHUB_SHA" ]
          python3 -m py_compile .github/private-ai/benchmark-active-model.py
          node --test .github/private-ai/benchmark-active-model.test.mjs

  benchmark-active-model:
    needs: guard-source
    runs-on: ubuntu-latest
    timeout-minutes: 140
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Măsoară modelul llama.cpp activ, fără restart sau switch
        shell: bash
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER }}
          VPS_HOST_KEY: ${{ vars.VPS_HOST_KEY }}
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          [ "$GITHUB_REPOSITORY" = kelion-team/kelionai ]
          [ "$GITHUB_REF" = refs/heads/ops/private-ai-install-20260830 ]
          [ "$GITHUB_REF_NAME" = ops/private-ai-install-20260830 ]
          [ "$(git rev-parse HEAD)" = "$GITHUB_SHA" ]
          [ "$VPS_USER" = root ]
          [ -n "$VPS_HOST" ] && [ -n "$VPS_HOST_KEY" ] && [ -n "$SSH_KEY" ]
          current_host_key=$(ssh-keyscan -T 20 -t ed25519 "$VPS_HOST" 2>/dev/null)
          [ "$current_host_key" = "$VPS_HOST_KEY" ]

          umask 077
          key_file=$(mktemp)
          known_hosts=$(mktemp)
          result_file=private-ai-active-model-benchmark.json
          trap 'rm -f -- "$key_file" "$known_hosts"' EXIT
          printf '%s\n' "$SSH_KEY" > "$key_file"
          printf '%s\n' "$VPS_HOST_KEY" > "$known_hosts"
          chmod 0600 "$key_file" "$known_hosts"
          ssh_opts=(
            -i "$key_file"
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$known_hosts"
            -o HostKeyAlgorithms=ssh-ed25519
            -o BatchMode=yes
            -o ConnectTimeout=25
          )

          ssh "${ssh_opts[@]}" "$VPS_USER@$VPS_HOST" \
            python3 - < .github/private-ai/benchmark-active-model.py \
            | tee "$result_file"
          jq -e '
            .schema == "kelion.private-ai.active-model-benchmark.v1" and
            .measurement_policy.read_only == true and
            .measurement_policy.sample_count == 3 and
            (.samples | length) == 3 and
            ([.samples[].timings.predicted_per_second] | all(type == "number"))
          ' "$result_file" >/dev/null

          jq -r '
            "### Benchmark măsurat — modelul local activ",
            "",
            "- Măsurare: `\(.measured_at.started)` → `\(.measured_at.completed)`",
            "- Model activ: `\(.model.id)` (`\(.model.mapped_total_bytes)` bytes mapate)",
            "- CPU: `\(.host.cpu_model)`, `\(.host.logical_cpu_count)` procesoare logice",
            "- RAM host: `\(.host.memory_total_bytes)` bytes",
            "- Cerere identică: `\(.request.sha256)`, warmup exclus din agregat",
            "",
            "| Probă | TTFT ms | tokeni generați/s | prompt tokeni/s | timp total ms | RSS maxim observat bytes |",
            "|---:|---:|---:|---:|---:|---:|",
            (.samples[] | "| \(.ordinal) | \(.ttft_ms) | \(.timings.predicted_per_second) | \(.timings.prompt_per_second) | \(.end_to_end_ms) | \(.observed_memory_peak_during_probe.process_rss_bytes) |"),
            "",
            "| Agregat (3 probe) | minim | mediană | medie | maxim |",
            "|---|---:|---:|---:|---:|",
            "| TTFT ms | \(.aggregate.ttft_ms.minimum) | \(.aggregate.ttft_ms.median) | \(.aggregate.ttft_ms.mean) | \(.aggregate.ttft_ms.maximum) |",
            "| tokeni generați/s | \(.aggregate.predicted_tokens_per_second.minimum) | \(.aggregate.predicted_tokens_per_second.median) | \(.aggregate.predicted_tokens_per_second.mean) | \(.aggregate.predicted_tokens_per_second.maximum) |",
            "| timp total ms | \(.aggregate.end_to_end_ms.minimum) | \(.aggregate.end_to_end_ms.median) | \(.aggregate.end_to_end_ms.mean) | \(.aggregate.end_to_end_ms.maximum) |",
            "| RSS maxim observat bytes | \(.aggregate.observed_process_rss_peak_bytes.minimum) | \(.aggregate.observed_process_rss_peak_bytes.median) | — | \(.aggregate.observed_process_rss_peak_bytes.maximum) |",
            "",
            "Artefactul JSON păstrează timpii `timings` emiși direct de llama.cpp, valorile exacte în bytes și configurația cererii; conținutul generat nu este jurnalizat."
          ' "$result_file" >> "$GITHUB_STEP_SUMMARY"

      - name: Publică artefactul JSON măsurat
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: private-ai-active-model-benchmark-${{ github.run_id }}
          path: private-ai-active-model-benchmark.json
          if-no-files-found: error
          retention-days: 30
