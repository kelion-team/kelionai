# DIAGNOSTIC DETERMINIST VPS — rezolvă Problema 2 (Adrian, 12 iul: „diagnostichează
# din memorie, nu din dovezi"). La ORICE eșec, în loc de „presupun că...", rulează
# ASTA: adună FAPTELE reale (starea serviciilor, ultimele loguri, containerele
# docker, sănătatea endpoint-urilor, dacă procesul viu rulează codul din repo).
# Determinist, fără LLM. Ieșirea e dovada pe care se ia decizia.
name: vps-diag

on:
  workflow_dispatch: {}

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Adună faptele de pe VPS (SSH)
        env:
          VPS_PASS: ${{ secrets.VPS_ROOT_PASS }}
        run: |
          set -euo pipefail
          if [ -z "$VPS_PASS" ]; then
            echo "::error::Lipsește secretul VPS_ROOT_PASS."; exit 1
          fi
          VPS_HOST=164.68.120.87
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          export SSHPASS="$VPS_PASS"
          SSHOPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=25 -o PubkeyAuthentication=no -o PreferredAuthentications=password,keyboard-interactive -o NumberOfPasswordPrompts=1"

          sshpass -e ssh $SSHOPTS root@"$VPS_HOST" 'bash -s' <<'EOS'
          set +e
          echo "==================== SERVICII (systemctl is-active) ===================="
          for s in kelion-builder kelion-bridge kelion-paznic kelion-deployer docker; do
            printf '%-18s ' "$s"; systemctl is-active "$s" 2>/dev/null
          done
          echo
          echo "==================== COD RULAT vs REPO (md5) ===================="
          REPO=/root/kelion/repo; [ -d "$REPO" ] || REPO=/root/kelion
          for pair in "kelion-builder:bridge/kelion-builder-server.mjs" "kelion-bridge:bridge/kelion-bridge-linux.mjs"; do
            SVC="${pair%%:*}"; SRC="${pair##*:}"
            EXEC=$(systemctl show "$SVC" -p ExecStart --value | grep -oE '/[^ ]*[.]mjs' | head -1)
            if [ -n "$EXEC" ] && [ -f "$EXEC" ] && [ -f "$REPO/$SRC" ]; then
              A=$(md5sum "$EXEC" | awk '{print $1}'); B=$(md5sum "$REPO/$SRC" | awk '{print $1}')
              [ "$A" = "$B" ] && echo "$SVC: COD LA ZI" || echo "$SVC: COD VECHI (rulat != repo) -> ruleaza vps-auto-restart"
            else echo "$SVC: nu pot compara ($EXEC)"; fi
          done
          echo
          echo "==================== DOCKER (ps -a) ===================="
          docker ps -a --format '{{.Names}}  {{.Status}}  {{.Ports}}' 2>/dev/null | head -20
          echo
          echo "==================== LOGURI kelion-livekit (docker, 15) ===================="
          docker logs --tail 15 kelion-livekit 2>&1 | head -20
          echo
          echo "==================== journalctl kelion-builder (90) ===================="
          journalctl -u kelion-builder -n 90 --no-pager 2>/dev/null | tail -90
          echo
          echo "==================== journalctl kelion-bridge (40) — CHAT ===================="
          journalctl -u kelion-bridge -n 40 --no-pager 2>/dev/null | tail -40
          echo
          echo "==================== CREIER LIVE — COTA REALA (Kimi/GLM, cod HTTP acum) ===================="
          KIMI_KEY=$(cat /root/kelion/kimi-key.txt 2>/dev/null | tr -d '\r\n' || true)
          GLM_KEY=$(cat /root/kelion/glm-key.txt 2>/dev/null | tr -d '\r\n' || true)
          if [ -n "$KIMI_KEY" ]; then
            printf 'Kimi  HTTP: '
            curl -s -o /tmp/kimi.out -w '%{http_code}\n' --max-time 20 -X POST https://api.kimi.com/coding/v1/messages \
              -H "x-api-key: $KIMI_KEY" -H 'anthropic-version: 2023-06-01' -H 'content-type: application/json' \
              -d '{"model":"kimi-for-coding","max_tokens":1,"messages":[{"role":"user","content":"hi"}]}' || echo "curl-fail"
            echo "Kimi  body: $(head -c 260 /tmp/kimi.out 2>/dev/null)"
          else echo "Kimi: LIPSA CHEIE (/root/kelion/kimi-key.txt)"; fi
          if [ -n "$GLM_KEY" ]; then
            printf 'GLM   HTTP: '
            curl -s -o /tmp/glm.out -w '%{http_code}\n' --max-time 20 -X POST https://api.z.ai/api/anthropic/v1/messages \
              -H "x-api-key: $GLM_KEY" -H 'anthropic-version: 2023-06-01' -H 'content-type: application/json' \
              -d '{"model":"glm-4.6","max_tokens":1,"messages":[{"role":"user","content":"hi"}]}' || echo "curl-fail"
            echo "GLM   body: $(head -c 260 /tmp/glm.out 2>/dev/null)"
          else echo "GLM: LIPSA CHEIE (/root/kelion/glm-key.txt)"; fi
          echo
          echo "==================== SĂNĂTATE ENDPOINT-URI ===================="
          printf 'kelionai.app/api/version : '; curl -s -o /dev/null -w '%{http_code}\n' --max-time 8 https://kelionai.app/api/version
          printf 'livekit local :7880      : '; curl -s -o /dev/null -w '%{http_code}\n' --max-time 5 http://localhost:7880/ 2>/dev/null || echo "port inchis"
          echo
          echo "==================== INCARCARE ===================="
          uptime; echo "disc:"; df -h / | tail -1
          EOS
