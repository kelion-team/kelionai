# TESTUL LANȚULUI DE REZERVĂ (Adrian: „testează dacă sare pe următorul").
# Rulează PE VPS, cu exact CLI-ul și env-ul pe care le folosește workerul,
# câte o întrebare minusculă pe FIECARE treaptă de rezervă (Kimi, GLM) —
# dovadă directă că cheile sunt valide și endpoint-urile răspund. Nu atinge
# și nu consumă abonamentul Claude Max. Comutarea automată propriu-zisă se
# declanșează singură la prima golire reală de cotă (jurnalul workerului va
# arăta linia „[abonament] treapta … e golită").
name: vps-tier-test

on:
  workflow_dispatch:
    inputs:
      vps_pass:
        description: 'Parola root VPS (mascată; nu se salvează)'
        required: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Testează treptele Kimi și GLM pe VPS
        env:
          VPS_PASS: ${{ inputs.vps_pass }}
        run: |
          set -uo pipefail
          echo "::add-mask::$VPS_PASS"
          VPS_HOST=164.68.120.87
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          export SSHPASS="$VPS_PASS"
          SSHOPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=25 -o PubkeyAuthentication=no -o PreferredAuthentications=password,keyboard-interactive -o NumberOfPasswordPrompts=1"

          echo "=== TREAPTA 2: KIMI (kimi-for-coding) ==="
          sshpass -e ssh $SSHOPTS root@"$VPS_HOST" '
            K=$(cat /root/kelion/kimi-key.txt 2>/dev/null || true)
            if [ -z "$K" ]; then echo "FĂRĂ CHEIE — sărit"; exit 0; fi
            timeout 90 env ANTHROPIC_BASE_URL=https://api.kimi.com/coding/ ANTHROPIC_API_KEY="$K" ANTHROPIC_AUTH_TOKEN="$K" \
              claude -p "Răspunde EXACT cu: KIMI OK" --model kimi-for-coding 2>&1 | tail -3
          '

          echo ""
          echo "=== TREAPTA 3: GLM ==="
          sshpass -e ssh $SSHOPTS root@"$VPS_HOST" '
            K=$(cat /root/kelion/glm-key.txt 2>/dev/null || true)
            if [ -z "$K" ]; then echo "FĂRĂ CHEIE — sărit"; exit 0; fi
            timeout 90 env ANTHROPIC_BASE_URL=https://api.z.ai/api/anthropic ANTHROPIC_API_KEY="$K" ANTHROPIC_AUTH_TOKEN="$K" \
              claude -p "Răspunde EXACT cu: GLM OK" 2>&1 | tail -3
          '

          echo ""
          echo "=== workerul rulează codul cu lanțul? (markerul TIERS la calea reală systemd) ==="
          sshpass -e ssh $SSHOPTS root@"$VPS_HOST" '
            EXE=$(systemctl show kelion-bridge -p ExecStart --value 2>/dev/null | grep -oE "/[^ ]+\.mjs" | head -1)
            [ -z "$EXE" ] && EXE=/root/kelion/kelion-bridge.mjs
            if grep -q "LANȚUL DE ABONAMENTE" "$EXE" 2>/dev/null; then
              echo "DA — $EXE conține comutatorul (lanțul activ)"
            else
              echo "NU — $EXE e încă workerul vechi. Rulează bridge-deploy ca să-l activezi."
            fi
          '
