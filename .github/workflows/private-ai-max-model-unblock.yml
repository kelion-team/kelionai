name: private-ai-max-model-unblock

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  start-download:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/heads/master
          fetch-depth: 0
          persist-credentials: false

      - name: Pornește descărcarea fără a debloca activarea
        shell: bash
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER }}
          VPS_HOST_KEY: ${{ vars.VPS_HOST_KEY }}
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          [ "$GITHUB_REPOSITORY" = kelion-team/kelionai ] # hardcod-permis: identitatea tehnică imuabilă a repository-ului canonic
          [ "$GITHUB_REF" = refs/heads/master ]
          [ "$GITHUB_REF_NAME" = master ]
          [ "$(git rev-parse HEAD)" = "$GITHUB_SHA" ]
          [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/master)" ]
          [ "$VPS_USER" = root ]
          [ -n "$VPS_HOST" ] && [ -n "$VPS_HOST_KEY" ] && [ -n "$SSH_KEY" ]
          current_host_key=$(ssh-keyscan -T 20 -t ed25519 "$VPS_HOST" 2>/dev/null)
          [ "$current_host_key" = "$VPS_HOST_KEY" ]
          umask 077
          key_file=$(mktemp)
          known_hosts=$(mktemp)
          source_bundle=$(mktemp -d)
          trap 'rm -f -- "$key_file" "$known_hosts"; rm -rf --one-file-system -- "$source_bundle"' EXIT
          printf '%s\n' "$SSH_KEY" > "$key_file"
          printf '%s\n' "$VPS_HOST_KEY" > "$known_hosts"
          chmod 0600 "$key_file" "$known_hosts"
          ssh_opts=(
            -i "$key_file"
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$known_hosts"
            -o HostKeyAlgorithms=ssh-ed25519
            -o BatchMode=yes
            -o ConnectTimeout=25
            -o ServerAliveInterval=30
            -o ServerAliveCountMax=6
          )
          installer=.github/private-ai/upgrade-private-ai-max-model.sh
          bash -n "$installer"
          install -m 0400 "$installer" "$source_bundle/upgrade.sh"
          install -m 0400 deploy/codex-worker.mjs "$source_bundle/codex-worker.mjs"
          install -m 0400 deploy/opencode-constructor.json "$source_bundle/opencode-constructor.json"
          install -m 0400 deploy/systemd/kelion-codex-worker.service "$source_bundle/kelion-codex-worker.service"
          install -m 0400 deploy/constructor-model-switch.sh "$source_bundle/constructor-model-switch.sh"
          bundle_sha=$(cd "$source_bundle" && sha256sum \
            upgrade.sh codex-worker.mjs opencode-constructor.json \
            kelion-codex-worker.service constructor-model-switch.sh | sha256sum | awk '{print $1}')
          [[ "$bundle_sha" =~ ^[0-9a-f]{64}$ ]]
          remote_candidate="/root/private-ai-max-model-restage.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"
          ssh "${ssh_opts[@]}" "$VPS_USER@$VPS_HOST" \
            "install -d -o root -g root -m 0700 '$remote_candidate'"
          scp "${ssh_opts[@]}" "$source_bundle"/* "$VPS_USER@$VPS_HOST:$remote_candidate/"
          ssh "${ssh_opts[@]}" "$VPS_USER@$VPS_HOST" bash -s -- \
            "$remote_candidate" "$bundle_sha" <<'REMOTE'
          set -Eeuo pipefail
          umask 077
          readonly candidate=$1
          readonly expected_sha=$2
          readonly unit=/etc/systemd/system/private-ai-max-model-upgrade.service
          readonly durable_parent=/root/private-ai-max-model
          readonly durable_root=$durable_parent/$expected_sha
          readonly script=/root/private-ai-max-model/$expected_sha/upgrade.sh
          readonly model_root=/srv/private-ai/models/qwen3.5-122b-a10b-q4_k_m
          readonly publication_lock=/run/lock/private-ai-max-model-upgrade.lock
          readonly controller_unit=/etc/systemd/system/kelion-constructor-model-control.service
          readonly controller_source=/opt/kelion-constructor/constructor-model-control.mjs
          readonly controller_secret=/root/kelion/secrets/constructor-model-control-secret
          [[ "$expected_sha" =~ ^[0-9a-f]{64}$ ]]
          [ -d "$candidate" ] && [ ! -L "$candidate" ]
          readonly -a source_names=(upgrade.sh codex-worker.mjs opencode-constructor.json kelion-codex-worker.service constructor-model-switch.sh)
          for name in "${source_names[@]}"; do
            [ -f "$candidate/$name" ] && [ ! -L "$candidate/$name" ]
            chown root:root "$candidate/$name"
            chmod 0400 "$candidate/$name"
            [ "$(stat -Lc '%u:%g:%a:%h' "$candidate/$name")" = '0:0:400:1' ]
          done
          actual_sha=$(cd "$candidate" && sha256sum "${source_names[@]}" | sha256sum | awk '{print $1}')
          [ "$actual_sha" = "$expected_sha" ]
          for controller_artifact in "$controller_unit" "$controller_source" "$controller_secret"; do
            [ -f "$controller_artifact" ] && [ ! -L "$controller_artifact" ] \
              && [ "$(stat -Lc '%h' "$controller_artifact")" = 1 ] \
              || { echo "controllerul manual trebuie instalat înainte de max-model: $controller_artifact" >&2; exit 1; }
          done
          systemctl cat kelion-constructor-model-control.service >/dev/null
          systemctl is-enabled --quiet kelion-constructor-model-control.service
          cleanup_remote() { rm -rf --one-file-system -- "$candidate"; rm -f -- "${unit_candidate:-}"; }
          trap cleanup_remote EXIT

          if [ ! -e "$publication_lock" ] && [ ! -L "$publication_lock" ]; then
            ( set -o noclobber; umask 077; : > "$publication_lock" ) 2>/dev/null \
              || [ -f "$publication_lock" ]
          fi
          [ -f "$publication_lock" ] && [ ! -L "$publication_lock" ] \
            && [ "$(stat -Lc '%u:%g:%a:%h' "$publication_lock")" = '0:0:600:1' ]
          publication_lock_identity=$(stat -Lc '%d:%i' "$publication_lock")
          exec 8<>"$publication_lock"
          [ "$(readlink /proc/$$/fd/8)" = "$publication_lock" ] \
            && [ "$(stat -Lc '%d:%i' /proc/$$/fd/8)" = "$publication_lock_identity" ]
          flock -n 8 || { echo 'upgrade-ul maxim este deja activ; dispatch-ul nu mută generația live' >&2; exit 1; }
          [ ! -L "$publication_lock" ] \
            && [ "$(stat -Lc '%d:%i' "$publication_lock")" = "$publication_lock_identity" ]
          systemctl stop private-ai-max-model-upgrade.service >/dev/null 2>&1 || true
          install -d -o root -g root -m 0700 "$durable_parent"
          [ -d "$durable_parent" ] && [ ! -L "$durable_parent" ]
          if [ -e "$durable_root" ] || [ -L "$durable_root" ]; then
            [ -d "$durable_root" ] && [ ! -L "$durable_root" ]
            rm -rf --one-file-system -- "$durable_root"
          fi
          install -d -o root -g root -m 0700 "$durable_root"
          for name in "${source_names[@]}"; do
            install -o root -g root -m 0400 "$candidate/$name" "$durable_root/$name"
            sync -f "$durable_root/$name"
          done
          rm -rf --one-file-system -- "$candidate"

          unit_candidate=$(mktemp /etc/systemd/system/.private-ai-max-model-restage.XXXXXX)
          cat > "$unit_candidate" <<UNIT
          [Unit]
          Description=Kelion private AI maximum stable model upgrade
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=oneshot
          WorkingDirectory=$durable_root
          ExecStart=/usr/bin/flock --exclusive --wait 0 $publication_lock /usr/bin/bash $script
          ExecStartPost=/usr/bin/systemctl disable private-ai-max-model-upgrade.service
          Restart=no
          # Rămâne sub timeout-ul jobului (360 min), inclusiv diagnostic și cleanup.
          TimeoutStartSec=20400s
          TimeoutStopSec=600s

          [Install]
          WantedBy=multi-user.target
          UNIT
          chown root:root "$unit_candidate"
          chmod 0644 "$unit_candidate"
          mv -f -- "$unit_candidate" "$unit"
          unit_candidate=''
          sync -f "$unit"
          systemctl daemon-reload
          systemd-analyze verify "$unit"

          flock -u 8
          exec 8>&-
          systemctl reset-failed private-ai-max-model-upgrade.service >/dev/null 2>&1 || true
          systemctl enable private-ai-max-model-upgrade.service >/dev/null
          if ! systemctl start private-ai-max-model-upgrade.service; then
            journalctl --no-pager --output=cat --unit=private-ai-max-model-upgrade.service \
              --lines=200 >&2
            exit 1
          fi
          [ "$(systemctl show private-ai-max-model-upgrade.service --property=Result --value)" = success ]
          [ "$(systemctl show private-ai-max-model-upgrade.service --property=ExecMainStatus --value)" = 0 ]
          ! systemctl is-enabled --quiet private-ai-max-model-upgrade.service
          [ -d "$model_root" ] && [ ! -L "$model_root" ]
          [ -f /etc/private-ai/.max-model-complete ] \
            && [ ! -L /etc/private-ai/.max-model-complete ] \
            && [ "$(stat -Lc '%u:%g:%a:%h' /etc/private-ai/.max-model-complete)" = '0:0:600:1' ] \
            && [ "$(wc -l < /etc/private-ai/.max-model-complete)" -eq 20 ] \
            && grep -qx 'schema=2' < <(sed -n '1p' /etc/private-ai/.max-model-complete)
          [ ! -e /root/kelion/runtime/constructor-max-model.journal ] \
            && [ ! -L /root/kelion/runtime/constructor-max-model.journal ]
          [ ! -e /run/kelion/constructor-activation.pending ] \
            && [ ! -L /run/kelion/constructor-activation.pending ]
          systemctl is-active --quiet kelion-constructor-model-control.service
          [ -S /run/kelion-constructor-model-control/control.sock ] \
            && [ ! -L /run/kelion-constructor-model-control/control.sock ] \
            && [ "$(stat -Lc '%u:%g:%a' /run/kelion-constructor-model-control/control.sock)" = '0:10050:660' ]
          downloaded=$(find "$model_root" -maxdepth 1 -type f \
            \( -name '*.gguf' -o -name '*.part' \) -printf '%s\n' \
            | awk '{sum += $1} END {printf "%.0f", sum + 0}')
          printf 'MAX_MODEL_UPGRADE_COMPLETED=yes\n'
          printf 'MAX_MODEL_DOWNLOADED_BYTES=%s\n' "$downloaded"
          printf 'MAX_MODEL_UPGRADE_STATE=%s\n' \
            "$(systemctl is-active private-ai-max-model-upgrade.service 2>/dev/null || true)"
          REMOTE
