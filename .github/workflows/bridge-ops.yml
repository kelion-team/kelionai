# OCHII ȘI MÂINILE creierului de cod pe puntea de producție.
#
# Problema pe care o rezolvă: creierul de cod (Claude din GitHub/cloud) nu avea
# NICIO cale spre puntea live — secretul punții (BRIDGE_SECRET) trăiește doar în
# Railway. Workflow-ul ăsta îl citește din Railway prin API (mascat, nu apare
# niciodată în loguri) și execută o operațiune de diagnostic/reparație pe
# endpoint-urile punții. Pornit DOAR manual (workflow_dispatch) — nu rulează
# niciodată singur.
#
# Operațiuni:
#   health        → starea reală a workerului (online? văzut acum câte secunde?)
#   orders-report → registrul ordinelor de lucru și stadiile lor
#   chat-tail     → ultimele mesaje din chatul admin (ce a răspuns Kelion de fapt)
#   workorder     → trimite constructorului de pe VPS un ordin (textul din `text`)
#   say           → spune o propoziție în chatul adminului (textul din `text`)

name: bridge-ops

on:
  workflow_dispatch:
    inputs:
      op:
        description: 'Operațiunea'
        required: true
        type: choice
        options: [health, orders-report, chat-tail, workorder, say]
      text:
        description: 'Textul (doar pentru workorder/say)'
        required: false
        type: string

jobs:
  ops:
    runs-on: ubuntu-latest
    steps:
      - name: Ia BRIDGE_SECRET din Railway (mascat) și execută operațiunea
        env:
          TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          OP: ${{ inputs.op }}
          TEXT: ${{ inputs.text }}
        run: |
          set -euo pipefail
          GQL=https://backboard.railway.com/graphql/v2
          gql() { curl -sS --max-time 30 "$GQL" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -d "$1"; }
          # Găsește proiectul (aceeași logică validată în deploy.yml: unicul kelion).
          RESP=$(gql '{"query":"query{projects{edges{node{id name environments{edges{node{id name}}} services{edges{node{id name}}}}}}}"}')
          P=$(echo "$RESP" | jq '[.data.projects.edges[].node | select(.name | test("kelion";"i"))][0]')
          PID=$(echo "$P" | jq -r '.id')
          ENVID=$(echo "$P" | jq -r '[.environments.edges[].node | select(.name=="production")][0].id')
          SVCID=$(echo "$P" | jq -r '[.services.edges[].node | select(.name=="web")][0].id // .services.edges[0].node.id')
          if [ -z "$PID" ] || [ "$PID" = "null" ]; then echo "::error::Nu găsesc proiectul"; exit 1; fi
          # Variabilele serviciului web (decriptate) → BRIDGE_SECRET, mascat imediat.
          VQ=$(jq -nc --arg p "$PID" --arg e "$ENVID" --arg s "$SVCID" \
            '{query:"query($p:String!,$e:String!,$s:String!){variables(projectId:$p,environmentId:$e,serviceId:$s)}",variables:{p:$p,e:$e,s:$s}}')
          SECRET=$(gql "$VQ" | jq -r '.data.variables.BRIDGE_SECRET // empty')
          if [ -z "$SECRET" ]; then echo "::error::BRIDGE_SECRET nu e setat pe serviciu"; exit 1; fi
          echo "::add-mask::$SECRET"
          B=https://kelionai.app
          H="x-bridge-secret: $SECRET"
          case "$OP" in
            health)
              curl -sS --max-time 20 -H "$H" "$B/api/bridge/health" | jq . ;;
            orders-report)
              curl -sS --max-time 20 -H "$H" "$B/api/bridge/orders-report" | jq -r '.report' ;;
            chat-tail)
              # Doar coada conversației, tunsă — destul pentru diagnostic.
              curl -sS --max-time 20 -H "$H" "$B/api/bridge/chat-history" \
                | jq -r '.history[-14:][] | "\(.role): \(.content[0:220])"' ;;
            workorder)
              [ -n "$TEXT" ] || { echo "::error::text gol"; exit 1; }
              curl -sS --max-time 20 -X POST -H "$H" -H "content-type: application/json" \
                -d "$(jq -nc --arg t "$TEXT" '{text:$t}')" "$B/api/bridge/workorders" | jq . ;;
            say)
              [ -n "$TEXT" ] || { echo "::error::text gol"; exit 1; }
              curl -sS --max-time 20 -X POST -H "$H" -H "content-type: application/json" \
                -d "$(jq -nc --arg t "$TEXT" '{text:$t}')" "$B/api/bridge/say" | jq . ;;
            *) echo "::error::operațiune necunoscută: $OP"; exit 1 ;;
          esac
