# OCHII ȘI MÂINILE creierului de cod pe puntea de producție.
#
# Problema pe care o rezolvă: creierul de cod (Claude din GitHub/cloud) nu avea
# NICIO cale spre puntea live. Workflow-ul ia BRIDGE_SECRET din GitHub Secrets
# (Railway a fost scos pe 22 iul 2026 — secretul trebuie pus O DATĂ în repo:
# Settings → Secrets → Actions → BRIDGE_SECRET, aceeași valoare ca în env-ul
# backendului) și execută o operațiune de diagnostic/reparație pe
# endpoint-urile punții. Pornit DOAR manual (workflow_dispatch) — nu rulează
# niciodată singur.
#
# Operațiuni:
#   health        → starea reală a workerului (online? văzut acum câte secunde?)
#   orders-report → registrul ordinelor de lucru și stadiile lor
#   chat-tail     → ultimele mesaje din chatul admin (ce a răspuns Kelion de fapt)
#   workorder     → trimite constructorului de pe VPS un ordin (textul din `text`)
#   say           → spune o propoziție în chatul adminului (textul din `text`)

name: bridge-ops

on:
  workflow_dispatch:
    inputs:
      op:
        description: 'Operațiunea'
        required: true
        type: choice
        options: [health, orders-report, chat-tail, workorder, say, client-errors, files, tier-events, purge-phantom-releases]
      text:
        description: 'Textul (doar pentru workorder/say)'
        required: false
        type: string

jobs:
  ops:
    runs-on: ubuntu-latest
    steps:
      - name: Execută operațiunea pe punte (BRIDGE_SECRET din GitHub Secrets)
        env:
          SECRET: ${{ secrets.BRIDGE_SECRET }}
          OP: ${{ inputs.op }}
          TEXT: ${{ inputs.text }}
        run: |
          set -euo pipefail
          if [ -z "$SECRET" ]; then echo "::error::BRIDGE_SECRET lipsește din Settings → Secrets → Actions (pune aceeași valoare ca în env-ul backendului)."; exit 1; fi
          B=https://kelionai.app
          H="x-bridge-secret: $SECRET"
          case "$OP" in
            health)
              curl -sS --max-time 20 -H "$H" "$B/api/bridge/health" | jq . ;;
            orders-report)
              curl -sS --max-time 20 -H "$H" "$B/api/bridge/orders-report" | jq -r '.report' ;;
            chat-tail)
              # Doar coada conversației, tunsă — destul pentru diagnostic.
              # Cu ORA fiecărui mesaj: fără ea nu se poate spune dacă o eroare
              # din istoric e dinainte sau de după un deploy.
              curl -sS --max-time 20 -H "$H" "$B/api/bridge/chat-history" \
                | jq -r '.history[-14:][] | "\(.created_at) \(.role): \(.content[0:220])"' ;;
            workorder)
              [ -n "$TEXT" ] || { echo "::error::text gol"; exit 1; }
              curl -sS --max-time 20 -X POST -H "$H" -H "content-type: application/json" \
                -d "$(jq -nc --arg t "$TEXT" '{text:$t}')" "$B/api/bridge/workorders" | jq . ;;
            say)
              [ -n "$TEXT" ] || { echo "::error::text gol"; exit 1; }
              curl -sS --max-time 20 -X POST -H "$H" -H "content-type: application/json" \
                -d "$(jq -nc --arg t "$TEXT" '{text:$t}')" "$B/api/bridge/say" | jq . ;;
            client-errors)
              # Jurnalul erorilor de consolă ale clienților (fereastra lui Kelion,
              # utilă și lui Claude la diagnostic: „camera nu merge" etc.).
              curl -sS --max-time 20 -H "$H" "$B/api/bridge/client-errors" \
                | jq -r '.errors[-40:][] | "\(.at) [\(.kind)] \(.msg[0:220])"' ;;
            files)
              # Cutia atașamentelor adminului: a ajuns poza pe server? când? cât de
              # mare? (diagnostic „Kelion nu-mi analizează poza" — 11 iul.)
              curl -sS --max-time 20 -H "$H" "$B/api/bridge/files" \
                | jq -r '.files[0:20][] | "\(.at) \(.name) \(.type) octeți:\((.data | length))"' ;;
            tier-events)
              # Treptele de abonament (max/kimi/glm): când s-a comutat prin cheie,
              # când a revenit singur la ordinea prestabilită (Adrian, 12 iul).
              curl -sS --max-time 20 -H "$H" "$B/api/bridge/tier-events" \
                | jq -r '.events[] | "\(.at) [\(.worker)] \(.action): \(.from_tier // "—") → \(.to_tier)\(if .reason then " (" + (.reason|.[0:80]) + ")" else "" end)"' ;;
            purge-phantom-releases)
              # Curăță release-urile fantomă generate de bug-ul de recursivitate
              # („RELEASE APROBAT DE ADRIAN: ...” restagiat pe sine — Adrian, 12 iul).
              curl -sS --max-time 20 -X POST -H "$H" "$B/api/bridge/releases/purge-phantom" | jq . ;;
            *) echo "::error::operațiune necunoscută: $OP"; exit 1 ;;
          esac
