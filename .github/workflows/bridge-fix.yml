# Repară automat secretul punții de pe VPS.
#
# Problema: worker-ul kelion-bridge de pe VPS trimite un BRIDGE_SECRET vechi la
# /api/bridge/pull → serverul răspunde HTTP 401 → puntea nu ia niciun job (pare
# căzută). Cauza: /root/kelion/bridge-secret.txt de pe VPS NU se potrivește cu
# BRIDGE_SECRET-ul de pe Railway (pe care serverul îl folosește la autentificare).
#
# Acest workflow (rulat de pe un runner GitHub — care are internet direct, nu prin
# proxy) ia BRIDGE_SECRET-ul REAL din Railway și îl scrie în fișierul de pe VPS,
# apoi repornește puntea și verifică live că a revenit online. Parola root a VPS-ului
# se dă ca input la rulare (mascată în loguri) — NU e stocată în repo.

name: bridge-fix

on:
  workflow_dispatch:
    inputs:
      vps_pass:
        description: 'Parola root VPS (mascată; nu se salvează)'
        required: true

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Sincronizează BRIDGE_SECRET din Railway pe VPS și repornește puntea
        env:
          TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          VPS_PASS: ${{ inputs.vps_pass }}
        run: |
          set -euo pipefail
          echo "::add-mask::$VPS_PASS"
          VPS_HOST=164.68.120.87

          # 1) Ia BRIDGE_SECRET din Railway (aceeași logică validată în bridge-ops).
          GQL=https://backboard.railway.com/graphql/v2
          gql() { curl -sS --max-time 30 "$GQL" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -d "$1"; }
          RESP=$(gql '{"query":"query{projects{edges{node{id name environments{edges{node{id name}}} services{edges{node{id name}}}}}}}"}')
          P=$(echo "$RESP" | jq '[.data.projects.edges[].node | select(.name | test("kelion";"i"))][0]')
          PID=$(echo "$P" | jq -r '.id')
          ENVID=$(echo "$P" | jq -r '[.environments.edges[].node | select(.name=="production")][0].id')
          SVCID=$(echo "$P" | jq -r '[.services.edges[].node | select(.name=="web")][0].id // .services.edges[0].node.id')
          VQ=$(jq -nc --arg p "$PID" --arg e "$ENVID" --arg s "$SVCID" \
            '{query:"query($p:String!,$e:String!,$s:String!){variables(projectId:$p,environmentId:$e,serviceId:$s)}",variables:{p:$p,e:$e,s:$s}}')
          SECRET=$(gql "$VQ" | jq -r '.data.variables.BRIDGE_SECRET // empty')
          if [ -z "$SECRET" ]; then echo "::error::BRIDGE_SECRET nu e setat pe Railway"; exit 1; fi
          echo "::add-mask::$SECRET"
          echo "BRIDGE_SECRET obținut din Railway (lungime ${#SECRET})."

          # 2) SSH pe VPS (runner-ul are internet direct, nu prin proxy).
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          export SSHPASS="$VPS_PASS"
          # Forțează autentificarea pe PAROLĂ: fără asta, ssh epuizează întâi
          # metodele pubkey/none (MaxAuthTries) și parola nici nu mai e trimisă,
          # dând fals „Permission denied".
          SSHOPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=25 -o PubkeyAuthentication=no -o PreferredAuthentications=password,keyboard-interactive -o NumberOfPasswordPrompts=1"

          # 2.0) Sondă (FĂRĂ parolă): ce metode de auth oferă serverul runner-ului?
          echo "=== metode de auth oferite runner-ului ==="
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15 \
            -o PreferredAuthentications=none -o BatchMode=yes root@"$VPS_HOST" true 2>&1 | grep -i 'authentication\|denied\|continue' || true

          # 2a) Scrie secretul REAL în fișierul pe care worker-ul îl citește
          #     (prin stdin → cat, ca să nu apară niciodată în argv/loguri).
          printf '%s' "$SECRET" | sshpass -e ssh $SSHOPTS root@"$VPS_HOST" 'cat > /root/kelion/bridge-secret.txt; echo scris: $(wc -c < /root/kelion/bridge-secret.txt) octeti'

          # 2b) Asigură-te că nu-l suprascrie o valoare greșită din mediu, apoi repornește.
          sshpass -e ssh $SSHOPTS root@"$VPS_HOST" 'sed -i "/^BRIDGE_SECRET=/d;/BRIDGE_SECRET/d" /root/kelion/claude.env 2>/dev/null || true; systemctl restart kelion-bridge kelion-builder kelion-deployer; sleep 5; echo "=== jurnal punte ==="; journalctl -u kelion-bridge -n 10 --no-pager -o cat | tail -10'

          # 3) Verifică live de pe runner că serverul vede worker-ul (online:true).
          echo "=== verificare live /api/bridge/health ==="
          ok=0
          for i in $(seq 1 6); do
            sleep 8
            H="x-bridge-secret: $SECRET"
            ST=$(curl -sS --max-time 15 -H "$H" https://kelionai.app/api/bridge/health || echo '{}')
            echo "$ST"
            if echo "$ST" | grep -q '"online":true'; then ok=1; break; fi
          done
          if [ "$ok" = 1 ]; then
            echo "✅ PUNTEA E ONLINE — worker-ul trage joburi (200, nu 401)."
          else
            echo "::warning::Puntea încă nu raportează online. Vezi jurnalul de mai sus."
          fi
