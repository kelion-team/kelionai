# TLS PENTRU LIVEKIT — certificat VALID automat, DIRECT prin SSH (determinist).
#
# De ce (12 iul, Adrian: „de unde rezolvăm domeniu certificat? — nu știu — vezi
# și tu"): browserul refuză wss://IP:7880 fără certificat. DNS-ul lui kelionai.app
# e la Cloudflare, dar nu-l atingem. Folosim 164-68-120-87.sslip.io (mapează
# direct IP-ul VPS) + Caddy pentru certificat Let's Encrypt valid, automat.
#
# Rulează exact scriptul, prin SSH, cu parola root din secret (mascată automat):
#   node bridge/kelion-livekit-tls.mjs
# → reutilizează cheile din Railway, repornește LiveKit cu use_external_ip,
#   pornește Caddy (auto-TLS), scrie LIVEKIT_URL=wss://<hostname> în Railway.
# Cheile NU apar în log (scriptul afișează doar primele 8 caractere ale API key).
name: vps-livekit-tls

on:
  workflow_dispatch: {}

jobs:
  tls:
    runs-on: ubuntu-latest
    steps:
      - name: Certificat TLS valid pentru LiveKit pe VPS (SSH, parolă mascată din secret)
        env:
          VPS_PASS: ${{ secrets.VPS_ROOT_PASS }}
        run: |
          set -euo pipefail
          if [ -z "$VPS_PASS" ]; then
            echo "::error::Lipsește secretul VPS_ROOT_PASS."; exit 1
          fi
          VPS_HOST=164.68.120.87
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          export SSHPASS="$VPS_PASS"
          SSHOPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=25 -o PubkeyAuthentication=no -o PreferredAuthentications=password,keyboard-interactive -o NumberOfPasswordPrompts=1"

          sshpass -e ssh $SSHOPTS root@"$VPS_HOST" 'bash -s' <<'EOS'
          set -e
          export DEBIAN_FRONTEND=noninteractive
          echo "=== cod proaspăt din master ==="
          REPO=/root/kelion/repo
          [ -d "$REPO" ] || REPO=/root/kelion
          cd "$REPO"
          git fetch origin master -q || true
          git reset --hard origin/master -q || true
          git log --oneline -1 || true

          echo "=== rulez kelion-livekit-tls (Caddy + certificat valid) ==="
          node "$REPO/bridge/kelion-livekit-tls.mjs"

          echo "=== stare containere ==="
          docker ps --filter name=kelion-livekit --filter name=kelion-caddy --format '{{.Names}} {{.Status}} {{.Ports}}' || true
          EOS
