# SINCRONIZEAZĂ VPS-ul la origin/master și repornește serviciile Kelion.
#
# REGULA 100% SINCRON (Adrian, 10 iul): producția = master, mereu. Cauza
# reverterilor „build fantomă": clona de pe VPS DIVERGASE (commituri locale de
# auto-reparație nepublicate), deci publica cod VECHI peste deploy-ul corect.
# Acest workflow face `git reset --hard origin/master` pe VPS → curăță divergența
# și adoptă scripturile reparate (repair.sh/pornire care acum ÎMPING fixurile în
# master). E SIGUR: master conține tot codul verificat; reparațiile reușite ajung
# în master, deci nu se pierde nimic. După asta, VPS-ul NU mai poate publica stale.
# Parola root a VPS-ului se dă ca input (mascată, nu se salvează).

name: bridge-deploy

on:
  workflow_dispatch:
    inputs:
      vps_pass:
        description: 'Parola root VPS (mascată; nu se salvează)'
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # SCURGEREA REALĂ (10 iul): mascarea de mai jos venea PREA TÂRZIU —
      # runner-ul tipărește blocul `env:` al unui pas ÎNAINTE să-i ruleze
      # scriptul, deci parola apărea ÎN CLAR în jurnal. Pasul ăsta rulează
      # primul și citește parola direct din fișierul de eveniment (nu prin
      # env, nu interpolată în script), deci nu are pe unde să se vadă.
      - name: Maschează parola în jurnal (înainte de orice)
        run: |
          v=$(jq -r '.inputs.vps_pass // empty' "$GITHUB_EVENT_PATH")
          { [ -n "$v" ] && echo "::add-mask::$v"; } || true
      - name: Adu workerul la zi pe VPS și repornește puntea
        env:
          TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          VPS_PASS: ${{ inputs.vps_pass }}
        run: |
          set -euo pipefail
          echo "::add-mask::$VPS_PASS"
          VPS_HOST=164.68.120.87

          # BRIDGE_SECRET din Railway — doar pentru verificarea de sănătate la final.
          GQL=https://backboard.railway.com/graphql/v2
          gql() { curl -sS --max-time 30 "$GQL" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -d "$1"; }
          RESP=$(gql '{"query":"query{projects{edges{node{id name environments{edges{node{id name}}} services{edges{node{id name}}}}}}}"}')
          P=$(echo "$RESP" | jq '[.data.projects.edges[].node | select(.name | test("kelion";"i"))][0]')
          PID=$(echo "$P" | jq -r '.id')
          ENVID=$(echo "$P" | jq -r '[.environments.edges[].node | select(.name=="production")][0].id')
          SVCID=$(echo "$P" | jq -r '[.services.edges[].node | select(.name=="web")][0].id // .services.edges[0].node.id')
          VQ=$(jq -nc --arg p "$PID" --arg e "$ENVID" --arg s "$SVCID" \
            '{query:"query($p:String!,$e:String!,$s:String!){variables(projectId:$p,environmentId:$e,serviceId:$s)}",variables:{p:$p,e:$e,s:$s}}')
          SECRET=$(gql "$VQ" | jq -r '.data.variables.BRIDGE_SECRET // empty')
          [ -n "$SECRET" ] && echo "::add-mask::$SECRET" || echo "::warning::BRIDGE_SECRET lipsă — sar peste verificarea de sănătate"

          # SSH pe VPS (runner-ul are internet direct, nu prin proxy).
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          export SSHPASS="$VPS_PASS"
          SSHOPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=25 -o PubkeyAuthentication=no -o PreferredAuthentications=password,keyboard-interactive -o NumberOfPasswordPrompts=1"

          # SINCRONIZARE FORȚATĂ la origin/master — curăță divergența locală (cauza
          # reverterilor) și adoptă scripturile reparate. NU folosim `git clean` ca
          # să nu ștergem fișiere de config netrack-uite (ex. claude.env).
          #
          # + FIXUL BENZII PUBLICE (dovedit 10 iul, jurnal live: „auth fail: header
          #   64 chars vs secret 28"): fișierul /root/kelion/bridge-secret.txt de pe
          #   VPS avea un secret VECHI (64 car.) → serverul respingea TOT ce trimitea
          #   workerul nou (care declară capabilitatea `persona` pentru joburi
          #   publice), iar un proces ZOMBIE vechi (secret corect, FĂRĂ persona)
          #   ținea becul verde dar lăsa vizitatorii fără răspuns. Aici: scriem
          #   secretul CORECT (din Railway) în fișier, vânăm zombie-ul, repornim.
          # 1) Secretul punții → fișierul de pe VPS, prin STDIN (nu prin linia de
          #    comandă: acolo l-ar vedea `ps`). Ia exact valoarea din Railway.
          if [ -n "${SECRET:-}" ]; then
            printf '%s' "$SECRET" | sshpass -e ssh $SSHOPTS root@"$VPS_HOST" \
              'OLD=$(wc -c < /root/kelion/bridge-secret.txt 2>/dev/null || echo 0); cat > /root/kelion/bridge-secret.txt && chmod 600 /root/kelion/bridge-secret.txt && echo "bridge-secret.txt sincronizat (era $OLD octeți → acum $(wc -c < /root/kelion/bridge-secret.txt))"'
          else
            echo "⚠️ Nu am BRIDGE_SECRET din Railway — nu ating fișierul de secret"
          fi

          sshpass -e ssh $SSHOPTS root@"$VPS_HOST" 'bash -s' <<"EOS"
            set -uo pipefail
            REPO=""
            for d in /root/kelion/repo /root/Kelionai /root/kelion; do
              if [ -d "$d/.git" ] && [ -d "$d/bridge" ]; then REPO="$d"; break; fi
            done
            [ -z "$REPO" ] && { echo "NU găsesc clona repo-ului cu bridge/"; exit 1; }
            cd "$REPO" || exit 1
            echo "repo: $REPO (HEAD local VECHI: $(git rev-parse --short HEAD))"
            git fetch origin master || { echo "git fetch a eșuat"; exit 1; }
            git reset --hard origin/master || { echo "reset la origin/master a eșuat"; exit 2; }
            echo "VPS SINCRONIZAT la master: $(git rev-parse --short HEAD)"

            # 2) CALEA REALĂ RULATĂ (dovedit 11 iul, LIVE 13s+eroare deși deploy-ul
            #    zicea „reușit"): systemd rulează adesea o COPIE separată, ex.
            #    /root/kelion/kelion-bridge.mjs — ÎN AFARA repo-ului — pe care
            #    `git reset --hard` din $REPO NU o atinge niciodată. Toate fixurile
            #    de cod (sesiuni calde, standby, stall 12s) rulau doar în repo, NU
            #    și pe VPS. Aflăm calea EXACTĂ din systemd și scriem codul corect
            #    EXACT acolo — indiferent cum se numește sau unde e.
            EXEC=$(systemctl show kelion-bridge -p ExecStart --value 2>/dev/null | grep -oE '/[^ ]*\.mjs' | head -1)
            SRC="$REPO/bridge/kelion-bridge-linux.mjs"
            echo "ExecStart real (systemd): ${EXEC:-necunoscut}"
            if [ -z "$EXEC" ]; then
              echo "::warning::Nu am putut citi ExecStart din systemd — sar peste sincronizarea calei reale"
            elif [ "$EXEC" = "$SRC" ]; then
              echo "Calea rulată DEJA e fișierul din repo — fără copiere necesară."
            else
              BEFORE=$(md5sum "$EXEC" 2>/dev/null | cut -d' ' -f1 || echo "lipsă")
              cp "$SRC" "$EXEC"
              AFTER=$(md5sum "$EXEC" | cut -d' ' -f1)
              echo "MISMATCH găsit — copiat codul corect peste calea reală."
              echo "  $EXEC   md5 înainte: $BEFORE   md5 după: $AFTER"
              grep -q "warmPub" "$EXEC" && echo "  ✅ confirmat: codul nou (sesiuni calde per-vizitator) e acum pe disc" \
                || echo "::warning::  codul copiat NU conține markerul așteptat — verifică manual"
            fi

            # 2b) ACEEAȘI lecție pentru CONSTRUCTOR (11 iul, lanțul de lucru
            #     Kimi→GLM): kelion-builder rulează și el adesea o copie în afara
            #     repo-ului. Fără sincronizarea asta, motorul de muncă ar rămâne
            #     pe Max deși repo-ul zice Kimi. Marker: „MOTORUL DE LUCRU".
            BEXEC=$(systemctl show kelion-builder -p ExecStart --value 2>/dev/null | grep -oE '/[^ ]*\.mjs' | head -1)
            BSRC="$REPO/bridge/kelion-builder-server.mjs"
            echo "ExecStart real constructor (systemd): ${BEXEC:-necunoscut}"
            if [ -z "$BEXEC" ]; then
              echo "::warning::Nu am putut citi ExecStart-ul constructorului — sar peste sincronizare"
            elif [ "$BEXEC" = "$BSRC" ]; then
              echo "Constructorul rulează DEJA fișierul din repo — fără copiere."
            else
              BB=$(md5sum "$BEXEC" 2>/dev/null | cut -d' ' -f1 || echo "lipsă")
              cp "$BSRC" "$BEXEC"
              BA=$(md5sum "$BEXEC" | cut -d' ' -f1)
              echo "Constructor sincronizat la calea reală.  md5 înainte: $BB   după: $BA"
              grep -q "MOTORUL DE LUCRU" "$BEXEC" && echo "  ✅ confirmat: lanțul de lucru Kimi→GLM e pe disc la calea rulată" \
                || echo "::warning::  constructorul copiat NU conține markerul lanțului — verifică manual"
            fi

            # 3) Vânătoarea de ZOMBIE: orice worker pornit manual, în afara
            #    systemd-ului (nume vechi SAU noi — nu presupunem un singur nume).
            echo "=== procese worker/punte ÎNAINTE ==="
            pgrep -af 'kelion-bridge|bridge-linux' || echo "(niciunul)"
            MAIN_PID=$(systemctl show kelion-bridge -p MainPID --value 2>/dev/null || echo 0)
            for pid in $(pgrep -f 'kelion-bridge.*\.mjs' 2>/dev/null || true); do
              if [ "$pid" != "$MAIN_PID" ]; then
                kill "$pid" 2>/dev/null && echo "proces orfan oprit: pid $pid" || true
              fi
            done

            # 4) Repornește serviciile cu secretul + codul corecte.
            # LECȚIE (11 iul, rulările #24/#25): verificarea cu `list-unit-files |
            # grep` era NEDETERMINISTĂ — la #24 a sărit builder+deployer, la #25
            # exact invers a sărit bridge+paznic → puntea a rămas cu codul VECHI
            # în memorie deși fișierul nou era pe disc. Acum: încercăm DIRECT
            # restartul pe fiecare; eșecul se vede explicit, nu se maschează.
            for svc in kelion-bridge kelion-paznic kelion-builder kelion-deployer; do
              if systemctl restart "$svc" 2>/dev/null; then
                echo "restart $svc → $(systemctl is-active "$svc")"
              else
                echo "::warning::restart $svc A EȘUAT (unitate lipsă sau eroare reală) — verifică manual"
              fi
            done
            sleep 4
            echo "=== procese worker/punte DUPĂ ==="
            pgrep -af 'kelion-bridge|bridge-linux' || echo "(niciunul!)"
            echo "=== jurnal punte ==="
            journalctl -u kelion-bridge -n 10 --no-pager -o cat | tail -10
          EOS

          # Verifică live că workerul e online după restart.
          if [ -n "${SECRET:-}" ]; then
            echo "=== verificare live /api/bridge/health ==="
            ok=0
            for i in $(seq 1 6); do
              sleep 8
              ST=$(curl -sS --max-time 15 -H "x-bridge-secret: $SECRET" https://kelionai.app/api/bridge/health || echo '{}')
              echo "$ST"
              if echo "$ST" | grep -q '"online":true'; then ok=1; break; fi
            done
            [ "$ok" = 1 ] && echo "✅ Puntea online cu codul nou (streaming activ)." || echo "::warning::Puntea încă nu raportează online."
          fi
