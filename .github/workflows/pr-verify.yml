# VERIFICARE INFORMATIVĂ A PR-URILOR — 25 iul 2026.
#
# ORDINUL LUI ADRIAN („ridici absolut toate restricțiile lui Kelion"): această
# verificare NU blochează nimic — Kelion își dă merge fără să aștepte după ea
# (repo_merge_pr doar raportează rezultatul ei, informativ). Există ca să
# existe FAPTE (build + teste) lângă fiecare PR, pentru Kelion și pentru Adrian.
name: pr-verify

on:
  pull_request:
    branches: [master]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Backend — typecheck + teste
        run: |
          cd backend
          npm install --no-audit --no-fund
          npm run typecheck
          npm test
      - name: Frontend — build
        run: |
          cd frontend
          npm install --no-audit --no-fund
          npm run build
      # PRINCIPIUL PERMANENT: unic, fără duplicate (Adrian, 29 iul). Detectorul de
      # cod duplicat (jscpd, config în .jscpd.json) rulează la FIECARE PR și
      # raportează clonele; pică (roșu) dacă duplicarea urcă peste 2% (azi ~1,5%).
      # Informativ ca tot pr-verify — nu blochează merge-ul (ordinul „CI informativ"),
      # dar face duplicarea VIZIBILĂ automat, ca să nu se mai strecoare pe ascuns.
      - name: Duplicare (jscpd) — principiul unic-fără-duplicate
        continue-on-error: true
        run: npx --yes jscpd --threshold 2
