# VERIFICARE INFORMATIVĂ A PR-URILOR — 25 iul 2026.
#
# ORDINUL LUI ADRIAN („ridici absolut toate restricțiile lui Kelion"): această
# verificare NU blochează nimic — Kelion își dă merge fără să aștepte după ea
# (repo_merge_pr doar raportează rezultatul ei, informativ). Există ca să
# existe FAPTE (build + teste) lângă fiecare PR, pentru Kelion și pentru Adrian.
name: pr-verify

on:
  pull_request:
    branches: [master]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Backend — typecheck + teste
        run: |
          cd backend
          npm install --no-audit --no-fund
          npm run typecheck
          npm test
      - name: Frontend — build
        run: |
          cd frontend
          npm install --no-audit --no-fund
          npm run build
      # ── CELE TREI ZERO-URI (Adrian, 30 iul: „0 cod duplicat, 0 cod abandonat" +
      # „caut în tot softul acolade, ghilimele sau alte semne greșit puse") ──────
      # Toate trei sunt INFORMATIVE (nu blochează merge-ul — ordinul „CI informativ"),
      # dar se fac ROȘII imediat ce cifra se strică. Fiecare a fost DOVEDITĂ prin
      # test cu greșeală intenționată: prinde, iar pe cod curat trece.
      #
      # 1. DUPLICAT = 0. Pragul 0,0001% e practic zero-toleranță (testat: o clonă
      #    de 10 linii → exit 1; codul curat → exit 0). Un prag mai mare NU prindea
      #    clonele mici: la 0,1%, două clone reale treceau verde.
      - name: Cod duplicat (jscpd) — ținta 0
        continue-on-error: true
        run: npx --yes jscpd --threshold 0.0001
      # 2. ABANDONAT = 0. Importuri, variabile, funcții și tipuri nefolosite —
      #    exact ce lasă în urmă o refactorare grăbită (au fost 56 pe 30 iul).
      - name: Cod abandonat (oxlint) — ținta 0
        continue-on-error: true
        run: |
          cd backend && npx oxlint --deny no-unused-vars

      # oxlint vede doar ÎN fișier. Codul mort care contează sunt EXPORTURILE pe
      # care nu le importă nimeni — 16 găsite la auditul din 29 iul, toate „verzi"
      # până atunci fiindcă nicio poartă nu se uita acolo.
      - name: Exporturi fără utilizator — ținta 0
        continue-on-error: true
        run: node scripts/verifica-exporturi.mjs
      # 3. SEMNE GREȘIT PUSE = 0. `tsc` acoperă .ts/.tsx, dar CSS-ul și JSON-ul nu
      #    sunt verificate de nimeni: un `}` în plus în CSS strică tăcut restul
      #    foii de stil, iar un JSON rupt oprește pornirea abia în producție.
      - name: Sintaxă CSS + JSON (acolade, ghilimele)
        continue-on-error: true
        run: node scripts/verifica-sintaxa.mjs
