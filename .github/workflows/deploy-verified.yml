# DEPLOY VERIFICAT REAL — publică ramura de dezvoltare la ORICE schimbare de cod
# și dovedește că noul build chiar a preluat traficul (nu doar /health=200).
#
# „Deploy la fiecare" (Adrian, 10 iul): fiecare push care atinge codul backend/
# frontend/Docker publică automat pe producție ȘI verifică. Dovada preluării:
# /api/version raportează momentul pornirii containerului — după publicare cerem
# să DIFERE de cel de dinainte. Așa nu se mai poate declara fals „reușit".
name: deploy-verified

on:
  workflow_dispatch:
  push:
    branches: [claude/chat-instant-delay-em5gjf]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'Dockerfile'
      - 'railway.json'
      - '.github/workflows/deploy-verified.yml'

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Publicăm ramura de dezvoltare (are codul verificat local). Când PR-ul intră
      # în master, deploy.yml (întărit) republică master identic.
      - uses: actions/checkout@v4
        with:
          ref: claude/chat-instant-delay-em5gjf

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalează Railway CLI
        run: npm i -g @railway/cli

      - name: Amprenta versiunii de dinainte
        id: before
        run: |
          V=$(curl -s --max-time 8 https://kelionai.app/api/version || echo '{}')
          echo "Versiune înainte: $V"
          echo "ver=$V" >> "$GITHUB_OUTPUT"

      - name: Găsește ținta (proiect + mediu + serviciu)
        id: target
        env:
          TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$TOKEN" ]; then echo "::error::RAILWAY_TOKEN lipsește"; exit 1; fi
          Q='{"query":"query{projects{edges{node{id name environments{edges{node{id name}}} services{edges{node{id name}}}}}}}"}'
          RESP=$(curl -sS --max-time 30 https://backboard.railway.com/graphql/v2 \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -d "$Q" || echo '{}')
          P=$(echo "$RESP" | jq '[.data.projects.edges[].node | select(.name|test("kelion";"i"))][0] // .data.projects.edges[0].node')
          PID=$(echo "$P" | jq -r '.id')
          ENVID=$(echo "$P" | jq -r '[.environments.edges[].node|select(.name=="production")][0].id // .environments.edges[0].node.id')
          SVC=$(echo "$P" | jq -r '[.services.edges[].node|select(.name=="web")][0].name // .services.edges[0].node.name')
          echo "Țintă: proiect $(echo "$P"|jq -r .name), serviciu $SVC"
          { echo "project_id=$PID"; echo "env_id=$ENVID"; echo "service=$SVC"; } >> "$GITHUB_OUTPUT"

      - name: Publică pe Railway (context proaspăt din ramură)
        env:
          TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          PROJECT_ID: ${{ steps.target.outputs.project_id }}
          ENV_ID: ${{ steps.target.outputs.env_id }}
          SERVICE: ${{ steps.target.outputs.service }}
        run: |
          set -euo pipefail
          GQL=https://backboard.railway.com/graphql/v2
          TNAME="ghv-${GITHUB_RUN_ID}"
          MUT=$(jq -nc --arg n "$TNAME" --arg p "$PROJECT_ID" --arg e "$ENV_ID" \
            '{query:"mutation($n:String!,$p:String!,$e:String!){projectTokenCreate(input:{name:$n,projectId:$p,environmentId:$e})}",variables:{n:$n,p:$p,e:$e}}')
          PT=$(curl -sS --max-time 30 "$GQL" -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" -d "$MUT" | jq -r '.data.projectTokenCreate // empty')
          if [ -z "$PT" ]; then echo "::error::projectTokenCreate a refuzat"; exit 1; fi
          echo "::add-mask::$PT"
          cleanup() {
            DELQ=$(jq -nc --arg p "$PROJECT_ID" '{query:"query($p:String!){projectTokens(projectId:$p){edges{node{id name}}}}",variables:{p:$p}}')
            TID=$(curl -sS --max-time 30 "$GQL" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -d "$DELQ" \
              | jq -r --arg n "$TNAME" '.data.projectTokens.edges[]?.node|select(.name==$n)|.id' | head -1)
            [ -n "$TID" ] && curl -sS --max-time 30 "$GQL" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
              -d "$(jq -nc --arg i "$TID" '{query:"mutation($i:String!){projectTokenDelete(id:$i)}",variables:{i:$i}}')" >/dev/null || true
          }
          trap cleanup EXIT
          export RAILWAY_TOKEN="$PT"; unset RAILWAY_API_TOKEN || true
          railway up --service "$SERVICE" --ci

      - name: VERIFICĂ REAL că noul build a preluat (versiunea s-a schimbat)
        env:
          BEFORE: ${{ steps.before.outputs.ver }}
        run: |
          set -uo pipefail
          echo "Versiune înainte: $BEFORE"
          ok=""
          for i in $(seq 1 48); do
            NOW=$(curl -s --max-time 8 https://kelionai.app/api/version || echo '{}')
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 8 https://kelionai.app/health || echo 000)
            echo "încercarea $i → HTTP $code   version=$NOW"
            if [ "$code" = "200" ] && [ -n "$NOW" ] && [ "$NOW" != "$BEFORE" ] && [ "$NOW" != "{}" ]; then
              ok="1"; break
            fi
            sleep 5
          done
          if [ -z "$ok" ]; then
            echo "::error::Deploy trimis, DAR versiunea live nu s-a schimbat după ~4 min — producția a rămas pe build vechi."
            exit 1
          fi
          echo "🟢 PUBLICAT + VERIFICAT LIVE — versiunea s-a schimbat, noul build a preluat."
