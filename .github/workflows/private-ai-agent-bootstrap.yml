name: bootstrap-private-ai-agent

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Operatie fixa pentru agentul AI privat
        required: true
        type: choice
        options:
          - preflight
          - install
          - status

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    env:
      VPS_HOST: ${{ vars.VPS_HOST }}
      VPS_USER: ${{ vars.VPS_USER }}
      VPS_HOST_KEY: ${{ vars.VPS_HOST_KEY }}
      SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      AGENT_GITHUB_TOKEN: ${{ secrets.VPS_GITHUB_TOKEN }}
    steps:
      - name: Validateaza tinta fixa
        run: |
          set -Eeuo pipefail
          [ -n "$VPS_HOST" ]
          [ "$VPS_USER" = root ]
          [ -n "$VPS_HOST_KEY" ]
          [ -n "$SSH_KEY" ]
          case "${{ inputs.operation }}" in preflight|install|status) ;; *) exit 1 ;; esac

      - name: Ruleaza bootstrap-ul fix pe Contabo
        env:
          OPERATION: ${{ inputs.operation }}
        run: |
          set -Eeuo pipefail
          umask 077
          key_file=$(mktemp)
          known_hosts=$(mktemp)
          token_file=''
          remote_token='-'
          cleanup() {
            [ -z "$token_file" ] || rm -f -- "$token_file"
            [ -z "$key_file" ] || rm -f -- "$key_file"
            [ -z "$known_hosts" ] || rm -f -- "$known_hosts"
          }
          trap cleanup EXIT
          printf '%s\n' "$SSH_KEY" > "$key_file"
          printf '%s\n' "$VPS_HOST_KEY" > "$known_hosts"
          chmod 0600 "$key_file" "$known_hosts"
          ssh_opts=(-i "$key_file" -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known_hosts" -o HostKeyAlgorithms=ssh-ed25519 -o BatchMode=yes -o ConnectTimeout=25 -o ServerAliveInterval=30 -o ServerAliveCountMax=10)

          if [ "$OPERATION" = install ]; then
            [ -n "$AGENT_GITHUB_TOKEN" ]
            [ "${#AGENT_GITHUB_TOKEN}" -ge 32 ]
            token_file=$(mktemp)
            printf '%s' "$AGENT_GITHUB_TOKEN" > "$token_file"
            chmod 0600 "$token_file"
            remote_token="/root/kelion-ai-agent-token.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"
            scp "${ssh_opts[@]}" "$token_file" "$VPS_USER@$VPS_HOST:$remote_token"
            ssh "${ssh_opts[@]}" "$VPS_USER@$VPS_HOST" "chmod 0600 '$remote_token'; [ \"\$(stat -Lc '%u:%g:%a:%h' '$remote_token')\" = '0:0:600:1' ]"
          fi

          ssh "${ssh_opts[@]}" "$VPS_USER@$VPS_HOST" bash -s -- "$OPERATION" "$remote_token" <<'REMOTE'
          set -Eeuo pipefail
          operation=$1
          token_file=$2
          agent_root=/opt/kelion-agent
          agent_home=$agent_root/home
          workspace=$agent_root/workspace
          worktree=$workspace/kelionai
          opencode_config=$agent_home/.config/opencode/opencode.json

          cleanup_remote_token() {
            if [ "$token_file" != '-' ]; then
              rm -f -- "$token_file"
            fi
          }
          trap cleanup_remote_token EXIT

          require_root() {
            [ "$(id -u)" = 0 ]
          }

          preflight() {
            require_root
            . /etc/os-release
            [ "$ID" = ubuntu ]
            command -v systemctl >/dev/null
            command -v curl >/dev/null || true
            ram_mb=$(awk '/MemTotal:/ {print int($2 / 1024)}' /proc/meminfo)
            [ "$ram_mb" -ge 65536 ]
            available_mb=$(df -Pm /opt | awk 'NR == 2 {print $4}')
            [ "$available_mb" -ge 50000 ]
            printf 'PRECHECK_OK os=%s ram_mb=%s available_mb=%s\n' "$VERSION_ID" "$ram_mb" "$available_mb"
          }

          install_agent() {
            preflight
            [ "$token_file" != '-' ]
            [ -f "$token_file" ] && [ ! -L "$token_file" ]
            [ "$(stat -Lc '%u:%g:%a:%h' "$token_file")" = '0:0:600:1' ]
            agent_github_token=$(cat "$token_file")
            [ -n "$agent_github_token" ] && [ "${#agent_github_token}" -ge 32 ]

            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            apt-get install -y --no-install-recommends ca-certificates curl git jq

            if ! command -v ollama >/dev/null 2>&1; then
              curl --fail --silent --show-error --proto '=https' --tlsv1.2 https://ollama.com/install.sh -o /tmp/ollama-install.sh
              sh /tmp/ollama-install.sh
              rm -f -- /tmp/ollama-install.sh
            fi
            command -v ollama >/dev/null
            install -d -m 0755 /etc/systemd/system/ollama.service.d
            cat > /etc/systemd/system/ollama.service.d/kelion-ai-agent.conf <<'OLLAMA'
            [Service]
            Environment="OLLAMA_HOST=127.0.0.1:11434"
            Environment="OLLAMA_NUM_PARALLEL=1"
            Environment="OLLAMA_MAX_LOADED_MODELS=1"
            Environment="OLLAMA_KEEP_ALIVE=30m"
            OLLAMA
            systemctl daemon-reload
            systemctl enable --now ollama.service
            for attempt in $(seq 1 30); do
              if curl --fail --silent --show-error --max-time 2 http://127.0.0.1:11434/api/tags >/dev/null; then
                break
              fi
              [ "$attempt" -lt 30 ] || exit 1
              sleep 2
            done

            export PATH="/root/.opencode/bin:/root/.local/bin:$PATH"
            if ! command -v opencode >/dev/null 2>&1; then
              curl --fail --silent --show-error --proto '=https' --tlsv1.2 https://opencode.ai/install -o /tmp/opencode-install.sh
              sh /tmp/opencode-install.sh
              rm -f -- /tmp/opencode-install.sh
            fi
            opencode_bin=$(command -v opencode || true)
            if [ -z "$opencode_bin" ]; then
              opencode_bin=$(find /root/.opencode /root/.local -type f -name opencode -perm -u+x 2>/dev/null | head -n 1)
            fi
            [ -n "$opencode_bin" ] && [ -x "$opencode_bin" ]
            install -m 0755 "$opencode_bin" /usr/local/bin/opencode
            /usr/local/bin/opencode --version

            install -d -m 0700 "$agent_root" "$agent_home" "$workspace"
            if [ ! -d "$worktree/.git" ]; then
              git clone --depth 1 https://github.com/kelion-team/kelionai.git "$worktree"
            fi
            git -C "$worktree" remote set-url origin https://github.com/kelion-team/kelionai.git
            git -C "$worktree" config credential.helper "store --file=$agent_home/.git-credentials"
            printf 'https://x-access-token:%s@github.com\n' "$agent_github_token" > "$agent_home/.git-credentials"
            chmod 0600 "$agent_home/.git-credentials"
            git -C "$worktree" ls-remote --exit-code origin refs/heads/master >/dev/null
            agent_github_token=''

            install -d -m 0700 "$agent_home/.config/opencode"
            cat > "$agent_home/instructions.md" <<'INSTRUCTIONS'
            You are Adrian's direct coding agent for Kelion.
            Act only in response to a command received in this private Web UI. Do not schedule work or start autonomous jobs.
            You have direct access to the isolated Kelion repository and this Contabo host. Use it only to carry out the user's stated task.
            Keep the user informed with concrete command results, tests and diffs. Never reveal credentials, tokens or secrets.
            Production deployment is performed only when the user explicitly asks to deploy in the chat.
            INSTRUCTIONS
            cat > "$opencode_config" <<'OPENCODE'
            {
              "$schema": "https://opencode.ai/config.json",
              "model": "ollama/qwen3-coder:30b",
              "small_model": "ollama/qwen3-coder:30b",
              "autoupdate": false,
              "share": "disabled",
              "enabled_providers": ["ollama"],
              "server": {
                "hostname": "127.0.0.1",
                "port": 4096
              },
              "permissions": [
                { "action": "*", "resource": "*", "effect": "allow" }
              ],
              "instructions": ["/opt/kelion-agent/home/instructions.md"]
            }
            OPENCODE
            chmod 0600 "$opencode_config" "$agent_home/instructions.md"

            ollama pull qwen3-coder:30b
            ollama list | grep -q '^qwen3-coder:30b[[:space:]]'

            cat > /etc/systemd/system/kelion-ai-agent.service <<'UNIT'
            [Unit]
            Description=Private Kelion coding agent
            After=network-online.target ollama.service
            Wants=network-online.target

            [Service]
            Type=simple
            User=root
            WorkingDirectory=/opt/kelion-agent/workspace/kelionai
            Environment=HOME=/opt/kelion-agent/home
            Environment=PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
            ExecStart=/usr/local/bin/opencode web --hostname 127.0.0.1 --port 4096
            Restart=on-failure
            RestartSec=5
            TimeoutStartSec=120

            [Install]
            WantedBy=multi-user.target
            UNIT
            systemctl daemon-reload
            systemctl enable --now kelion-ai-agent.service
          }

          status() {
            require_root
            systemctl is-active --quiet ollama.service
            systemctl is-active --quiet kelion-ai-agent.service
            curl --fail --silent --show-error --max-time 10 http://127.0.0.1:4096/global/health >/dev/null
            ollama list | grep -q '^qwen3-coder:30b[[:space:]]'
            ss -ltnH | grep -Eq '127\.0\.0\.1:4096[[:space:]]'
            if ss -ltnH | grep -Eq '(0\.0\.0\.0|\[::\]):4096[[:space:]]'; then
              exit 1
            fi
            ss -ltnH | grep -Eq '127\.0\.0\.1:11434[[:space:]]'
            if ss -ltnH | grep -Eq '(0\.0\.0\.0|\[::\]):11434[[:space:]]'; then
              exit 1
            fi
            git -C "$worktree" rev-parse --is-inside-work-tree | grep -qx true
            git -C "$worktree" remote get-url origin | grep -qx 'https://github.com/kelion-team/kelionai.git'
            printf 'AGENT_STATUS_OK ui=127.0.0.1:4096 model=qwen3-coder:30b workspace=%s\n' "$worktree"
          }

          case "$operation" in
            preflight) preflight ;;
            install) install_agent; status ;;
            status) status ;;
            *) exit 1 ;;
          esac
          REMOTE
