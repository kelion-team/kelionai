# Android release: construiește AAB-ul semnat (TWA) și îl urcă în Google Play.
# Rulează în cloud, exact ca ios-release.yml — pui secretele o singură dată, apoi
# declanșezi din tabul Actions (workflow_dispatch). Conținutul aplicației vine din
# web (kelionai.app), deci re-upload trebuie DOAR când se schimbă învelișul.
#
# Secrete (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64     - base64 din android.keystore
#                                 (PowerShell: [Convert]::ToBase64String([IO.File]::ReadAllBytes("android.keystore")))
#   ANDROID_KEYSTORE_PASSWORD   - parola keystore-ului
#   ANDROID_KEY_ALIAS           - alias-ul cheii (ex. kelionai)
#   ANDROID_KEY_PASSWORD        - parola cheii
#   PLAY_SERVICE_ACCOUNT_JSON   - conținutul JSON al contului de serviciu Play
#                                 (Play Console → Setup → API access → Service Account, rol Release manager)
name: android-release
on:
  workflow_dispatch:

jobs:
  build-upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Scrie keystore-ul din secret
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "${{ runner.temp }}/android.keystore"

      - name: Build AAB semnat (gradlew bundleRelease)
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/android.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew bundleRelease --no-daemon

      - name: Urcă în Google Play (production)
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: node android/publish-play.mjs
