# Release Android manual: verifică TWA/Digital Asset Links, construiește AAB-ul
# semnat și îl urcă în Google Play numai după aprobarea mediului production.
#
# Secrete (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64     - base64 din android.keystore
#                                 (PowerShell: [Convert]::ToBase64String([IO.File]::ReadAllBytes("android.keystore")))
#   ANDROID_KEYSTORE_PASSWORD   - parola keystore-ului
#   ANDROID_KEY_ALIAS           - alias-ul cheii (ex. kelionai)
#   ANDROID_KEY_PASSWORD        - parola cheii
#   PLAY_SERVICE_ACCOUNT_JSON   - conținutul JSON al contului de serviciu Play
#                                 (Play Console → Setup → API access → Service Account, rol Release manager)
name: android-release
on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Commitul integral, deja verde pe master
        required: true
        type: string
      version_code:
        description: Version code monoton, mai mare decât Play
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  build-upload:
    environment: google-play-production
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      RELEASE_SHA: ${{ inputs.release_sha }}
      KELION_ANDROID_VERSION_CODE: ${{ inputs.version_code }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verifică commitul master și CI-ul exact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$KELION_ANDROID_VERSION_CODE" =~ ^[1-9][0-9]{0,9}$ ]]
          [ "$(git rev-parse HEAD)" = "$RELEASE_SHA" ]
          git fetch --no-tags origin master
          [ "$(git rev-parse origin/master)" = "$RELEASE_SHA" ]
          success=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/pr-verify.yml/runs?head_sha=$RELEASE_SHA&status=completed&per_page=20" \
            --jq '[.workflow_runs[] | select(.conclusion == "success")] | length')
          [ "$success" -ge 1 ] || { echo '::error::Commitul nu are pr-verify verde.'; exit 1; }
          baseline=$(node -p "require('./config/product.json').androidVersionCode")
          [ "$KELION_ANDROID_VERSION_CODE" -gt "$baseline" ] || { echo '::error::version_code trebuie să depășească baseline-ul versionat.'; exit 1; }

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Instalează SDK-ul Android exact
        run: sdkmanager --install 'platforms;android-36' 'build-tools;35.0.0'

      - name: Verifică suprafața nativă și wrapperul Gradle
        run: |
          npm --prefix android ci --no-audit --no-fund
          node scripts/verifica-clienti-nativi.mjs
          printf '%s  %s\n' '2db75c40782f5e8ba1fc278a5574bab070adccb2d21ca5a6e5ed840888448046' 'android/gradle/wrapper/gradle-wrapper.jar' | sha256sum --check --strict

      - name: Generează configurația TWA numai în workspace-ul efemer de build
        run: node scripts/genereaza-config-platforme.mjs --target android

      - name: Scrie keystore-ul din secret
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PATH: ${{ runner.temp }}/android.keystore
        run: |
          set -euo pipefail
          umask 077
          [ -n "$KEYSTORE_BASE64" ] || { echo "::error::ANDROID_KEYSTORE_BASE64 lipsește."; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"

      - name: Build AAB semnat (gradlew bundleRelease)
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/android.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          [ -n "$ANDROID_KEYSTORE_PATH" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ] || { echo "::error::Materialul de semnare Android este incomplet."; exit 1; }
          chmod +x ./gradlew
          ./gradlew bundleRelease --no-daemon --dependency-verification=strict

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Semnează proveniența AAB-ului exact
        run: |
          set -euo pipefail
          aab=android/app/build/outputs/bundle/release/app-release.aab
          test -s "$aab"
          cosign sign-blob --yes --bundle android/app-release.sigstore.json "$aab"
          sha256sum "$aab" > android/app-release.sha256

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-${{ inputs.release_sha }}-${{ inputs.version_code }}
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app-release.sigstore.json
            android/app-release.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Urcă în Google Play (production)
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          [ -n "$PLAY_SERVICE_ACCOUNT_JSON" ] || { echo "::error::PLAY_SERVICE_ACCOUNT_JSON lipsește."; exit 1; }
          node android/publish-play.mjs

      - name: Curăță materialul de semnare
        if: ${{ always() }}
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/android.keystore
        run: rm -f -- "$KEYSTORE_PATH"
