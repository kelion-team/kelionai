name: sentinel

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch: {}

permissions:
  issues: write

concurrency:
  group: production-sentinel
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PUBLIC_APP_ORIGIN: ${{ vars.PUBLIC_APP_ORIGIN }}
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
    steps:
      - name: Probează liveness/readiness și menține o singură alertă
        run: |
          set -euo pipefail
          node -e 'const u=new URL(process.argv[1]);if(u.protocol!=="https:"||u.username||u.password||u.pathname!=="/"||u.search||u.hash)process.exit(1)' "$PUBLIC_APP_ORIGIN"
          now=$(TZ=Europe/London date +'%Y-%m-%d %H:%M:%S %Z')
          down=1
          live=000
          ready=000
          for attempt in 1 2 3; do
            live=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 15 "$PUBLIC_APP_ORIGIN/livez" || true)
            ready=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 15 "$PUBLIC_APP_ORIGIN/readyz" || true)
            printf 'attempt=%s livez=%s readyz=%s\n' "$attempt" "${live:-000}" "${ready:-000}"
            if [ "$live" = 200 ] && [ "$ready" = 200 ]; then down=0; break; fi
            sleep 30
          done
          open_issue=$(gh issue list --repo "$REPOSITORY" --state open --search 'SENTINEL in:title' --json number --jq '.[0].number // empty' || true)
          if [ "$down" = 0 ]; then
            if [ -n "$open_issue" ]; then
              printf 'RECOVERED (%s): /livez=200, /readyz=200.\n' "$now" > /tmp/sentinel-body.md
              gh issue comment "$open_issue" --repo "$REPOSITORY" --body-file /tmp/sentinel-body.md
              gh issue close "$open_issue" --repo "$REPOSITORY"
            fi
            exit 0
          fi
          {
            printf 'Production readiness failed three consecutive probes (%s).\n\n' "$now"
            printf -- '- `/livez`: `%s`\n- `/readyz`: `%s`\n\n' "${live:-000}" "${ready:-000}"
            printf 'Run the read-only `vps-diag` workflow, then use the approved immutable release/rollback workflow.\n'
          } > /tmp/sentinel-body.md
          if [ -n "$open_issue" ]; then
            gh issue comment "$open_issue" --repo "$REPOSITORY" --body-file /tmp/sentinel-body.md
          else
            gh issue create --repo "$REPOSITORY" --title 'SENTINEL: production is not ready' --body-file /tmp/sentinel-body.md
          fi
          exit 1
