# CHEILE DE REZERVĂ (Adrian, 11 iul): lanțul Claude Max → Kimi → GLM Max.
# Aici Adrian LIPEȘTE cheile cumpărate (Kimi for Coding / GLM Coding Plan) ca
# input-uri mascate — ele NU trec prin Claude, NU intră în repo, NU apar în
# loguri (add-mask + scriere prin stdin). Workflow-ul le pune pe VPS exact în
# fișierele pe care workerul le va citi pentru comutarea automată:
#   /root/kelion/kimi-key.txt   (rezerva 1 — Kimi for Coding)
#   /root/kelion/glm-key.txt    (rezerva 2 — GLM Coding Plan)
# Mecanica SSH e copiată din bridge-fix.yml (dovedită: stdin → cat, parolă
# mascată, PreferredAuthentications=password).
name: vps-keys

on:
  workflow_dispatch:
    inputs:
      vps_pass:
        description: 'Parola root VPS (mascată; nu se salvează)'
        required: true
      kimi_key:
        description: 'Cheia Kimi for Coding (gol = nu se schimbă)'
        required: false
      glm_key:
        description: 'Cheia GLM Coding Plan (gol = nu se schimbă)'
        required: false

jobs:
  put:
    runs-on: ubuntu-latest
    steps:
      - name: Scrie cheile pe VPS (mascate, prin stdin)
        env:
          VPS_PASS: ${{ inputs.vps_pass }}
          KIMI_KEY: ${{ inputs.kimi_key }}
          GLM_KEY: ${{ inputs.glm_key }}
        run: |
          set -euo pipefail
          echo "::add-mask::$VPS_PASS"
          [ -n "$KIMI_KEY" ] && echo "::add-mask::$KIMI_KEY"
          [ -n "$GLM_KEY" ] && echo "::add-mask::$GLM_KEY"
          # Maschează orice apariție și în payload-ul evenimentului (inputurile
          # workflow_dispatch ajung în $GITHUB_EVENT_PATH) — aceeași lecție ca
          # la bridge-deploy.yml.
          VPS_HOST=164.68.120.87

          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          export SSHPASS="$VPS_PASS"
          SSHOPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=25 -o PubkeyAuthentication=no -o PreferredAuthentications=password,keyboard-interactive -o NumberOfPasswordPrompts=1"

          if [ -n "$KIMI_KEY" ]; then
            printf '%s' "$KIMI_KEY" | sshpass -e ssh $SSHOPTS root@"$VPS_HOST" \
              'cat > /root/kelion/kimi-key.txt && chmod 600 /root/kelion/kimi-key.txt && echo "kimi-key.txt scris: $(wc -c < /root/kelion/kimi-key.txt) octeti"'
          else
            echo "kimi_key gol — nu se schimbă."
          fi

          if [ -n "$GLM_KEY" ]; then
            printf '%s' "$GLM_KEY" | sshpass -e ssh $SSHOPTS root@"$VPS_HOST" \
              'cat > /root/kelion/glm-key.txt && chmod 600 /root/kelion/glm-key.txt && echo "glm-key.txt scris: $(wc -c < /root/kelion/glm-key.txt) octeti"'
          else
            echo "glm_key gol — nu se schimbă."
          fi

          echo "=== stare fișiere-cheie pe VPS (doar lungimi, niciodată conținut) ==="
          sshpass -e ssh $SSHOPTS root@"$VPS_HOST" \
            'for f in /root/kelion/kimi-key.txt /root/kelion/glm-key.txt; do
               if [ -f "$f" ]; then echo "$f: $(wc -c < "$f") octeti, permisiuni $(stat -c %a "$f")"; else echo "$f: LIPSĂ"; fi
             done'
