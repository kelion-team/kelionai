# CHEILE DE REZERVĂ pe VPS — CITITE DIN REPO SECRETS (nu mai tastate).
#
# AUTENTIFICARE (22 iul 2026): VPS-ul NU mai acceptă parolă — doar CHEIE SSH
# (dovadă: „Permission denied (publickey)" pe orice sshpass+parolă). La fel ca
# vps-run.yml, intrăm cu secretul `VPS_SSH_KEY` (fișierul privat kelion-vps).
#
# SECURITATE (Adrian, 12 iul): valorile sensibile NU sunt input-uri (care se scurg
# în log). Vin din GitHub Secrets, mascate AUTOMAT de GitHub de la începutul
# job-ului — nu apar NICIODATĂ în clar. Singurul input rămas e o ALEGERE (ce cheie
# scriem acum), care nu e un secret.
#
# ── CE TREBUIE SETAT O SINGURĂ DATĂ (Settings → Secrets and variables → Actions):
#   VPS_SSH_KEY        — cheia SSH privată a VPS-ului (OBLIGATORIU, kelion-vps)
#   KIMI_KEY           — cheia Kimi for Coding (dacă vrei s-o scrii/rotești)
#   GLM_KEY            — cheia GLM Coding Plan
#   VPS_GITHUB_TOKEN   — token GitHub fin-granulat pentru VPS
#   GEMINI_API_KEY     — cheia Gemini (AI Studio) — creierul aplicației
#
# (Opțiunea `openai_usage` a fost ȘTEARSĂ — auditul admin, 3 aug: cititorul ei,
# openaiCosts.ts, nu mai există (OpenAI extirpat). Rularea planta un cadavru în
# env-ul live; pasul de stare de la final curăță acum linia rămasă pe VPS.)
#
# Scrie pe VPS exact în fișierele pe care le citește workerul:
#   /root/kelion/kimi-key.txt · /root/kelion/glm-key.txt ·
#   /root/kelion/github-token.txt
# iar GEMINI_API_KEY în env-file-ul aplicației (/root/kelion/kelionai.env).
name: vps-keys

on:
  workflow_dispatch:
    inputs:
      which:
        description: 'Ce cheie scrii pe VPS acum (valoarea vine din Repo Secrets, NU se tastează)'
        required: true
        type: choice
        options: [kimi, glm, github, gemini, jules, all]

jobs:
  put:
    runs-on: ubuntu-latest
    steps:
      - name: Scrie cheile pe VPS (din Secrets, mascate automat; SSH cu cheie)
        env:
          # Toate din secrets.* → GitHub le maschează de la începutul job-ului,
          # deci NU apar în clar în env-group (spre deosebire de input-uri).
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KIMI_KEY: ${{ secrets.KIMI_KEY }}
          GLM_KEY: ${{ secrets.GLM_KEY }}
          GH_KEY: ${{ secrets.VPS_GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          WHICH: ${{ inputs.which }}
        run: |
          set -euo pipefail
          if [ -z "$SSH_KEY" ]; then
            echo "::error::Lipsește secretul VPS_SSH_KEY (Settings → Secrets → Actions). Fără el nu se poate intra pe VPS (doar cheie, nu parolă)."; exit 1
          fi
          VPS_HOST=164.68.120.87
          umask 077
          printf '%s\n' "$SSH_KEY" > /tmp/vps_key
          chmod 600 /tmp/vps_key
          SSHOPTS="-i /tmp/vps_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=25 -o BatchMode=yes"

          want() { [ "$WHICH" = "all" ] || [ "$WHICH" = "$1" ]; }

          if want kimi; then
            [ -n "$KIMI_KEY" ] || { echo "::error::secretul KIMI_KEY lipsește"; exit 1; }
            printf '%s' "$KIMI_KEY" | ssh $SSHOPTS root@"$VPS_HOST" \
              'cat > /root/kelion/kimi-key.txt && chmod 600 /root/kelion/kimi-key.txt && echo "kimi-key.txt scris: $(wc -c < /root/kelion/kimi-key.txt) octeti"'
          fi

          if want glm; then
            [ -n "$GLM_KEY" ] || { echo "::error::secretul GLM_KEY lipsește"; exit 1; }
            printf '%s' "$GLM_KEY" | ssh $SSHOPTS root@"$VPS_HOST" \
              'cat > /root/kelion/glm-key.txt && chmod 600 /root/kelion/glm-key.txt && echo "glm-key.txt scris: $(wc -c < /root/kelion/glm-key.txt) octeti"'
          fi

          if want github; then
            [ -n "$GH_KEY" ] || { echo "::error::secretul VPS_GITHUB_TOKEN lipsește"; exit 1; }
            printf '%s' "$GH_KEY" | ssh $SSHOPTS root@"$VPS_HOST" \
              'cat > /root/kelion/github-token.txt && chmod 600 /root/kelion/github-token.txt && echo "github-token.txt scris: $(wc -c < /root/kelion/github-token.txt) octeti"'
          fi

          # (Pasul `openai_usage` a fost ȘTERS — auditul admin, 3 aug: cheia
          # nu mai are niciun cititor în cod; curățenia liniei rămase pe VPS
          # se face în blocul de stare de la final.)

          if want gemini; then
            # Cheia Gemini (AI Studio) în ENV-FILE — config.ts o citește din
            # process.env.GEMINI_API_KEY. Dedup, apoi TEST DE TIER pe loc: dacă
            # proiectul e plătit (Tier 2), apelul dă HTTP 200; dacă e tot free și
            # cota e atinsă, dă 429 „free_tier". Cheia rămâne mascată — arătăm doar
            # statusul + eventual metrica de cotă, niciodată valoarea.
            [ -n "$GEMINI_API_KEY" ] || { echo "::error::secretul GEMINI_API_KEY lipsește (Settings → Secrets → Actions → GEMINI_API_KEY)"; exit 1; }
            printf '%s' "$GEMINI_API_KEY" | ssh $SSHOPTS root@"$VPS_HOST" \
              'K=$(cat); F=/root/kelion/kelionai.env; touch "$F";
               grep -v "^GEMINI_API_KEY=" "$F" > "$F.tmp" 2>/dev/null || true; mv "$F.tmp" "$F";
               printf "GEMINI_API_KEY=%s\n" "$K" >> "$F"; chmod 600 "$F";
               echo "GEMINI_API_KEY scris in kelionai.env: ${#K} octeti";
               echo "--- TEST TIER (200 = merge / platit; 429 free_tier = inca free) ---";
               curl -sS -o /tmp/gt.json -w "HTTP %{http_code}\n" "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=$K" -H "Content-Type: application/json" -d "{\"contents\":[{\"parts\":[{\"text\":\"hi\"}]}]}";
               echo "semnal cota:"; grep -oE "free_tier|RESOURCE_EXHAUSTED|GenerateRequestsPerDay[A-Za-z]*|quotaValue[^}]*" /tmp/gt.json | head -4 || echo "(fara 429 — probabil 200, merge)"'
          fi

          if want jules; then
            # Cheia API Jules (agentul asincron Google, jules.google) în ENV-FILE —
            # serviciul jules.ts o citește din process.env.JULES_API_KEY. Dedup +
            # TEST PE LOC: listăm sursele (repo-urile legate) prin API — arătăm
            # DOAR codul HTTP și numărul de surse, niciodată cheia.
            [ -n "$JULES_API_KEY" ] || { echo "::error::secretul JULES_API_KEY lipsește (Settings → Secrets → Actions → JULES_API_KEY)"; exit 1; }
            printf '%s' "$JULES_API_KEY" | ssh $SSHOPTS root@"$VPS_HOST" \
              'K=$(cat); F=/root/kelion/kelionai.env; touch "$F";
               grep -v "^JULES_API_KEY=" "$F" > "$F.tmp" 2>/dev/null || true; mv "$F.tmp" "$F";
               printf "JULES_API_KEY=%s\n" "$K" >> "$F"; chmod 600 "$F";
               echo "JULES_API_KEY scris in kelionai.env: ${#K} octeti";
               echo "--- TEST API (200 = cheia e vie) ---";
               curl -sS -o /tmp/jl.json -w "HTTP %{http_code}\n" -H "X-Goog-Api-Key: $K" "https://jules.googleapis.com/v1alpha/sources";
               echo "surse legate (repo-uri):"; grep -o "\"name\"" /tmp/jl.json | wc -l;
               docker restart kelionai-app >/dev/null 2>&1 && echo "container repornit — cheia e in proces" || echo "restart esuat — cheia intra la urmatorul deploy"'
          fi

          echo "=== stare fișiere-cheie pe VPS (doar lungimi, niciodată conținut) ==="
          ssh $SSHOPTS root@"$VPS_HOST" \
            'for f in /root/kelion/kimi-key.txt /root/kelion/glm-key.txt /root/kelion/github-token.txt; do
               if [ -f "$f" ]; then echo "$f: $(wc -c < "$f") octeti, permisiuni $(stat -c %a "$f")"; else echo "$f: LIPSĂ"; fi
             done
             F=/root/kelion/kelionai.env
             # CURĂȚENIE (auditul admin, 3 aug): OPENAI_USAGE_KEY nu mai are
             # niciun cititor (openaiCosts.ts șters, OpenAI extirpat) — dacă
             # linia-cadavru mai există în env-ul live, o ștergem aici.
             if [ -f "$F" ] && grep -q "^OPENAI_USAGE_KEY=" "$F"; then
               grep -v "^OPENAI_USAGE_KEY=" "$F" > "$F.tmp" && mv "$F.tmp" "$F" && chmod 600 "$F"
               echo "kelionai.env: linia moartă OPENAI_USAGE_KEY a fost ȘTEARSĂ (cheia nu mai are cititor)"
             fi
             if [ -f "$F" ] && grep -q "^GEMINI_API_KEY=" "$F"; then
               echo "kelionai.env: GEMINI_API_KEY prezent ($(awk -F= "/^GEMINI_API_KEY=/{print length(\$2)}" "$F") octeti valoare)"
             else
               echo "kelionai.env: GEMINI_API_KEY LIPSĂ"
             fi'
