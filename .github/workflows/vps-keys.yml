# CHEILE DE REZERVĂ pe VPS — CITITE DIN REPO SECRETS (nu mai tastate).
#
# SECURITATE (Adrian, 12 iul — după ce vechea formă cu input-uri a afișat parola
# root în clar în env-group înainte de mascare): valorile sensibile NU mai sunt
# input-uri workflow_dispatch (care se scurg în log). Vin din GitHub Secrets,
# pe care GitHub le maschează AUTOMAT de la începutul job-ului — nu apar
# NICIODATĂ în clar, nicăieri. Singurul input rămas e o ALEGERE (ce cheie scriem
# acum), care nu e un secret.
#
# ── CE TREBUIE SETAT O SINGURĂ DATĂ (Settings → Secrets and variables → Actions):
#   VPS_ROOT_PASS      — parola root a VPS-ului (OBLIGATORIU)
#   KIMI_KEY           — cheia Kimi for Coding (dacă vrei s-o scrii/rotești)
#   GLM_KEY            — cheia GLM Coding Plan
#   VPS_GITHUB_TOKEN   — token GitHub fin-granulat pentru VPS
#   OPENAI_USAGE_KEY   — cheia Admin OpenAI (sk-admin-…) pentru /v1/organization/costs
#
# Scrie pe VPS exact în fișierele pe care le citește workerul:
#   /root/kelion/kimi-key.txt · /root/kelion/glm-key.txt ·
#   /root/kelion/github-token.txt
# iar OPENAI_USAGE_KEY în env-file-ul aplicației (/root/kelion/kelionai.env),
# fiindcă openaiCosts.ts o citește din process.env.OPENAI_USAGE_KEY.
name: vps-keys

on:
  workflow_dispatch:
    inputs:
      which:
        description: 'Ce cheie scrii pe VPS acum (valoarea vine din Repo Secrets, NU se tastează)'
        required: true
        type: choice
        options: [kimi, glm, github, openai_usage, all]

jobs:
  put:
    runs-on: ubuntu-latest
    steps:
      - name: Scrie cheile pe VPS (din Secrets, mascate automat)
        env:
          # Toate din secrets.* → GitHub le maschează de la începutul job-ului,
          # deci NU apar în clar în env-group (spre deosebire de input-uri).
          VPS_PASS: ${{ secrets.VPS_ROOT_PASS }}
          KIMI_KEY: ${{ secrets.KIMI_KEY }}
          GLM_KEY: ${{ secrets.GLM_KEY }}
          GH_KEY: ${{ secrets.VPS_GITHUB_TOKEN }}
          OPENAI_USAGE_KEY: ${{ secrets.OPENAI_USAGE_KEY }}
          WHICH: ${{ inputs.which }}
        run: |
          set -euo pipefail
          if [ -z "$VPS_PASS" ]; then
            echo "::error::Lipsește secretul VPS_ROOT_PASS (Settings → Secrets → Actions)."; exit 1
          fi
          VPS_HOST=164.68.120.87
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          export SSHPASS="$VPS_PASS"
          SSHOPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=25 -o PubkeyAuthentication=no -o PreferredAuthentications=password,keyboard-interactive -o NumberOfPasswordPrompts=1"

          want() { [ "$WHICH" = "all" ] || [ "$WHICH" = "$1" ]; }

          if want kimi; then
            [ -n "$KIMI_KEY" ] || { echo "::error::secretul KIMI_KEY lipsește"; exit 1; }
            printf '%s' "$KIMI_KEY" | sshpass -e ssh $SSHOPTS root@"$VPS_HOST" \
              'cat > /root/kelion/kimi-key.txt && chmod 600 /root/kelion/kimi-key.txt && echo "kimi-key.txt scris: $(wc -c < /root/kelion/kimi-key.txt) octeti"'
          fi

          if want glm; then
            [ -n "$GLM_KEY" ] || { echo "::error::secretul GLM_KEY lipsește"; exit 1; }
            printf '%s' "$GLM_KEY" | sshpass -e ssh $SSHOPTS root@"$VPS_HOST" \
              'cat > /root/kelion/glm-key.txt && chmod 600 /root/kelion/glm-key.txt && echo "glm-key.txt scris: $(wc -c < /root/kelion/glm-key.txt) octeti"'
          fi

          if want github; then
            [ -n "$GH_KEY" ] || { echo "::error::secretul VPS_GITHUB_TOKEN lipsește"; exit 1; }
            printf '%s' "$GH_KEY" | sshpass -e ssh $SSHOPTS root@"$VPS_HOST" \
              'cat > /root/kelion/github-token.txt && chmod 600 /root/kelion/github-token.txt && echo "github-token.txt scris: $(wc -c < /root/kelion/github-token.txt) octeti"'
          fi

          if want openai_usage; then
            # Cheia Admin OpenAI (sk-admin-…) merge în ENV-FILE, nu într-un .txt,
            # fiindcă openaiCosts.ts o citește din process.env.OPENAI_USAGE_KEY.
            # Dedup: ștergem orice linie veche OPENAI_USAGE_KEY= și adăugăm una singură.
            [ -n "$OPENAI_USAGE_KEY" ] || { echo "::error::secretul OPENAI_USAGE_KEY lipsește"; exit 1; }
            printf '%s' "$OPENAI_USAGE_KEY" | sshpass -e ssh $SSHOPTS root@"$VPS_HOST" \
              'K=$(cat); F=/root/kelion/kelionai.env; touch "$F";
               grep -v "^OPENAI_USAGE_KEY=" "$F" > "$F.tmp" 2>/dev/null || true; mv "$F.tmp" "$F";
               printf "OPENAI_USAGE_KEY=%s\n" "$K" >> "$F"; chmod 600 "$F";
               echo "OPENAI_USAGE_KEY scris in kelionai.env: ${#K} octeti (linii OPENAI_USAGE_KEY: $(grep -c "^OPENAI_USAGE_KEY=" "$F"))"'
          fi


          echo "=== stare fișiere-cheie pe VPS (doar lungimi, niciodată conținut) ==="
          sshpass -e ssh $SSHOPTS root@"$VPS_HOST" \
            'for f in /root/kelion/kimi-key.txt /root/kelion/glm-key.txt /root/kelion/github-token.txt; do
               if [ -f "$f" ]; then echo "$f: $(wc -c < "$f") octeti, permisiuni $(stat -c %a "$f")"; else echo "$f: LIPSĂ"; fi
             done
             F=/root/kelion/kelionai.env
             if [ -f "$F" ] && grep -q "^OPENAI_USAGE_KEY=" "$F"; then
               echo "kelionai.env: OPENAI_USAGE_KEY prezent ($(awk -F= "/^OPENAI_USAGE_KEY=/{print length(\$2)}" "$F") octeti valoare)"
             else
               echo "kelionai.env: OPENAI_USAGE_KEY LIPSĂ"
             fi'
