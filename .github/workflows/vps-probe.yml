name: vps-probe

on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Ce acceptă serverul (auth + parolă + porturi)
        env:
          VPS_PASS: ${{ secrets.VPS_ROOT_PASS }}
        run: |
          set +e
          VPS=164.68.120.87
          echo "=== 1. METODE DE AUTH oferite de server (definitiv) ==="
          ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              -o ConnectTimeout=15 -o PreferredAuthentications=none root@$VPS true 2>&1 \
            | grep -iE 'Authentications that can continue|Permission denied'
          echo
          echo "=== 2. TEST PAROLĂ cu opțiuni implicite (toate metodele permise) ==="
          sudo apt-get install -y -qq sshpass >/dev/null 2>&1
          sshpass -p "$VPS_PASS" ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              -o ConnectTimeout=15 -o NumberOfPasswordPrompts=1 root@$VPS \
              'echo PAROLA_MERGE; hostname; ls /root/kelion 2>/dev/null | head' 2>&1 | tail -6
          echo
          echo "=== 3. PORTURI deschise (poate alt SSH / panou) ==="
          for p in 22 2222 22222 2022 8022 8080 10000 9090 3000 8000 7880; do
            timeout 5 bash -c "echo > /dev/tcp/$VPS/$p" 2>/dev/null && echo "  $p DESCHIS" || echo "  $p inchis"
          done
