name: one-shot-diagnose-unit-effective-state

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  guard-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/heads/master
          fetch-depth: 0
          persist-credentials: false

      - name: Validează sursa canonică fără secrete
        shell: bash
        run: |
          set -Eeuo pipefail
          [ "$GITHUB_REPOSITORY" = kelion-team/kelionai ] # hardcod-permis: identitatea tehnică imuabilă a repository-ului canonic
          [ "$GITHUB_REF" = refs/heads/master ]
          [ "$GITHUB_REF_NAME" = master ]
          [ "$(git rev-parse HEAD)" = "$GITHUB_SHA" ]
          [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/master)" ]

  diagnose:
    needs: guard-source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      VPS_HOST: ${{ vars.VPS_HOST }}
      VPS_USER: ${{ vars.VPS_USER }}
      VPS_HOST_KEY: ${{ vars.VPS_HOST_KEY }}
      SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - name: Diagnostichează starea efectivă a unitatilor systemd (read-only)
        shell: bash
        run: |
          set -Eeuo pipefail
          [ "$VPS_USER" = root ]
          [ -n "$VPS_HOST" ] && [ -n "$VPS_HOST_KEY" ] && [ -n "$SSH_KEY" ]
          umask 077
          key_file=$(mktemp)
          known_hosts=$(mktemp)
          cleanup() { rm -f -- "$key_file" "$known_hosts"; }
          trap cleanup EXIT
          printf '%s\n' "$SSH_KEY" > "$key_file"
          printf '%s\n' "$VPS_HOST_KEY" > "$known_hosts"
          chmod 0600 "$key_file" "$known_hosts"
          ssh_opts=(
            -i "$key_file"
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$known_hosts"
            -o HostKeyAlgorithms=ssh-ed25519
            -o BatchMode=yes
            -o ConnectTimeout=25
          )
          ssh "${ssh_opts[@]}" "$VPS_USER@$VPS_HOST" bash -s <<'REMOTE'
          set -Eeuo pipefail
          for u in kelion-runtime-config-recovery.service kelion-constructor-sync.service \
            kelion-codex-worker.timer kelion-codex-worker.service \
            kelion-constructor-publisher.timer kelion-constructor-publisher.service \
            kelion-constructor-release.timer kelion-constructor-release.service; do
            echo "=== $u ==="
            systemctl show "$u" -p FragmentPath,DropInPaths,LoadState,NeedDaemonReload,ActiveState 2>&1 || echo "SHOW_FAILED"
          done
          echo '=== kelion-runtime-config-recovery.service content ==='
          cat /etc/systemd/system/kelion-runtime-config-recovery.service 2>&1 || echo 'ABSENT'
          echo '=== kelion-constructor-sync.service content ==='
          cat /etc/systemd/system/kelion-constructor-sync.service 2>&1 || echo 'ABSENT'
          echo '=== kelion-runtime-config-recovery.service enabled state ==='
          systemctl is-enabled kelion-runtime-config-recovery.service 2>&1 || true
          echo 'DIAG_DONE=yes'
          REMOTE
