# ── CHEI NOI ÎN ENV-UL DE PE VPS, SECURIZAT ──────────────────────────────────
# Calea SIGURĂ de a pune chei noi pe kelionai.app: valorile vin din GitHub
# Secrets (GitHub le maschează AUTOMAT în TOATE logurile) și pleacă spre VPS
# prin STDIN — niciodată într-o comandă care apare în jurnal. Cheia nu ajunge
# nici în git, nici în chat, nici în logul de Actions.
#
# CUM SE FOLOSEȘTE (Adrian):
#   1. Repo → Settings → Secrets and variables → Actions → New repository secret.
#      Adaugă, cu numele EXACT, doar cheile pe care le ai:
#        SERPER_API_KEY        (căutare web + youtube)
#        GEMINI_API_KEY        (generare imagini)  + opțional GEMINI_MODEL
#        GOOGLE_TTS_API_KEY    (voce TTS Google + salut landing)
#        GOOGLE_API_KEY        (o cheie Google Cloud care poate acoperi TTS/Gemini)
#        GOOGLE_MAPS_KEY       (opțional; harta merge și fără, pe OSM)
#        STRIPE_PUBLISHABLE_KEY (pk_live_… de la Stripe → Developers → API keys.
#                               NU e secretă — e făcută să stea în pagină. Cu ea
#                               adminul vede NUMĂRUL cardului virtual direct în
#                               panou, în cadre Stripe, fără drum prin dashboard.)
#        REVOLUT_PAY_LINK      (linkul TĂU de plată Revolut — pe el ajunge userul
#                               când apasă „adaugă credit". Nu e secret, dar stă
#                               aici ca să se poată schimba fără publicare.)
#        GOCARDLESS_SECRET_ID  (de la bankaccountdata.gocardless.com → Developers →
#        GOCARDLESS_SECRET_KEY  User Secrets. GRATUITE. Cu ele aplicația CITEȘTE
#                               tranzacțiile intrate în Revolut și creditează
#                               singură userul, potrivind codul unic din referință.
#                               ACCES DOAR DE CITIRE — nu pot mișca niciun ban.)
#        GOCARDLESS_ACCOUNT_ID (id-ul contului Revolut, primit după ce dai
#                               consimțământul de citire în GoCardless.)
#        GITHUB_TOKEN          (fin-granulat, DOAR repo kelionai, Actions:write —
#                               mâinile lui Kelion pe runbook-uri; + Contents/PR
#                               write dacă vrei să și scrie cod pe ramuri)
#   2. Actions → „vps-set-env" → Run workflow. Scrie DOAR secretele setate,
#      apoi repornește containerul ca să le încarce. Restul rămâne neatins.
#   Necesită și secretul VPS_SSH_KEY (deja pus).

name: vps-set-env

on:
  workflow_dispatch:
    inputs:
      restart:
        description: 'Repornește app-ul după scriere (ca să încarce cheile noi)?'
        type: boolean
        default: true

jobs:
  set-env:
    runs-on: ubuntu-latest
    steps:
      - name: Scrie cheile în env-ul VPS (din Secrets, mascate, prin STDIN)
        env:
          KEY: ${{ secrets.VPS_SSH_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_MAPS_KEY: ${{ secrets.GOOGLE_MAPS_KEY }}
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASS: ${{ secrets.MAIL_PASS }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
          REVOLUT_PAY_LINK: ${{ secrets.REVOLUT_PAY_LINK }}
          GOCARDLESS_SECRET_ID: ${{ secrets.GOCARDLESS_SECRET_ID }}
          GOCARDLESS_SECRET_KEY: ${{ secrets.GOCARDLESS_SECRET_KEY }}
          GOCARDLESS_ACCOUNT_ID: ${{ secrets.GOCARDLESS_ACCOUNT_ID }}
          GITHUB_TOKEN: ${{ secrets.KELION_GITHUB_TOKEN }}
          RESTART: ${{ inputs.restart }}
        run: |
          set -euo pipefail
          [ -n "$KEY" ] || { echo "::error::VPS_SSH_KEY lipsește (Settings → Secrets → Actions)."; exit 1; }
          umask 077
          printf '%s\n' "$KEY" > /tmp/vps_key
          chmod 600 /tmp/vps_key
          SSH="ssh -i /tmp/vps_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=25 -o BatchMode=yes root@164.68.120.87"

          # Construim liniile KEY=VALUE DOAR pentru secretele setate (valorile
          # trăiesc în memoria runner-ului, mascate de GitHub). Le trimitem prin
          # STDIN unui script remote care face upsert în /root/kelion/kelionai.env.
          # ATENȚIE la forma buclei: cu `[ -n ] && printf` scurt, dacă ULTIMUL
          # secret din listă e gol, bucla iese cu cod 1 și `pipefail` omoară
          # jobul DUPĂ scriere dar ÎNAINTE de repornire (exact pana din
          # 26 iul, run 30190681677 — cheile scrise, containerul nerepornit).
          # De-aia e `if`, nu `&&`.
          {
            for name in SERPER_API_KEY GEMINI_API_KEY GEMINI_MODEL GOOGLE_TTS_API_KEY GOOGLE_API_KEY GOOGLE_MAPS_KEY MAIL_USER MAIL_PASS STRIPE_WEBHOOK_SECRET STRIPE_PUBLISHABLE_KEY REVOLUT_PAY_LINK GOCARDLESS_SECRET_ID GOCARDLESS_SECRET_KEY GOCARDLESS_ACCOUNT_ID GITHUB_TOKEN; do
              val="${!name:-}"
              if [ -n "$val" ]; then printf '%s=%s\n' "$name" "$val"; fi
            done
          } | $SSH '
            set -e
            f=/root/kelion/kelionai.env
            touch "$f"; chmod 600 "$f"
            c=0
            while IFS= read -r line; do
              [ -z "$line" ] && continue
              name="${line%%=*}"
              val="${line#*=}"
              grep -v "^${name}=" "$f" > "$f.tmp" 2>/dev/null || true
              printf "%s\n" "$line" >> "$f.tmp"
              mv "$f.tmp" "$f"; chmod 600 "$f"
              echo "  $name: scris (${#val} caractere) — valoarea NU se afișează"
              c=$((c+1))
            done
            echo "total chei scrise/actualizate: $c"
            if [ "$c" -eq 0 ]; then
              echo "::warning::Niciun secret setat în GitHub. Adaugă-le în Settings → Secrets → Actions."
            fi
          '

          if [ "${RESTART:-true}" = "true" ]; then
            echo "== Repornesc containerul ca să încarce env-ul nou (fără rebuild) =="
            $SSH '
              set -e
              docker rm -f kelionai-app >/dev/null 2>&1 || true
              # GIT_COMMIT_SHA se păstrează și la repornirea de aici (clona
              # `deploy` = codul imaginii) — altfel /api/version recădea pe ora
              # bootului și verificarea anti-fantomă orbea.
              docker run -d --name kelionai-app --restart unless-stopped \
                --network host --env-file /root/kelion/kelionai.env \
                -e PORT=8080 -e NODE_ENV=production \
                -e GIT_COMMIT_SHA="$(git -C /root/kelion/repo rev-parse HEAD 2>/dev/null || true)" \
                kelionai:latest >/dev/null
              sleep 4
              code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8080/api/version || echo 000)
              echo "app repornit — /api/version HTTP $code"
            '
          fi
