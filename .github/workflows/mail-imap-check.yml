# VERIFICARE REALĂ A EMAILULUI (doar-citire). Nu doar că MAIL_PASS există, ci că
# contul contact@kelionai.app CHIAR se autentifică: ia credențialele din Railway
# (parola MASCATĂ în jurnal, niciodată afișată), încearcă un LOGIN IMAP real cu
# un client adevărat (Python imaplib) și raportează reușit/respins. Nu modifică
# nimic, nu șterge niciun email.
name: mail-imap-check

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Test login IMAP la contact@kelionai.app
        env:
          TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set -uo pipefail
          if [ -z "$TOKEN" ]; then echo "::error::RAILWAY_TOKEN lipsește"; exit 1; fi
          GQL=https://backboard.railway.com/graphql/v2
          gql() { curl -sS --max-time 30 "$GQL" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -d "$1"; }

          RESP=$(gql '{"query":"query{projects{edges{node{id name environments{edges{node{id name}}} services{edges{node{id name}}}}}}}"}')
          P=$(echo "$RESP" | jq '[.data.projects.edges[].node | select(.name|test("kelion";"i"))][0]')
          PID=$(echo "$P" | jq -r '.id')
          ENVID=$(echo "$P" | jq -r '[.environments.edges[].node|select(.name=="production")][0].id')
          SVCID=$(echo "$P" | jq -r '[.services.edges[].node|select(.name=="web")][0].id // .services.edges[0].node.id')
          VQ=$(jq -nc --arg p "$PID" --arg e "$ENVID" --arg s "$SVCID" \
            '{query:"query($p:String!,$e:String!,$s:String!){variables(projectId:$p,environmentId:$e,serviceId:$s)}",variables:{p:$p,e:$e,s:$s}}')
          VARS=$(gql "$VQ")
          export H=$(echo "$VARS" | jq -r '.data.variables.MAIL_IMAP_HOST // "mail.privateemail.com"')
          export PORT=$(echo "$VARS" | jq -r '.data.variables.MAIL_IMAP_PORT // "993"')
          export U=$(echo "$VARS" | jq -r '.data.variables.MAIL_USER // "contact@kelionai.app"')
          export PW=$(echo "$VARS" | jq -r '.data.variables.MAIL_PASS // ""')
          [ -n "$PW" ] && echo "::add-mask::$PW" || true

          echo "Cont: $U   Server: $H:$PORT"
          if [ -z "$PW" ]; then
            echo "❌ MAIL_PASS există ca nume, dar VALOAREA E GOALĂ."
            exit 0
          fi

          # Client IMAP real. login() reușit = parola corectă; excepția de auth =
          # respins. Parola NU se afișează niciodată (doar tipul/mesajul erorii).
          python3 - <<'PY'
          import imaplib, os
          host, port = os.environ['H'], int(os.environ['PORT'])
          user, pw = os.environ['U'], os.environ['PW']
          try:
              M = imaplib.IMAP4_SSL(host, port, timeout=20)
          except Exception as e:
              print(f"⚠️ NU M-AM PUTUT CONECTA la {host}:{port} de pe runner ({type(e).__name__}: {str(e)[:100]}).")
              print("   Nu dovedește că e stricat — poate rețeaua GitHub nu ajunge la server; contează cum se conectează Railway.")
              raise SystemExit(0)
          try:
              M.login(user, pw)
              try:
                  typ, data = M.select('INBOX', readonly=True)
                  n = data[0].decode() if data and data[0] else '?'
                  print(f"✅ LOGIN IMAP REUȘIT — parola e corectă, {user} se autentifică. INBOX are {n} mesaje. Emailul FUNCȚIONEAZĂ.")
              except Exception:
                  print(f"✅ LOGIN IMAP REUȘIT — parola e corectă, {user} se autentifică. Emailul FUNCȚIONEAZĂ.")
              M.logout()
          except imaplib.IMAP4.error as e:
              print(f"❌ AUTENTIFICARE RESPINSĂ — parola MAIL_PASS e greșită/expirată sau contul blocat. ({str(e)[:120]})")
          PY
