name: one-shot-clear-gate-artifacts

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  guard-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/heads/master
          fetch-depth: 0
          persist-credentials: false

      - name: Validează sursa canonică fără secrete
        shell: bash
        run: |
          set -Eeuo pipefail
          [ "$GITHUB_REPOSITORY" = kelion-team/kelionai ] # hardcod-permis: identitatea tehnică imuabilă a repository-ului canonic
          [ "$GITHUB_REF" = refs/heads/master ]
          [ "$GITHUB_REF_NAME" = master ]
          [ "$(git rev-parse HEAD)" = "$GITHUB_SHA" ]
          [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/master)" ]

  clear-artifacts:
    needs: guard-source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      VPS_HOST: ${{ vars.VPS_HOST }}
      VPS_USER: ${{ vars.VPS_USER }}
      VPS_HOST_KEY: ${{ vars.VPS_HOST_KEY }}
      SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - name: Backup și elimină artefactele de gate ramase după recovery reusit
        shell: bash
        run: |
          set -Eeuo pipefail
          [ "$VPS_USER" = root ]
          [ -n "$VPS_HOST" ] && [ -n "$VPS_HOST_KEY" ] && [ -n "$SSH_KEY" ]
          umask 077
          key_file=$(mktemp)
          known_hosts=$(mktemp)
          cleanup() { rm -f -- "$key_file" "$known_hosts"; }
          trap cleanup EXIT
          printf '%s\n' "$SSH_KEY" > "$key_file"
          printf '%s\n' "$VPS_HOST_KEY" > "$known_hosts"
          chmod 0600 "$key_file" "$known_hosts"
          ssh_opts=(
            -i "$key_file"
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$known_hosts"
            -o HostKeyAlgorithms=ssh-ed25519
            -o BatchMode=yes
            -o ConnectTimeout=25
          )
          ssh "${ssh_opts[@]}" "$VPS_USER@$VPS_HOST" bash -s <<'REMOTE'
          set -Eeuo pipefail
          # Doar dacă serviciul de recovery e chiar inactiv/reușit — nu ștergem
          # nimic dacă o tranzacție e cu adevărat în desfășurare.
          state=$(systemctl show kelion-runtime-config-recovery.service -p ActiveState --value)
          result=$(systemctl show kelion-runtime-config-recovery.service -p Result --value)
          [ "$state" = inactive ] && [ "$result" = success ] \
            || { echo "RECOVERY_NOT_IDLE state=$state result=$result" >&2; exit 1; }

          backup_dir="/root/GATE-ARTIFACTS-BACKUP-$(date -u +%Y%m%dT%H%M%SZ)"
          install -d -m 0700 -o root -g root "$backup_dir"
          found=0
          shopt -s nullglob
          for artifact in \
            /root/kelion/runtime/constructor-gate-refresh.journal \
            /root/kelion/runtime/constructor-gate-txn.* \
            /root/kelion/runtime/constructor-gate-discarded.* \
            /root/kelion/runtime/constructor-gate-gc.*; do
            [ -e "$artifact" ] || [ -L "$artifact" ] || continue
            found=1
            cp -a -- "$artifact" "$backup_dir"/
            rm -rf -- "$artifact"
            printf 'CLEARED=%s\n' "$artifact"
          done
          if [ "$found" -eq 0 ]; then
            printf 'NOTHING_TO_CLEAR=yes\n'
            rmdir -- "$backup_dir"
          else
            printf 'BACKUP_DIR=%s\n' "$backup_dir"
          fi
          echo 'CLEAR_DONE=yes'
          REMOTE
