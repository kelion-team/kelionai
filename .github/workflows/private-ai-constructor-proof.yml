          [ "$(systemctl show kelion-codex-worker.service -p ProtectSystem --value)" = no ]
          [ "$(systemctl show kelion-codex-worker.service -p ProtectHome --value)" = no ]

          worker_env=/root/kelion/config/codex-worker.env
          [ -f "$worker_env" ] && [ ! -L "$worker_env" ]
          grep -qx 'CODEX_WORKER_EXEC_ENABLED=1' "$worker_env"
          grep -qx 'KELION_CODEX_API=http://127.0.0.1:18079' "$worker_env"
          grep -qx "KELION_GITHUB_REPOSITORY=$expected_repository" "$worker_env"
          gate_image=$(sed -n 's/^KELION_CODEX_GATE_IMAGE=//p' "$worker_env")
          [ "$(grep -c '^KELION_CODEX_GATE_IMAGE=' "$worker_env")" -eq 1 ]
          [[ "$gate_image" =~ ^ghcr\.io/[a-z0-9_.-]+/[a-z0-9_.-]+/codex-gates@sha256:[0-9a-f]{64}$ ]]
          [ "$(git -C /var/lib/kelion-codex/repo remote get-url origin)" = \
            "https://github.com/$expected_repository.git" ]
          [ "$(git -C /var/lib/kelion-codex/repo rev-parse 'origin/master^{commit}')" = "$expected_source_sha" ]
          [ "$(podman image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$gate_image")" = \
            "$expected_source_sha" ]

          opencode_config=/srv/private-ai/home/.config/opencode/opencode.json
          [ -f "$opencode_config" ] && [ ! -L "$opencode_config" ]
          [ "$(stat -Lc '%U:%G:%a:%h' "$opencode_config")" = 'root:privateai:640:1' ]
          [ "$(sha256sum "$opencode_config" | awk '{print $1}')" = "$expected_config_sha" ]
          jq -e \
            --arg fast "llama.cpp/$expected_model_alias" \
            --arg powerful "llama.cpp/$expected_powerful_model_alias" '
            . as $config |
            $config.autoupdate == false and $config.share == "disabled" and
            $config.model == $fast and ($config.small_model // $config.model) == $fast and
            $config.enabled_providers == ["llama.cpp"] and
            ($config.provider | keys) == ["llama.cpp"] and
            $config.provider["llama.cpp"].npm == "@ai-sdk/openai-compatible" and
            $config.provider["llama.cpp"].options.baseURL == "http://127.0.0.1:24080/v1" and
            ($config.provider["llama.cpp"].options | has("apiKey") | not) and
            ($config.provider["llama.cpp"].models | keys | sort) ==
              ([$fast, $powerful] | map(sub("^llama\\.cpp/"; "")) | sort) and
            (["*", "read", "glob", "grep", "edit", "bash", "task", "skill",
              "webfetch", "websearch", "external_directory"]
             | all(.[]; $config.permission[.] == "allow"))
          ' "$opencode_config" >/dev/null

          opencode_instructions=/srv/private-ai/home/.config/opencode/instructions.md
          [ -f "$opencode_instructions" ] && [ ! -L "$opencode_instructions" ]
          [ "$(stat -Lc '%U:%G:%a:%h' "$opencode_instructions")" = 'root:privateai:640:1' ]
          [ "$(sha256sum "$opencode_instructions" | awk '{print $1}')" = "$expected_instructions_sha" ]
          installed_web_dropin=/etc/systemd/system/private-ai-web.service.d/90-kelion-constructor-full-access.conf
          [ -f "$installed_web_dropin" ] && [ ! -L "$installed_web_dropin" ]
          [ "$(stat -Lc '%u:%g:%a:%h' "$installed_web_dropin")" = '0:0:444:1' ]
          [ "$(sha256sum "$installed_web_dropin" | awk '{print $1}')" = "$expected_web_dropin_sha" ]
          [ "$(systemctl show private-ai-web.service -p FragmentPath --value)" = \
            /etc/systemd/system/private-ai-web.service ]
          [ "$(systemctl show private-ai-web.service -p DropInPaths --value)" = "$installed_web_dropin" ]
          [ "$(systemctl show private-ai-web.service -p User --value)" = root ]
          [ "$(systemctl show private-ai-web.service -p Group --value)" = root ]
          [ "$(systemctl show private-ai-web.service -p NoNewPrivileges --value)" = no ]
          [ "$(systemctl show private-ai-web.service -p PrivateIPC --value)" = no ]
          [ "$(systemctl show private-ai-web.service -p PrivateDevices --value)" = no ]
          [ "$(systemctl show private-ai-web.service -p PrivateTmp --value)" = no ]
          [ "$(systemctl show private-ai-web.service -p ProtectHome --value)" = no ]
          [ "$(systemctl show private-ai-web.service -p ProtectSystem --value)" = no ]
          [ "$(systemctl show private-ai-web.service -p RestrictNamespaces --value)" = no ]
          mapfile -t llm_listeners < <(ss -ltnpH | awk '$4 == "127.0.0.1:24080"')
          [ "${#llm_listeners[@]}" -eq 1 ] && [[ "${llm_listeners[0]}" == *"pid=$llm_pid,"* ]]
          if [ "$active_profile" = fast ]; then
            web_pid=$(systemctl show private-ai-web.service -p MainPID --value)
            [[ "$web_pid" =~ ^[1-9][0-9]*$ ]]
            [ "$(awk '/^Uid:/ { print $2 }' "/proc/$web_pid/status")" = 0 ]
            [ "$(readlink -f -- "/proc/$web_pid/exe")" = "$opencode_bin" ]
            mapfile -d '' -t web_argv < "/proc/$web_pid/cmdline"
            expected_web_argv=("$opencode_bin" web --hostname 127.0.0.1 --port 24096)
            [ "${#web_argv[@]}" -eq "${#expected_web_argv[@]}" ]
            for argv_index in "${!expected_web_argv[@]}"; do
              [ "${web_argv[$argv_index]}" = "${expected_web_argv[$argv_index]}" ]
            done
            mapfile -t web_listeners < <(ss -ltnpH | awk '$4 == "127.0.0.1:24096"')
            [ "${#web_listeners[@]}" -eq 1 ] && [[ "${web_listeners[0]}" == *"pid=$web_pid,"* ]]
          else
            [ "$(systemctl show private-ai-web.service -p MainPID --value)" = 0 ]
          fi

          final_receipt=/etc/private-ai/.constructor-finalized
          [ -f "$final_receipt" ] && [ ! -L "$final_receipt" ]
          [ "$(stat -Lc '%u:%g:%a:%h' "$final_receipt")" = '0:0:600:1' ]
          mapfile -t final_lines < "$final_receipt"
          [ "${#final_lines[@]}" -eq 28 ]
          [ "${final_lines[0]}" = 'schema=3' ]
          [ "${final_lines[1]}" = 'executor=opencode' ]
          [ "${final_lines[2]}" = "opencode_version=$expected_opencode_version" ]
          [ "${final_lines[3]}" = "model=llama.cpp/$expected_model_alias" ]
          [ "${final_lines[4]}" = "llama_cpp_ref=$expected_llama_ref" ]
          [ "${final_lines[5]}" = "llama_server_sha256=$llama_server_sha" ]
          [ "${final_lines[6]}" = "opencode_bin_sha256=$opencode_bin_sha" ]
          [ "${final_lines[7]}" = "model_repo=$expected_model_repo" ]
          [ "${final_lines[8]}" = "model_revision=$expected_model_revision" ]
          [ "${final_lines[9]}" = "model_quant=$expected_model_quant" ]
          [ "${final_lines[10]}" = "model_file=$expected_model_file" ]
          [ "${final_lines[11]}" = "model_file_bytes=$expected_model_bytes" ]
          [ "${final_lines[12]}" = "model_file_sha256=$expected_model_sha" ]
          [ "${final_lines[13]}" = "worker_sha256=$expected_worker_sha" ]
          config_sha=$(sha256sum "$opencode_config" | awk '{print $1}')
          [ "${final_lines[14]}" = "worker_unit_sha256=$expected_worker_unit_sha" ]
          [ "${final_lines[15]}" = "sudoers_sha256=$expected_sudoers_sha" ]
          [ "${final_lines[16]}" = "config_sha256=$config_sha" ]
          [ "${final_lines[17]}" = "instructions_sha256=$expected_instructions_sha" ]
          [ "${final_lines[18]}" = "web_dropin_sha256=$expected_web_dropin_sha" ]
          [[ "${final_lines[19]}" =~ ^verified_at=([0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z)$ ]]
          final_verified_at=${BASH_REMATCH[1]}
          [ "$(date -u -d "$final_verified_at" +%FT%TZ)" = "$final_verified_at" ]
          [ "${final_lines[20]}" = 'base_verified=yes' ]
          [ "${final_lines[21]}" = 'executor_e2e=passed' ]
          [ "${final_lines[22]}" = 'hmac_heartbeat_e2e=passed' ]
          [[ "${final_lines[23]}" =~ ^claim_e2e=(no_claimable_job|pipeline_active|claimed)$ ]]
          [ "${final_lines[24]}" = 'full_host_sudo_probe=uid0' ]
          [ "${final_lines[25]}" = 'web_full_host_probe=uid0' ]
          [ "${final_lines[26]}" = 'queue_worker_started=yes' ]
          [ "${final_lines[27]}" = 'web_loopback_only=yes' ]
          final_receipt_sha=$(sha256sum "$final_receipt" | awk '{print $1}')
          [[ "$final_receipt_sha" =~ ^[0-9a-f]{64}$ ]]

          opencode_version=$(runuser -u kelion-codex -G privateai -G kelion-handoff -- env -i \
            HOME=/var/lib/kelion-codex \
            XDG_CONFIG_HOME=/srv/private-ai/home/.config \
            PATH=/opt/private-ai/bin:/usr/bin:/bin \
            /opt/private-ai/bin/opencode --version)
          [ "$opencode_version" = "$expected_opencode_version" ]
          root_identity=$(runuser -u kelion-codex -- env -i \
            PATH=/usr/bin:/bin /usr/bin/sudo -n -u root -- /usr/bin/id -u)
          [ "$root_identity" = 0 ]
          runuser -u kelion-codex -G privateai -G kelion-handoff -- env -i PATH=/usr/bin:/bin \
            /usr/bin/node "$installed_worker" --self-test >/dev/null

          [ "$(systemctl show kelion-codex-worker.service -p ActiveState --value)" = activating ]
          [ "$(systemctl show kelion-codex-worker.service -p SubState --value)" = start ]
          [ "$(systemctl show kelion-codex-worker.service -p MainPID --value)" = "$main_pid" ]
          [ "$(systemctl show kelion-codex-worker.service -p InvocationID --value)" = "$worker_invocation_id" ]
          [ -r "/proc/$main_pid/cmdline" ]
          [ "$(readlink -f -- "/proc/$main_pid/exe")" = /usr/bin/flock ]
          mapfile -d '' -t flock_argv < "/proc/$main_pid/cmdline"
          expected_flock_argv=(
            /usr/bin/flock --exclusive --wait 9000
            /run/lock/private-ai-model-switch.lock
            /usr/bin/node /opt/kelion-codex/codex-worker.mjs --once
          )
          [ "${#flock_argv[@]}" -eq "${#expected_flock_argv[@]}" ]
          for argv_index in "${!expected_flock_argv[@]}"; do
            [ "${flock_argv[$argv_index]}" = "${expected_flock_argv[$argv_index]}" ]
          done

          model_switch_lock=/run/lock/private-ai-model-switch.lock
          [ -f "$model_switch_lock" ] && [ ! -L "$model_switch_lock" ]
          [ "$(stat -Lc '%U:%G:%a:%h' "$model_switch_lock")" = 'root:privateai:660:1' ]
          model_switch_lock_identity=$(stat -Lc '%d:%i' "$model_switch_lock")
          main_lock_fds=0
          for fd_path in "/proc/$main_pid/fd/"*; do
            [ -e "$fd_path" ] || continue
            if [ "$(stat -Lc '%d:%i' "$fd_path" 2>/dev/null || true)" = \
              "$model_switch_lock_identity" ]; then
              main_lock_fds=$((main_lock_fds + 1))
            fi
          done
          [ "$main_lock_fds" -eq 1 ]
          if /usr/bin/flock --exclusive --nonblock "$model_switch_lock" /usr/bin/true; then
            printf '%s\n' 'Lockul modelului nu este deținut de invocarea workerului.' >&2
            exit 1
          fi

          control_group=$(systemctl show kelion-codex-worker.service -p ControlGroup --value)
          [[ "$control_group" == /system.slice/* ]]
          [ -r "/sys/fs/cgroup${control_group}/cgroup.procs" ]
          grep -qx "$main_pid" "/sys/fs/cgroup${control_group}/cgroup.procs"
          worker_node_processes=0
          worker_node_pid=''
          while IFS= read -r pid; do
            [[ "$pid" =~ ^[1-9][0-9]*$ ]] || continue
            if [ "$(readlink -f "/proc/$pid/exe" 2>/dev/null || true)" = /usr/bin/node ]; then
              mapfile -d '' -t worker_node_argv < "/proc/$pid/cmdline"
              [ "${#worker_node_argv[@]}" -eq 3 ]
              [ "${worker_node_argv[0]}" = /usr/bin/node ]
              [ "${worker_node_argv[1]}" = /opt/kelion-codex/codex-worker.mjs ]
              [ "${worker_node_argv[2]}" = --once ]
              [ "$(awk '/^PPid:/ { print $2 }' "/proc/$pid/status")" = "$main_pid" ]
              worker_node_pid=$pid
              worker_node_processes=$((worker_node_processes + 1))
            fi
          done < "/sys/fs/cgroup${control_group}/cgroup.procs"
          [ "$worker_node_processes" -eq 1 ]
          [[ "$worker_node_pid" =~ ^[1-9][0-9]*$ ]]

          is_descendant_of() {
            local descendant=$1 ancestor=$2 parent hops=0
            [[ "$descendant" =~ ^[1-9][0-9]*$ && "$ancestor" =~ ^[1-9][0-9]*$ ]]
            [ "$descendant" != "$ancestor" ]
            while [ "$descendant" != 1 ] && [ "$hops" -lt 64 ]; do
              parent=$(awk '/^PPid:/ { print $2 }' "/proc/$descendant/status" 2>/dev/null) \
                || return 1
              [[ "$parent" =~ ^[1-9][0-9]*$ ]] || return 1
              [ "$parent" = "$ancestor" ] && return 0
              descendant=$parent
              hops=$((hops + 1))
            done
            return 1
          }

          upstream=/root/kelion/proxy/upstream/kelion-upstream.caddy
          [ -f "$upstream" ] && [ ! -L "$upstream" ]
          case "$(cat "$upstream")" in
            $'reverse_proxy app-blue:8080 {\n\theader_up X-Kelion-Client-IP {client_ip}\n}') active_slot=blue ;;
            $'reverse_proxy app-green:8080 {\n\theader_up X-Kelion-Client-IP {client_ip}\n}') active_slot=green ;;
            *) printf '%s\n' 'Slotul activ nu poate fi determinat canonic.' >&2; exit 1 ;;
          esac
          mapfile -t app_containers < <(docker ps \
            --filter 'label=com.kelion.managed=true' \
            --filter 'label=com.kelion.role=app' \
            --filter "label=com.kelion.slot=$active_slot" \
            --format '{{.ID}}')
          [ "${#app_containers[@]}" -eq 1 ]
          app_container=${app_containers[0]}
          [ "$(docker inspect --format '{{.State.Running}}' "$app_container")" = true ]
          [ "$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{end}}' "$app_container")" = healthy ]

          # Singura citire a cozii se execută într-o tranzacție PostgreSQL
          # READ ONLY din containerul live. Nu apelăm endpointul de claim și nu
          # introducem vreun job diagnostic.
          queue_evidence=$(docker exec -i "$app_container" \
            node --input-type=module - "$proof_job_id" <<'NODE'
          import { readFileSync } from 'node:fs'
          import { createRequire } from 'node:module'

          const jobId = process.argv[2] ?? ''
          if (!/^[1-9][0-9]{0,18}$/.test(jobId)) process.exit(2)
          const databaseUrl = readFileSync('/run/secrets/database-url', 'utf8')
          if (!databaseUrl.endsWith('\n') || databaseUrl.slice(0, -1).includes('\n') || databaseUrl.includes('\r')) process.exit(3)
          const require = createRequire('/app/backend/package.json')
          const { Client } = require('pg')
          const client = new Client({
            connectionString: databaseUrl.slice(0, -1),
            connectionTimeoutMillis: 10_000,
            statement_timeout: 10_000,
            application_name: 'kelion-local-constructor-read-only-proof',
          })
          await client.connect()
          try {
            await client.query('BEGIN TRANSACTION READ ONLY')
            await client.query("SET LOCAL statement_timeout = '10s'")
            const result = await client.query(`
              SELECT b.id::text AS "jobId", b.status,
                     b.constructor_stage AS stage,
                     b.codex_task_id AS "taskId",
                     b.execution_profile AS profile,
                     b.attempts::integer,
                     b.execution_cycle::integer AS "executionCycle",
                     b.updated_at AS "updatedAt",
                     b.progress,
                     b.branch, b.pr_url AS "prUrl", b.commit_sha AS commit,
                     b.live_version AS "liveVersion",
                     (SELECT count(*)::integer
                        FROM constructor_activity_events e
                       WHERE e.job_id=b.id
                         AND e.execution_cycle=b.execution_cycle
                         AND e.activity_key='claimed') AS "claimedEvents",
                     (SELECT count(*)::integer FROM build_jobs
                       WHERE status='running') AS "runningJobs",
                     EXISTS (SELECT 1 FROM constructor_pipeline p WHERE p.job_id=b.id)
                       AS "pipelineExists"
                FROM build_jobs b
               WHERE b.id=$1::bigint AND b.arhivat=false
            `, [jobId])
            const heartbeatResult = await client.query(`
              SELECT value, updated_at AS "storedAt", clock_timestamp() AS "dbNow"
                FROM kv_state WHERE key='codex_worker_status_v1'
            `)
            await client.query('COMMIT')
            const row = result.rows[0]
            const heartbeatRow = heartbeatResult.rows[0]
            if (!row || !heartbeatRow) process.exit(4)
            if (row.status !== 'running' || !['accepted', 'working'].includes(row.stage)) process.exit(5)
            if (!/^codex-[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(row.taskId ?? '')) process.exit(6)
            if (row.profile !== 'fast' && row.profile !== 'powerful') process.exit(7)
            const expectedProgressByProfile = Object.freeze({
              fast: 'Model selectat manual FAST 35B: OpenCode execută ordinul',
              powerful: 'Model selectat manual POWERFUL 122B: OpenCode execută ordinul',
            })
            if (row.progress !== expectedProgressByProfile[row.profile]) process.exit(8)
            if (!Number.isInteger(row.attempts) || row.attempts < 1
              || !Number.isInteger(row.executionCycle) || row.executionCycle < 0
              || !Number.isInteger(row.claimedEvents) || row.claimedEvents < 1
              || row.runningJobs !== 1) process.exit(9)
            if (row.pipelineExists !== false) process.exit(10)
            if ([row.branch, row.prUrl, row.commit, row.liveVersion].some((value) => value !== null)) process.exit(11)

            let heartbeat
            try { heartbeat = JSON.parse(heartbeatRow.value) } catch { process.exit(12) }
            if (!heartbeat || typeof heartbeat !== 'object' || Array.isArray(heartbeat)) process.exit(13)
            const allowedHeartbeatKeys = new Set(['status', 'at', 'detail'])
            if (Object.keys(heartbeat).some((key) => !allowedHeartbeatKeys.has(key))
              || heartbeat.status !== 'busy'
              || heartbeat.detail !== expectedProgressByProfile[row.profile]) process.exit(14)
            if ('taskUrl' in heartbeat || 'internalCostUsdMicros' in heartbeat) process.exit(14)
            const heartbeatAt = Date.parse(heartbeat.at)
            const dbNow = new Date(heartbeatRow.dbNow).getTime()
            const jobUpdatedAt = new Date(row.updatedAt).getTime()
            const storedAt = new Date(heartbeatRow.storedAt).getTime()
            if (!Number.isFinite(heartbeatAt) || new Date(heartbeatAt).toISOString() !== heartbeat.at
              || !Number.isFinite(dbNow) || !Number.isFinite(jobUpdatedAt) || !Number.isFinite(storedAt)) process.exit(15)
            const heartbeatAgeMs = dbNow - heartbeatAt
            const jobAgeMs = dbNow - jobUpdatedAt
            if (heartbeatAgeMs < -30_000 || heartbeatAgeMs > 180_000
              || jobAgeMs < -30_000 || jobAgeMs > 180_000
              || Math.abs(storedAt - heartbeatAt) > 10_000) process.exit(16)

            process.stdout.write(JSON.stringify({
              schema: 1,
              kind: 'kelion-local-constructor-claim-proof',
              measuredAt: new Date(dbNow).toISOString(),
              queue: 'build_jobs',
              jobId: row.jobId,
              taskId: row.taskId,
              profile: row.profile,
              executionCycle: row.executionCycle,
              stage: row.stage,
              claimedEvents: row.claimedEvents,
              heartbeat: 'busy',
              heartbeatAt: heartbeat.at,
              executor: 'opencode-local-qwen',
              publicationSideEffects: false,
            }))
          } catch (error) {
            await client.query('ROLLBACK').catch(() => undefined)
            throw error
          } finally {
            await client.end()
          }
          NODE
          )
          printf '%s' "$queue_evidence" | jq -e \
            --arg job "$proof_job_id" \
            '.schema == 1 and .queue == "build_jobs" and .jobId == $job and
             (.profile == "fast" or .profile == "powerful") and
             .executor == "opencode-local-qwen" and .publicationSideEffects == false' \
            >/dev/null

          task_id=$(printf '%s' "$queue_evidence" | jq -er '.taskId')
          queue_profile=$(printf '%s' "$queue_evidence" | jq -er '.profile')
          [ "$queue_profile" = "$active_profile" ]
          state_dir="/var/lib/kelion-codex/jobs/${task_id}-${proof_job_id}"
          [ -d "$state_dir" ] && [ ! -L "$state_dir" ]
          job_receipt="$state_dir/job.json"
          [ -f "$job_receipt" ] && [ ! -L "$job_receipt" ]
          [ "$(stat -Lc '%U:%G:%a:%h' "$job_receipt")" = 'kelion-codex:kelion-codex:600:1' ]
          job_profile=$(jq -ser \
            --arg job "$proof_job_id" \
            --arg task "$task_id" \
            --arg base "$expected_source_sha" '
            if length == 1 and
               ((.[0] | keys | sort) ==
                 ["baseCommit", "createdAt", "executor", "jobId", "profile", "taskId"]) and
               .[0].jobId == $job and .[0].taskId == $task and
               .[0].executor == "opencode-local-qwen" and
               .[0].baseCommit == $base and
               (.[0].profile == "fast" or .[0].profile == "powerful") and
               (.[0].createdAt |
                 test("^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\\.[0-9]{3}Z$"))
            then .[0].profile
            else error("receiptul jobului nu respectă schema canonică")
            end
          ' "$job_receipt")
          [ "$job_profile" = "$queue_profile" ]
          [ "$job_profile" = "$active_profile" ]
          case "$job_profile" in
            fast) expected_job_model="llama.cpp/$expected_model_alias" ;;
            powerful) expected_job_model="llama.cpp/$expected_powerful_model_alias" ;;
            *) printf '%s\n' 'Profilul jobului nu este permis.' >&2; exit 1 ;;
          esac
          [ "$expected_job_model" = "$expected_active_model" ]

          [ "$(systemctl show kelion-codex-worker.service -p ActiveState --value)" = activating ]
          [ "$(systemctl show kelion-codex-worker.service -p SubState --value)" = start ]
          [ "$(systemctl show kelion-codex-worker.service -p MainPID --value)" = "$main_pid" ]
          [ "$(systemctl show kelion-codex-worker.service -p InvocationID --value)" = "$worker_invocation_id" ]
          opencode_process=0
          while IFS= read -r pid; do
            [[ "$pid" =~ ^[1-9][0-9]*$ ]] || continue
            if [ "$(readlink -f "/proc/$pid/exe" 2>/dev/null || true)" = /opt/private-ai/bin/opencode ]; then
              is_descendant_of "$pid" "$worker_node_pid"
              [ "$(awk '/^Uid:/ { print $2 }' "/proc/$pid/status")" = 0 ]
              mapfile -d '' -t opencode_argv < "/proc/$pid/cmdline"
              expected_opencode_argv=(
                /opt/private-ai/bin/opencode --pure run
                'Execută integral ordinul Constructor atașat. Modifică worktree-ul, rulează testele relevante și nu te opri la plan. Nu crea commituri, nu muta HEAD și nu indexa modificările; handoff-ul Git este făcut separat.'
                --model "$expected_job_model"
                --file "$state_dir/order.md"
              )
              [ "${#opencode_argv[@]}" -eq "${#expected_opencode_argv[@]}" ]
              for argv_index in "${!expected_opencode_argv[@]}"; do
                [ "${opencode_argv[$argv_index]}" = "${expected_opencode_argv[$argv_index]}" ]
              done
              [ "$(readlink -f -- "/proc/$pid/cwd")" = "$state_dir/worktree" ]
              opencode_process=$((opencode_process + 1))
            fi
          done < "/sys/fs/cgroup${control_group}/cgroup.procs"
          [ "$opencode_process" -eq 1 ]

          queue_receipt_sha=$(printf '%s' "$queue_evidence" | jq -cS . | sha256sum | awk '{print $1}')
          [[ "$queue_receipt_sha" =~ ^[0-9a-f]{64}$ ]]
          printf 'MEASURED_AT=%s\n' "$(date -u +%FT%TZ)"
          printf 'BASE_RECEIPT_SHA256=%s\n' "$base_receipt_sha"
          printf 'FINAL_RECEIPT_SHA256=%s\n' "$final_receipt_sha"
          printf 'WORKER_SHA256=%s\n' "$expected_worker_sha"
          printf 'WORKER_UNIT_SHA256=%s\n' "$expected_worker_unit_sha"
          printf 'SUDOERS_SHA256=%s\n' "$expected_sudoers_sha"
          printf 'OPENCODE_CONFIG_SHA256=%s\n' "$expected_config_sha"
          printf 'OPENCODE_INSTRUCTIONS_SHA256=%s\n' "$expected_instructions_sha"
          printf 'OPENCODE_WEB_DROPIN_SHA256=%s\n' "$expected_web_dropin_sha"
          printf 'LLAMA_CPP_REF=%s\n' "$expected_llama_ref"
          printf 'LLAMA_SERVER_SHA256=%s\n' "$llama_server_sha"
          printf 'OPENCODE_BIN_SHA256=%s\n' "$opencode_bin_sha"
          printf 'PROFILE=%s\n' "$active_profile"
          printf 'MODEL=%s\n' "$expected_active_model"
          printf 'MODEL_REPO=%s\n' "$expected_active_model_repo"
          printf 'MODEL_REVISION=%s\n' "$expected_active_model_revision"
          printf 'MODEL_QUANT=%s\n' "$expected_active_model_quant"
          printf 'MODEL_TOTAL_BYTES=%s\n' "$expected_active_model_total_bytes"
          printf 'MODEL_FILES=%s\n' "$expected_active_model_files"
          printf 'MODEL_FILES_SHA256=%s\n' "$expected_active_model_shas"
          printf 'SOURCE_SHA=%s\n' "$expected_source_sha"
          printf 'QUEUE_RECEIPT_SHA256=%s\n' "$queue_receipt_sha"
          printf 'JOB_ID=%s\n' "$proof_job_id"
          printf 'QUEUE=build_jobs\n'
          printf 'EXECUTOR=opencode-local-qwen\n'
          printf 'HEARTBEAT_AND_CLAIM_VERIFIED=yes\n'
          printf 'PUBLICATION_SIDE_EFFECTS=absent_at_measurement\n'
          printf 'LOCAL_CONSTRUCTOR_PROOF=verified\n'
          REMOTE
          )

          printf '%s\n' "$proof"
          {
            printf '%s\n' '### Constructor local — dovadă de producție'
            printf '%s\n' 'Workflow-ul a observat un ordin pilot deja existent; nu a creat, revendicat, publicat sau lansat niciun serviciu.'
            printf '%s\n' '```text'
            printf '%s\n' "$proof"
            printf '%s\n' '```'
          } >> "$GITHUB_STEP_SUMMARY"
