          main_pid=$(systemctl show kelion-codex-worker.service -p MainPID --value)
          worker_invocation_id=$(systemctl show kelion-codex-worker.service -p InvocationID --value)
          [ "$worker_active_state" = activating ]
          [ "$worker_sub_state" = start ]
          [[ "$main_pid" =~ ^[1-9][0-9]*$ ]]
          [[ "$worker_invocation_id" =~ ^[0-9a-f]{32}$ ]]
          systemctl cat kelion-codex-worker.service > "$proof_tmp/worker.unit"
          grep -Fq 'ExecStart=/usr/bin/flock --exclusive --wait 9000 /run/lock/private-ai-model-switch.lock /usr/bin/node /opt/kelion-codex/codex-worker.mjs --once' \
