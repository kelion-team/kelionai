name: private-ai-constructor-production-proof

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: ID-ul unui ordin pilot deja creat în Admin; acest workflow nu creează și nu revendică ordine
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  guard-source:
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Refuză orice sursă diferită de masterul canonic
        shell: bash
        run: |
          set -Eeuo pipefail
          [ "$GITHUB_REPOSITORY" = kelion-team/kelionai ] # hardcod-permis: identitatea tehnică imuabilă a repository-ului canonic
          [ "$GITHUB_REF" = refs/heads/master ]
          [ "$GITHUB_REF_NAME" = master ]
          [ "$(git rev-parse HEAD)" = "$GITHUB_SHA" ]

  prove-local-constructor:
    needs: guard-source
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Validează contractul workerului fără acces la producție
        shell: bash
        run: |
          set -Eeuo pipefail
          node deploy/codex-worker.mjs --self-test
          grep -q "const OPENCODE_BIN" deploy/codex-worker.mjs
          grep -q "'/api/internal/codex/jobs/claim'" deploy/codex-worker.mjs
          ! grep -Eq 'KELION_LOCAL_QWEN_WRAPPER|codex-real|CODEX_BIN|login --with-api-key' \
            deploy/codex-worker.mjs

      - name: Leagă receiptul, executorul local și claim-ul din build_jobs
        shell: bash
        env:
          PROOF_JOB_ID: ${{ inputs.job_id }}
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER }}
          VPS_HOST_KEY: ${{ vars.VPS_HOST_KEY }}
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          [ "$GITHUB_REPOSITORY" = kelion-team/kelionai ] # hardcod-permis: identitatea tehnică imuabilă a repository-ului canonic
          [ "$GITHUB_REF" = refs/heads/master ]
          [ "$GITHUB_REF_NAME" = master ]
          [ "$(git rev-parse HEAD)" = "$GITHUB_SHA" ]
          [ "$VPS_USER" = root ]
          [ -n "$VPS_HOST" ] && [ -n "$VPS_HOST_KEY" ] && [ -n "$SSH_KEY" ]
          [[ "$PROOF_JOB_ID" =~ ^[1-9][0-9]{0,18}$ ]]

          permanent_installer=deploy/instaleaza-constructor.sh
          opencode_contract=deploy/opencode-constructor.json
          worker=deploy/codex-worker.mjs
          worker_unit=deploy/systemd/kelion-codex-worker.service
          worker_sudoers=deploy/sudoers/kelion-codex-full-access
          opencode_instructions=deploy/opencode-constructor-instructions.md
          web_dropin=deploy/systemd/private-ai-web-full-access.conf
          [ -f "$permanent_installer" ] && [ -f "$opencode_contract" ] && [ -f "$worker" ]
          [ -f "$worker_unit" ] && [ -f "$worker_sudoers" ] && [ -f "$opencode_instructions" ]
          [ -f "$web_dropin" ]
          bash -n "$permanent_installer"
          expected_worker_sha=$(sha256sum "$worker" | awk '{print $1}')
          expected_worker_unit_sha=$(sha256sum "$worker_unit" | awk '{print $1}')
          expected_sudoers_sha=$(sha256sum "$worker_sudoers" | awk '{print $1}')
          expected_config_sha=$(sha256sum "$opencode_contract" | awk '{print $1}')
          expected_instructions_sha=$(sha256sum "$opencode_instructions" | awk '{print $1}')
          expected_web_dropin_sha=$(sha256sum "$web_dropin" | awk '{print $1}')
          for expected_sha256 in \
            "$expected_worker_sha" "$expected_worker_unit_sha" "$expected_sudoers_sha" \
            "$expected_config_sha" "$expected_instructions_sha" "$expected_web_dropin_sha"; do
            [[ "$expected_sha256" =~ ^[0-9a-f]{64}$ ]]
          done

          readonly expected_installer=private-ai-contabo-v1
          readonly expected_llama_ref=c1d0e7a004015f23bc0233470b747b596f29b264
          readonly expected_opencode_version=1.18.25
          readonly expected_model_repo=ggml-org/Qwen3.6-35B-A3B-GGUF
          readonly expected_model_quant=Q4_K_M
          readonly expected_model_alias=qwen3.6-35b-a3b-local
          readonly expected_model_revision=baec3ebee244827cda0f4557eafa8b28f7545fa6
          readonly expected_model_file=Qwen3.6-35B-A3B-Q4_K_M.gguf
          readonly expected_model_bytes=20419565568
          readonly expected_model_sha=671e47e0ec53c665d048b98c3ecbfd5236b5ca9c3e02ed19fc8f81f7b85140c7
          readonly expected_powerful_model_alias=qwen3.5-122b-a10b-local
          readonly expected_llama_server_sha=b80a03e8c2b22e28eef05fd4e701af696a82cebe7643290dc931ca4d9d67847e
          readonly expected_opencode_bin_sha=d91e0d33676d0839f7cde87924cd4127ea88c9d6784eea9f009a7d08bdc60eeb
          [[ "$expected_installer" =~ ^[a-z0-9-]+$ ]]
          [[ "$expected_llama_ref" =~ ^[0-9a-f]{40}$ ]]
          [[ "$expected_opencode_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$expected_model_repo" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
          [[ "$expected_model_quant" =~ ^[A-Za-z0-9_.-]+$ ]]
          [[ "$expected_model_alias" =~ ^[A-Za-z0-9_.-]+$ ]]
          [[ "$expected_model_revision" =~ ^[0-9a-f]{40}$ ]]
          [[ "$expected_model_file" =~ ^[A-Za-z0-9_.-]+\.gguf$ ]]
          [[ "$expected_model_bytes" =~ ^[1-9][0-9]+$ ]]
          [[ "$expected_model_sha" =~ ^[0-9a-f]{64}$ ]]
          [[ "$expected_powerful_model_alias" =~ ^[A-Za-z0-9_.-]+$ ]]
          grep -Fq "'installer_id=${expected_installer}'" "$permanent_installer"
          grep -Fq "'llama_cpp_ref=${expected_llama_ref}'" "$permanent_installer"
          grep -Fq "'opencode_version=${expected_opencode_version}'" "$permanent_installer"
          grep -Fq "'model_repo=${expected_model_repo}'" "$permanent_installer"
          grep -Fq "'model_quant=${expected_model_quant}'" "$permanent_installer"
          jq -e \
            --arg fast "llama.cpp/$expected_model_alias" \
            --arg powerful "llama.cpp/$expected_powerful_model_alias" '
            .model == $fast and (.small_model // .model) == $fast and
            (.provider["llama.cpp"].models | keys | sort) ==
              ([$fast, $powerful] | map(sub("^llama\\.cpp/"; "")) | sort)
          ' "$opencode_contract" >/dev/null

          current_host_key=$(ssh-keyscan -T 20 -t ed25519 "$VPS_HOST" 2>/dev/null)
          [ "$current_host_key" = "$VPS_HOST_KEY" ]
          umask 077
          key_file=$(mktemp)
          known_hosts=$(mktemp)
          cleanup() { rm -f -- "$key_file" "$known_hosts"; }
          trap cleanup EXIT
          printf '%s\n' "$SSH_KEY" > "$key_file"
          printf '%s\n' "$VPS_HOST_KEY" > "$known_hosts"
          chmod 0600 "$key_file" "$known_hosts"
          ssh_opts=(
            -i "$key_file"
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$known_hosts"
            -o HostKeyAlgorithms=ssh-ed25519
            -o BatchMode=yes
            -o ConnectTimeout=25
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=3
          )

          proof=$(ssh "${ssh_opts[@]}" "$VPS_USER@$VPS_HOST" bash -s -- \
            "$expected_worker_sha" \
            "$expected_installer" \
            "$expected_llama_ref" \
            "$expected_opencode_version" \
            "$expected_model_repo" \
            "$expected_model_quant" \
            "$expected_model_alias" \
            "$GITHUB_REPOSITORY" \
            "$GITHUB_SHA" \
            "$expected_worker_unit_sha" \
            "$expected_sudoers_sha" \
            "$expected_config_sha" \
            "$expected_instructions_sha" \
            "$expected_web_dropin_sha" \
            "$PROOF_JOB_ID" \
            "$expected_model_revision" \
            "$expected_model_file" \
            "$expected_model_bytes" \
            "$expected_model_sha" \
            "$expected_llama_server_sha" \
            "$expected_opencode_bin_sha" <<'REMOTE'
          set -Eeuo pipefail
          umask 077

          expected_worker_sha=$1
          expected_installer=$2
          expected_llama_ref=$3
          expected_opencode_version=$4
          expected_model_repo=$5
          expected_model_quant=$6
          expected_model_alias=$7
          expected_repository=$8
          expected_source_sha=$9
          expected_worker_unit_sha=${10}
          expected_sudoers_sha=${11}
          expected_config_sha=${12}
          expected_instructions_sha=${13}
          expected_web_dropin_sha=${14}
          proof_job_id=${15}
          expected_model_revision=${16}
          expected_model_file=${17}
          expected_model_bytes=${18}
          expected_model_sha=${19}
          expected_llama_server_sha=${20}
          expected_opencode_bin_sha=${21}
          readonly expected_powerful_model_repo=unsloth/Qwen3.5-122B-A10B-GGUF
          readonly expected_powerful_model_revision=a97b483a9f8cad9788776aa0112a2c63bf349e9e
          readonly expected_powerful_model_quant=Q4_K_M
          readonly expected_powerful_model_alias=qwen3.5-122b-a10b-local
          readonly expected_powerful_model_root=/srv/private-ai/models/qwen3.5-122b-a10b-q4_k_m
          readonly expected_powerful_model_total_bytes=76536964608
          readonly powerful_runtime_dropin=/run/systemd/system/private-ai-llm.service.d/90-constructor-model.conf
          readonly powerful_legacy_dropin=/etc/systemd/system/private-ai-llm.service.d/90-qwen35-122b-max.conf
          readonly -a expected_powerful_model_files=(
            Qwen3.5-122B-A10B-Q4_K_M-00001-of-00003.gguf
            Qwen3.5-122B-A10B-Q4_K_M-00002-of-00003.gguf
            Qwen3.5-122B-A10B-Q4_K_M-00003-of-00003.gguf
          )
          readonly -a expected_powerful_model_bytes=(10943552 49968146912 26557874144)
          readonly -a expected_powerful_model_shas=(
            467c9bd92ea518539cf75bf5a5fbfbd35e9a0b40d766ccaa67bf120e12041df3
            90db14846413aebdac365b57206441437cac5f7e5037d94b325f0167f902e6e7
            e3c24b8ebec070bb4f69ea0aca25a16531da7440cd515529953e046882901f97
          )
          [[ "$expected_worker_sha" =~ ^[0-9a-f]{64}$ ]]
          [[ "$expected_installer" =~ ^[a-z0-9-]+$ ]]
          [[ "$expected_llama_ref" =~ ^[0-9a-f]{40}$ ]]
          [[ "$expected_opencode_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$expected_model_repo" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
          [[ "$expected_model_quant" =~ ^[A-Za-z0-9_.-]+$ ]]
          [[ "$expected_model_alias" =~ ^[A-Za-z0-9_.-]+$ ]]
          [[ "$expected_repository" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
          [[ "$expected_source_sha" =~ ^[0-9a-f]{40}$ ]]
          for expected_sha256 in \
            "$expected_worker_sha" "$expected_worker_unit_sha" "$expected_sudoers_sha" \
            "$expected_config_sha" "$expected_instructions_sha" "$expected_web_dropin_sha"; do
            [[ "$expected_sha256" =~ ^[0-9a-f]{64}$ ]]
          done
          [[ "$proof_job_id" =~ ^[1-9][0-9]{0,18}$ ]]
          [[ "$expected_model_revision" =~ ^[0-9a-f]{40}$ ]]
          [[ "$expected_model_file" =~ ^[A-Za-z0-9_.-]+\.gguf$ ]]
          [[ "$expected_model_bytes" =~ ^[1-9][0-9]+$ ]]
          [[ "$expected_model_sha" =~ ^[0-9a-f]{64}$ ]]
          [[ "$expected_llama_server_sha" =~ ^[0-9a-f]{64}$ ]]
          [[ "$expected_opencode_bin_sha" =~ ^[0-9a-f]{64}$ ]]
          [[ "$expected_powerful_model_repo" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
          [[ "$expected_powerful_model_revision" =~ ^[0-9a-f]{40}$ ]]
          [[ "$expected_powerful_model_quant" =~ ^[A-Za-z0-9_.-]+$ ]]
          [[ "$expected_powerful_model_alias" =~ ^[A-Za-z0-9_.-]+$ ]]
          [ "${#expected_powerful_model_files[@]}" -eq 3 ]
          [ "${#expected_powerful_model_bytes[@]}" -eq 3 ]
          [ "${#expected_powerful_model_shas[@]}" -eq 3 ]
          powerful_bytes_sum=0
          for powerful_index in 0 1 2; do
            [[ "${expected_powerful_model_files[$powerful_index]}" =~ ^[A-Za-z0-9_.-]+\.gguf$ ]]
            [[ "${expected_powerful_model_bytes[$powerful_index]}" =~ ^[1-9][0-9]+$ ]]
            [[ "${expected_powerful_model_shas[$powerful_index]}" =~ ^[0-9a-f]{64}$ ]]
            powerful_bytes_sum=$((powerful_bytes_sum + expected_powerful_model_bytes[powerful_index]))
          done
          [ "$powerful_bytes_sum" -eq "$expected_powerful_model_total_bytes" ]

          proof_tmp=$(mktemp -d /run/kelion-constructor-proof.XXXXXX)
          cleanup_remote() { rm -rf -- "$proof_tmp"; }
          trap cleanup_remote EXIT

          # Receiptul bazei este imuabil, cu schema și valorile fixate de
          # installerul verificat din același checkout ca acest workflow.
          base_receipt=/etc/private-ai/.install-complete
          [ -f "$base_receipt" ] && [ ! -L "$base_receipt" ]
          [ "$(stat -Lc '%u:%g:%a:%h' "$base_receipt")" = '0:0:600:1' ]
          mapfile -t receipt_lines < "$base_receipt"
          [ "${#receipt_lines[@]}" -eq 6 ]
          [ "${receipt_lines[0]}" = "installer_id=$expected_installer" ]
          [[ "${receipt_lines[1]}" =~ ^completed_at=([0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z)$ ]]
          completed_at=${BASH_REMATCH[1]}
          [ "$(date -u -d "$completed_at" +%FT%TZ)" = "$completed_at" ]
          [ "$(date -u -d "$completed_at" +%s)" -le "$(( $(date -u +%s) + 60 ))" ]
          [ "${receipt_lines[2]}" = "llama_cpp_ref=$expected_llama_ref" ]
          [ "${receipt_lines[3]}" = "opencode_version=$expected_opencode_version" ]
          [ "${receipt_lines[4]}" = "model_repo=$expected_model_repo" ]
          [ "${receipt_lines[5]}" = "model_quant=$expected_model_quant" ]
          base_receipt_sha=$(sha256sum "$base_receipt" | awk '{print $1}')
          [[ "$base_receipt_sha" =~ ^[0-9a-f]{64}$ ]]

          llama_server=/opt/private-ai/bin/llama-server
          opencode_bin=/opt/private-ai/bin/opencode
          llama_source=/opt/private-ai/src/llama.cpp
          llama_commit_state=/var/lib/private-ai/llama-cpp.commit
          model_cache=/srv/private-ai/models
          [ -f "$llama_server" ] && [ ! -L "$llama_server" ]
          [ "$(stat -Lc '%U:%G:%a:%h' "$llama_server")" = 'root:root:755:1' ]
          [ -f "$opencode_bin" ] && [ ! -L "$opencode_bin" ]
          [ "$(stat -Lc '%U:%G:%a:%h' "$opencode_bin")" = 'root:root:755:1' ]
          [ -f "$llama_commit_state" ] && [ ! -L "$llama_commit_state" ]
          [ "$(stat -Lc '%U:%G:%a:%h' "$llama_commit_state")" = 'privateai:privateai:600:1' ]
          [ "$(tr -d '\n' < "$llama_commit_state")" = "$expected_llama_ref" ]
          [ -d "$llama_source/.git" ] && [ ! -L "$llama_source" ]
          [ "$(runuser -u privateai -- env -i HOME=/srv/private-ai/home PATH=/usr/bin:/bin \
            git -C "$llama_source" rev-parse HEAD)" = "$expected_llama_ref" ]
          mapfile -d '' -t model_candidates < <(
            find "$model_cache" -xdev -type f -size "${expected_model_bytes}c" -print0
          )
          [ "${#model_candidates[@]}" -eq 1 ]
          fast_model_file_path=${model_candidates[0]}
          [ -f "$fast_model_file_path" ] && [ ! -L "$fast_model_file_path" ]
          [ "$(stat -Lc '%U:%G:%s:%h' "$fast_model_file_path")" = \
            "privateai:privateai:${expected_model_bytes}:1" ]
          fast_model_file_sha=$(sha256sum "$fast_model_file_path" | awk '{print $1}')
          [ "$fast_model_file_sha" = "$expected_model_sha" ]
          llama_server_sha=$(sha256sum "$llama_server" | awk '{print $1}')
          opencode_bin_sha=$(sha256sum "$opencode_bin" | awk '{print $1}')
          [ "$llama_server_sha" = "$expected_llama_server_sha" ]
          [ "$opencode_bin_sha" = "$expected_opencode_bin_sha" ]

          systemctl is-active --quiet private-ai-llm.service
          [ "$(systemctl show private-ai-llm.service -p FragmentPath --value)" = \
            /etc/systemd/system/private-ai-llm.service ]
          test -f /var/lib/private-ai/model.ready
          ss -ltnH | awk '{print $4}' | grep -qx '127.0.0.1:24080'
          ! ss -ltnH | awk '{print $4}' | grep -Eq '(0\.0\.0\.0|\[::\]):(24080|24096)$'
          curl --fail --silent --show-error --max-time 10 \
            http://127.0.0.1:24080/health >/dev/null
          active_model_alias=$(curl --fail --silent --show-error --max-time 30 \
            http://127.0.0.1:24080/v1/models \
            | jq -er '.data | select(type == "array" and length == 1) | .[0].id')

          runtime_dropins=$(systemctl show private-ai-llm.service -p DropInPaths --value)
          case "$active_model_alias" in
            "$expected_model_alias")
              active_profile=fast
              expected_active_model="llama.cpp/$expected_model_alias"
              expected_active_model_repo=$expected_model_repo
              expected_active_model_revision=$expected_model_revision
              expected_active_model_quant=$expected_model_quant
              expected_active_model_total_bytes=$expected_model_bytes
              expected_active_model_files=$fast_model_file_path
              expected_active_model_shas=$expected_model_sha
              active_model_file_path=$fast_model_file_path
              [ ! -e "$powerful_runtime_dropin" ] && [ ! -L "$powerful_runtime_dropin" ]
              [ ! -e "$powerful_legacy_dropin" ] && [ ! -L "$powerful_legacy_dropin" ]
              [ -z "$runtime_dropins" ]
              systemctl is-active --quiet private-ai-web.service
              ss -ltnH | awk '{print $4}' | grep -qx '127.0.0.1:24096'
              expected_llm_argv=(
                "$llama_server" -hf "${expected_model_repo}:${expected_model_quant}" --offline
                --alias "$expected_model_alias" --host 127.0.0.1 --port 24080
                --ctx-size 32768 --n-predict 8192 --threads 12 --parallel 1 --jinja
                --chat-template-kwargs '{"enable_thinking":false}'
              )
              ;;
            "$expected_powerful_model_alias")
              active_profile=powerful
              expected_active_model="llama.cpp/$expected_powerful_model_alias"
              expected_active_model_repo=$expected_powerful_model_repo
              expected_active_model_revision=$expected_powerful_model_revision
              expected_active_model_quant=$expected_powerful_model_quant
              expected_active_model_total_bytes=$expected_powerful_model_total_bytes
              active_model_file_path="$expected_powerful_model_root/${expected_powerful_model_files[0]}"
              expected_active_model_files=''
              expected_active_model_shas=''
              [ -d "$expected_powerful_model_root" ] && [ ! -L "$expected_powerful_model_root" ]
              [ "$(realpath -e -- "$expected_powerful_model_root")" = "$expected_powerful_model_root" ]
              [ "$(stat -Lc '%U:%G:%a' "$expected_powerful_model_root")" = 'root:privateai:750' ]
              for powerful_index in 0 1 2; do
                powerful_model_path="$expected_powerful_model_root/${expected_powerful_model_files[$powerful_index]}"
                [ -f "$powerful_model_path" ] && [ ! -L "$powerful_model_path" ]
                [ "$(stat -Lc '%U:%G:%a:%s:%h' "$powerful_model_path")" = \
                  "root:privateai:440:${expected_powerful_model_bytes[$powerful_index]}:1" ]
                [ "$(sha256sum "$powerful_model_path" | awk '{print $1}')" = \
                  "${expected_powerful_model_shas[$powerful_index]}" ]
                if [ "$powerful_index" -gt 0 ]; then
                  expected_active_model_files+=,
                  expected_active_model_shas+=,
                fi
                expected_active_model_files+=$powerful_model_path
                expected_active_model_shas+=${expected_powerful_model_shas[$powerful_index]}
              done
              [ -f "$powerful_runtime_dropin" ] && [ ! -L "$powerful_runtime_dropin" ]
              [ "$(stat -Lc '%u:%g:%a:%h' "$powerful_runtime_dropin")" = '0:0:644:1' ]
              [ ! -e "$powerful_legacy_dropin" ] && [ ! -L "$powerful_legacy_dropin" ]
              [ "$runtime_dropins" = "$powerful_runtime_dropin" ]
              expected_powerful_dropin=$(cat <<EOF
          [Service]
          ExecStart=
          ExecStart=$llama_server --model $active_model_file_path --alias $expected_powerful_model_alias --host 127.0.0.1 --port 24080 --ctx-size 16384 --n-predict 4096 --threads 16 --parallel 1 --jinja --chat-template-kwargs '{"enable_thinking":false}'
          Restart=no
          TimeoutStartSec=3600
          CPUQuota=1600%
          MemoryHigh=84G
          MemoryMax=88G
          EOF
              )
              [ "$(<"$powerful_runtime_dropin")" = "$expected_powerful_dropin" ]
              [ "$(systemctl show private-ai-web.service -p ActiveState --value)" = inactive ]
              [ "$(systemctl show private-ai-web.service -p SubState --value)" = dead ]
              ! ss -ltnH | awk '{print $4}' | grep -qx '127.0.0.1:24096'
              expected_llm_argv=(
                "$llama_server" --model "$active_model_file_path"
                --alias "$expected_powerful_model_alias" --host 127.0.0.1 --port 24080
                --ctx-size 16384 --n-predict 4096 --threads 16 --parallel 1 --jinja
                --chat-template-kwargs '{"enable_thinking":false}'
              )
              ;;
            *)
              printf '%s\n' 'Aliasul activ nu aparține profilurilor Constructor permise.' >&2
              exit 1
              ;;
          esac

          active_model_state=/run/private-ai/active-model
          [ -f "$active_model_state" ] && [ ! -L "$active_model_state" ]
          [ "$(stat -Lc '%u:%g:%a:%h' "$active_model_state")" = '0:0:644:1' ]
          mapfile -t active_model_lines < "$active_model_state"
          [ "${#active_model_lines[@]}" -eq 4 ]
          [ "${active_model_lines[0]}" = 'schema=1' ]
          [ "${active_model_lines[1]}" = "profile=$active_profile" ]
          [ "${active_model_lines[2]}" = "alias=$active_model_alias" ]
          [[ "${active_model_lines[3]}" =~ ^verified_at=([0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z)$ ]]
          active_model_verified_at=${BASH_REMATCH[1]}
          [ "$(date -u -d "$active_model_verified_at" +%FT%TZ)" = "$active_model_verified_at" ]
          [ "$(date -u -d "$active_model_verified_at" +%s)" -le "$(( $(date -u +%s) + 60 ))" ]

          llm_pid=$(systemctl show private-ai-llm.service -p MainPID --value)
          [[ "$llm_pid" =~ ^[1-9][0-9]*$ ]]
          [ "$(awk '/^Uid:/ { print $2 }' "/proc/$llm_pid/status")" = "$(id -u privateai)" ]
          [ "$(readlink -f -- "/proc/$llm_pid/exe")" = "$llama_server" ]
          mapfile -d '' -t llm_argv < "/proc/$llm_pid/cmdline"
          [ "${#llm_argv[@]}" -eq "${#expected_llm_argv[@]}" ]
          for argv_index in "${!expected_llm_argv[@]}"; do
            [ "${llm_argv[$argv_index]}" = "${expected_llm_argv[$argv_index]}" ]
          done
          awk -v target="$active_model_file_path" '$NF == target { found=1 } END { exit !found }' \
            "/proc/$llm_pid/maps"

          # Executorul instalat este workerul OpenCode direct. Un CLI Codex
          # oficial poate exista separat, dar artefactele wrapperului compat
          # sunt interzise și serviciul nu are voie să le refere.
          installed_worker=/opt/kelion-codex/codex-worker.mjs
          [ -f "$installed_worker" ] && [ ! -L "$installed_worker" ]
          [ "$(stat -Lc '%u:%g:%a:%h' "$installed_worker")" = '0:0:555:1' ]
          [ "$(sha256sum "$installed_worker" | awk '{print $1}')" = "$expected_worker_sha" ]
          grep -q "const OPENCODE_BIN" "$installed_worker"
          grep -q "'/api/internal/codex/jobs/claim'" "$installed_worker"
          ! grep -Eq 'KELION_LOCAL_QWEN_WRAPPER|codex-real|CODEX_BIN|login --with-api-key' \
            "$installed_worker"

          installed_worker_unit=/etc/systemd/system/kelion-codex-worker.service
          [ -f "$installed_worker_unit" ] && [ ! -L "$installed_worker_unit" ]
          [ "$(stat -Lc '%u:%g:%a:%h' "$installed_worker_unit")" = '0:0:444:1' ]
          [ "$(sha256sum "$installed_worker_unit" | awk '{print $1}')" = "$expected_worker_unit_sha" ]
          [ "$(systemctl show kelion-codex-worker.service -p FragmentPath --value)" = \
