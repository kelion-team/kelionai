# AGENT DE VOCE — instalare deps native + test de conexiune, DIRECT prin SSH.
#
# Milestone 1 (Adrian, 12 iul, plan full-duplex aprobat): dovada că agentul de
# voce se instalează pe VPS (@livekit/rtc-node — binding nativ), se conectează la
# LiveKit-ul LOCAL (ws://localhost:7880) și poate intra într-o cameră. FĂRĂ
# microfon — validează fundația (instalare + conexiune) înainte de bucla audio.
#
# Determinist, fără LLM. Cheile LiveKit le ia agentul din env/claude.env
# (LIVEKIT_API_KEY/SECRET) — nu apar în log. (Railway scos, 22 iul 2026.)
name: vps-voice-agent

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Ce face'
        type: choice
        default: test
        options: [test, install-only]

jobs:
  agent:
    runs-on: ubuntu-latest
    steps:
      - name: Instalează + testează agentul de voce pe VPS (SSH, parolă mascată din secret)
        env:
          VPS_PASS: ${{ secrets.VPS_ROOT_PASS }}
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          if [ -z "$VPS_PASS" ]; then
            echo "::error::Lipsește secretul VPS_ROOT_PASS."; exit 1
          fi
          VPS_HOST=164.68.120.87
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          export SSHPASS="$VPS_PASS"
          SSHOPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=25 -o PubkeyAuthentication=no -o PreferredAuthentications=password,keyboard-interactive -o NumberOfPasswordPrompts=1"

          sshpass -e ssh $SSHOPTS root@"$VPS_HOST" MODE="${MODE:-test}" 'bash -s' <<'EOS'
          set -e
          export DEBIAN_FRONTEND=noninteractive
          REPO=/root/kelion/repo
          [ -d "$REPO" ] || REPO=/root/kelion
          cd "$REPO"
          git fetch origin master -q || true
          git reset --hard origin/master -q || true
          git log --oneline -1 || true

          echo "=== node/npm ==="
          node --version; npm --version

          echo "=== instalez dependințele agentului (@livekit/rtc-node — nativ) ==="
          cd "$REPO/bridge/voice-agent"
          npm install --no-audit --no-fund 2>&1 | tail -8

          echo "=== verific că modulele se încarcă ==="
          node -e "require('@livekit/rtc-node'); require('livekit-server-sdk'); console.log('module OK')"

          if [ "${MODE:-test}" = "install-only" ]; then
            echo "install-only: gata (fără test de conexiune)"
            exit 0
          fi

          echo "=== test de conexiune (agentul intră într-o cameră de test) ==="
          # LiveKit local, fără TLS intern. Cheile le ia agentul din claude.env.
          LIVEKIT_URL=ws://localhost:7880 node "$REPO/bridge/voice-agent/kelion-voice-agent.mjs" --test --room voice-agent-test

          echo "=== camere active acum (dovadă din server) ==="
          docker ps --filter name=kelion-livekit --format '{{.Names}} {{.Status}}' || true
          EOS
