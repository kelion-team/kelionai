# REPORNIRE SERVICII VPS CU CODUL PROASPĂT DIN MASTER.
#
# Problema pe care o rezolvă (12 iul, Adrian: „ce te blochează să pornești real?"):
# repo-sync copiază fișierele pe VPS, dar NU repornește serviciile — deci procesul
# viu (kelion-builder / kelion-bridge) rulează cod VECHI până la o repornire.
# Aici rulăm scriptul determinist din repo (bridge/restart-sincronizat.sh): backup,
# git reset --hard origin/master, copiere pe căile reale rulate de systemd,
# restart simultan + verificări (is-active, md5 cod-rulat == repo, health bridge,
# dev/status). Idempotent.
name: vps-restart

on:
  workflow_dispatch:
    inputs:
      which:
        description: 'Ce serviciu reporneşti cu codul proaspăt'
        required: true
        type: choice
        options: [builder, bridge, both]

jobs:
  restart:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo (pentru scriptul determinist)
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Reporneşte serviciile VPS cu restart-sincronizat.sh
        env:
          VPS_PASS: ${{ secrets.VPS_ROOT_PASS }}
          WHICH: ${{ inputs.which }}
        run: |
          set -euo pipefail
          if [ -z "$VPS_PASS" ]; then
            echo "::error::Lipseşte secretul VPS_ROOT_PASS (Settings → Secrets → Actions)."; exit 1
          fi
          VPS_HOST=164.68.120.87
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          export SSHPASS="$VPS_PASS"
          SSHOPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=25 -o PubkeyAuthentication=no -o PreferredAuthentications=password,keyboard-interactive -o NumberOfPasswordPrompts=1"

          case "$WHICH" in
            builder) SERVICES="kelion-builder" ;;
            bridge)  SERVICES="kelion-bridge" ;;
            both)    SERVICES="kelion-bridge,kelion-builder" ;;
            *)       SERVICES="" ;;
          esac

          # Trimite scriptul proaspăt din repo pe VPS şi rulează-l acolo.
          sshpass -e ssh $SSHOPTS root@"$VPS_HOST" 'bash -s' -- "$SERVICES" < bridge/restart-sincronizat.sh
