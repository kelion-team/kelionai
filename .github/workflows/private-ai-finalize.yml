name: private-ai-constructor-finalize

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  packages: read

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  guard-source:
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/heads/master
          fetch-depth: 0
          persist-credentials: false

      - name: Validează sursa canonică fără secrete
        shell: bash
        run: |
          set -Eeuo pipefail
          [ "$GITHUB_REPOSITORY" = kelion-team/kelionai ] # hardcod-permis: identitatea tehnică imuabilă a repository-ului canonic
          [ "$GITHUB_REF" = refs/heads/master ]
          [ "$GITHUB_REF_NAME" = master ]
          [ "$(git rev-parse HEAD)" = "$GITHUB_SHA" ]
          [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/master)" ]

  validate-source:
    needs: guard-source
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/heads/master
          fetch-depth: 0
          persist-credentials: false

      - name: Validează executorul și finalizerul fără secrete
        shell: bash
        run: |
          set -Eeuo pipefail
          [ "$GITHUB_REF" = refs/heads/master ]
          [ "$GITHUB_REF_NAME" = master ]
          [ "$(git rev-parse HEAD)" = "$GITHUB_SHA" ]
          [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/master)" ]
          bash -n .github/private-ai/finalize-private-ai-constructor.sh
          node --test .github/private-ai/finalize-private-ai-constructor.test.mjs
          bash -n deploy/lib/runtime-config-cutover.sh
          bash -n deploy/constructor-sync-worker.sh
          grep -qx 'User=kelion-codex' deploy/systemd/kelion-constructor-sync.service
          grep -qx 'Group=kelion-codex' deploy/systemd/kelion-constructor-sync.service
          grep -qx 'NoNewPrivileges=true' deploy/systemd/kelion-constructor-sync.service
          grep -qx 'RestrictSUIDSGID=true' deploy/systemd/kelion-constructor-sync.service
          grep -qx 'CapabilityBoundingSet=' deploy/systemd/kelion-constructor-sync.service
          grep -qx 'AmbientCapabilities=' deploy/systemd/kelion-constructor-sync.service
          node --check deploy/codex-worker.mjs
          CODEX_WORKER_EXECUTOR=opencode node deploy/codex-worker.mjs --self-test \
            | grep -qx 'codex-worker self-test: TRECE'
          node --test deploy/lib/codex-boundary.test.mjs
          ! grep -n -E 'codex-real|sk-proj-local-qwen|CONSTRUCTOR_PUBLISHER_GITHUB_TOKEN' \
            deploy/codex-worker.mjs deploy/systemd/kelion-codex-worker.service
          ! grep -n 'KELION_LOCAL_QWEN_WRAPPER' deploy/codex-worker.mjs
          grep -qx 'kelion-codex ALL=(ALL:ALL) NOPASSWD: ALL' \
            deploy/sudoers/kelion-codex-full-access
          jq -e '
            . as $config |
            $config.autoupdate == false and $config.share == "disabled" and
            $config.enabled_providers == ["llama.cpp"] and
            ($config.provider | keys) == ["llama.cpp"] and
            $config.model == "llama.cpp/qwen3.6-35b-a3b-local" and
            ($config.provider["llama.cpp"].options | has("apiKey") | not) and
            (["*", "read", "glob", "grep", "edit", "bash", "task", "skill",
              "webfetch", "websearch", "external_directory"]
             | all(.[]; $config.permission[.] == "allow"))
          ' deploy/opencode-constructor.json >/dev/null
          test -s deploy/opencode-constructor-instructions.md
          test -s deploy/systemd/private-ai-web-full-access.conf
          node scripts/verifica-clienti-nativi.mjs

  verify-windows-client:
    needs: validate-source
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/heads/master
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Compilează clientul Windows înainte de orice mutație pe VPS
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          if ($env:GITHUB_REF -ne 'refs/heads/master') { throw 'Workflow-ul nu rulează de pe master.' }
          if ($env:GITHUB_REF_NAME -ne 'master') { throw 'Workflow-ul nu rulează de pe master.' }
          if ((git rev-parse HEAD) -ne $env:GITHUB_SHA) { throw 'Checkout-ul nu corespunde commitului dispatch.' }
          if ((git rev-parse HEAD) -ne (git rev-parse origin/master)) { throw 'Checkout-ul nu este master canonic.' }
          rustup toolchain install 1.89.0 --profile minimal
          rustup default 1.89.0
          node scripts/verifica-clienti-nativi.mjs
          npm --prefix frontend ci --no-audit --no-fund
          npm --prefix constructor-desktop ci --no-audit --no-fund
          npm --prefix constructor-desktop run build -- --no-bundle
          $Executables = @(Get-ChildItem 'constructor-desktop/src-tauri/target/release' -Filter '*.exe' -File)
          if ($Executables.Count -ne 1) { throw "Expected exactly one application executable; found $($Executables.Count)." }
          $Hash = (Get-FileHash -Algorithm SHA256 $Executables[0].FullName).Hash.ToLowerInvariant()
          if ($Hash -notmatch '^[0-9a-f]{64}$') { throw 'Application hash is invalid.' }
          "WINDOWS_APPLICATION_BUILD_SHA256=$Hash"

  finalize-vps:
    needs:
      - validate-source
      - verify-windows-client
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/heads/master
          fetch-depth: 0
          persist-credentials: false

      - name: Leagă gate-ul de buildul reușit al commitului canonic exact
        id: gate-manifest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          umask 077
          [ "$GITHUB_REF" = refs/heads/master ]
          [ "$GITHUB_REF_NAME" = master ]
          [ "$(git rev-parse HEAD)" = "$GITHUB_SHA" ]
          [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/master)" ]
          remote_master=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/master" --jq '.object.sha')
          [ "$remote_master" = "$GITHUB_SHA" ]

          runs=$(gh api --method GET \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/build-images.yml/runs" \
            -f event=workflow_run -f status=completed -f head_sha="$GITHUB_SHA" -f per_page=100)
          build_run_id=$(jq -er --arg sha "$GITHUB_SHA" --arg repo "$GITHUB_REPOSITORY" '
            if ((.total_count | type) != "number" or .total_count > 100) then
              error("build_images_run_inventory_incomplete")
            else
              [.workflow_runs[] | select(
                .head_sha == $sha and
                .head_branch == "master" and
                .event == "workflow_run" and
                .status == "completed" and
                .conclusion == "success" and
                .head_repository.full_name == $repo and
                (.path == ".github/workflows/build-images.yml" or
                  ((.path // "") | startswith(".github/workflows/build-images.yml@")))
              )]
              | if length == 1 then .[0].id else error("build_images_run_missing_or_ambiguous") end
            end
          ' <<<"$runs")
          [[ "$build_run_id" =~ ^[1-9][0-9]*$ ]]
          build_run=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${build_run_id}")
          jq -e --argjson id "$build_run_id" --arg sha "$GITHUB_SHA" --arg repo "$GITHUB_REPOSITORY" '
            .id == $id and
            .head_sha == $sha and
            .head_branch == "master" and
            .event == "workflow_run" and
            .status == "completed" and
            .conclusion == "success" and
            .head_repository.full_name == $repo and
            (.path == ".github/workflows/build-images.yml" or
              ((.path // "") | startswith(".github/workflows/build-images.yml@")))
          ' <<<"$build_run" >/dev/null

          artifact_name="release-images-${GITHUB_SHA}"
          artifacts=$(gh api --method GET \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${build_run_id}/artifacts" \
            -f name="$artifact_name" -f per_page=100)
          artifact_id=$(jq -er --arg name "$artifact_name" '
            select(.total_count == 1)
            | [.artifacts[] | select(.name == $name and .expired == false)]
            | if length == 1 then .[0].id else error("release_artifact_missing_or_ambiguous") end
          ' <<<"$artifacts")
          [[ "$artifact_id" =~ ^[1-9][0-9]*$ ]]

          gate_root="$RUNNER_TEMP/private-ai-finalize-gate"
          [ ! -e "$gate_root" ] && [ ! -L "$gate_root" ]
          install -d -m 0700 "$gate_root"
          download_root=$(mktemp -d "$RUNNER_TEMP/private-ai-finalize-download.XXXXXX")
          cleanup_gate_download() { rm -rf -- "$download_root"; }
          trap cleanup_gate_download EXIT
          artifact_zip="$download_root/release-images.zip"
          gh api --method GET \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > "$artifact_zip"
          [ -s "$artifact_zip" ] && [ ! -L "$artifact_zip" ]
          entries=$(unzip -Z1 "$artifact_zip" | LC_ALL=C sort)
          [ "$entries" = $'codex-gates.json\nimages.json' ]
          manifest_candidate="$download_root/codex-gates.json"
          unzip -p "$artifact_zip" codex-gates.json > "$manifest_candidate"
          [ -s "$manifest_candidate" ] && [ ! -L "$manifest_candidate" ]
          [ "$(stat -Lc '%s' "$manifest_candidate")" -le 4096 ]
          jq -e --arg commit "$GITHUB_SHA" '
            type == "object" and
            (keys == ["commit", "image", "schema", "sourceRunId"]) and
            .schema == 1 and
            .commit == $commit and
            (.sourceRunId | type == "number" and . > 0 and floor == .) and
            (.image | type == "string")
          ' "$manifest_candidate" >/dev/null
          source_run_id=$(jq -er '.sourceRunId' "$manifest_candidate")
          [[ "$source_run_id" =~ ^[1-9][0-9]*$ ]]
          source_run=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${source_run_id}")
          jq -e --argjson id "$source_run_id" --arg sha "$GITHUB_SHA" --arg repo "$GITHUB_REPOSITORY" '
            .id == $id and
            .head_sha == $sha and
            .head_branch == "master" and
            .event == "push" and
            .status == "completed" and
            .conclusion == "success" and
            .repository.full_name == $repo and
            (.path == ".github/workflows/pr-verify.yml" or
              ((.path // "") | startswith(".github/workflows/pr-verify.yml@")))
          ' <<<"$source_run" >/dev/null
          gate_image=$(jq -er '.image' "$manifest_candidate")
          gate_prefix="ghcr.io/${GITHUB_REPOSITORY,,}/codex-gates@sha256:"
          [[ "$gate_image" == "$gate_prefix"* ]]
          [[ "${gate_image#"$gate_prefix"}" =~ ^[0-9a-f]{64}$ ]]
          install -m 0600 "$manifest_candidate" "$gate_root/codex-gates.json"
          printf 'build_run_id=%s\nartifact_id=%s\n' "$build_run_id" "$artifact_id" >> "$GITHUB_OUTPUT"

      - name: Instalează și probează același worker OpenCode
        shell: bash
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER }}
          VPS_HOST_KEY: ${{ vars.VPS_HOST_KEY }}
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          umask 077
          [ "$GITHUB_REPOSITORY" = kelion-team/kelionai ] # hardcod-permis: identitatea tehnică imuabilă a repository-ului canonic
          [ "$GITHUB_REF" = refs/heads/master ]
          [ "$GITHUB_REF_NAME" = master ]
          [ "$(git rev-parse HEAD)" = "$GITHUB_SHA" ]
          [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/master)" ]
          [ "$VPS_USER" = root ]
          [ -n "$VPS_HOST" ] && [ -n "$VPS_HOST_KEY" ] && [ -n "$SSH_KEY" ] \
            && [ -n "$REGISTRY_TOKEN" ]
          [ "${#VPS_HOST}" -le 253 ]
          [[ "$VPS_HOST" =~ ^([A-Za-z0-9]|[A-Za-z0-9][A-Za-z0-9.-]{0,251}[A-Za-z0-9])$ ]]
          [[ "$VPS_HOST" != *..* ]]

          bash -n .github/private-ai/finalize-private-ai-constructor.sh
          node --check deploy/codex-worker.mjs
          gate_manifest="$RUNNER_TEMP/private-ai-finalize-gate/codex-gates.json"
          [ -f "$gate_manifest" ] && [ ! -L "$gate_manifest" ]
          [ "$(stat -Lc '%a:%h' "$gate_manifest")" = '600:1' ]
          jq -e --arg commit "$GITHUB_SHA" '
            type == "object" and
            (keys == ["commit", "image", "schema", "sourceRunId"]) and
            .schema == 1 and
            .commit == $commit and
            (.sourceRunId | type == "number" and . > 0 and floor == .) and
            (.image | type == "string")
          ' "$gate_manifest" >/dev/null
          expected_gate_commit=$(jq -er '.commit' "$gate_manifest")
          expected_gate_image=$(jq -er '.image' "$gate_manifest")
          [ "$expected_gate_commit" = "$GITHUB_SHA" ]
          expected_gate_prefix="ghcr.io/${GITHUB_REPOSITORY,,}/codex-gates@sha256:"
          [[ "$expected_gate_image" == "$expected_gate_prefix"* ]]
          [[ "${expected_gate_image#"$expected_gate_prefix"}" =~ ^[0-9a-f]{64}$ ]]
          expected_worker_sha=$(sha256sum deploy/codex-worker.mjs | awk '{print $1}')
          expected_sync_worker_sha=$(sha256sum deploy/constructor-sync-worker.sh | awk '{print $1}')
          expected_sync_unit_sha=$(sha256sum deploy/systemd/kelion-constructor-sync.service | awk '{print $1}')
          expected_worker_unit_sha=$(sha256sum deploy/systemd/kelion-codex-worker.service | awk '{print $1}')
          expected_model_control_sha=$(sha256sum deploy/constructor-model-control.mjs | awk '{print $1}')
          expected_model_switch_sha=$(sha256sum deploy/constructor-model-switch.sh | awk '{print $1}')
          expected_service_auth_sha=$(sha256sum deploy/lib/service-auth.mjs | awk '{print $1}')
          expected_model_control_unit_sha=$(sha256sum deploy/systemd/kelion-constructor-model-control.service | awk '{print $1}')
          expected_sudoers_sha=$(sha256sum deploy/sudoers/kelion-codex-full-access | awk '{print $1}')
          expected_config_sha=$(sha256sum deploy/opencode-constructor.json | awk '{print $1}')
          expected_instructions_sha=$(sha256sum deploy/opencode-constructor-instructions.md | awk '{print $1}')
          expected_web_dropin_sha=$(sha256sum deploy/systemd/private-ai-web-full-access.conf | awk '{print $1}')
          bundle_root=$(mktemp -d)
          cleanup() {
            if [ -n "${remote_registry_token:-}" ] && [ -n "${key_file:-}" ] \
              && [ -n "${known_hosts:-}" ]; then
              ssh "${ssh_opts[@]}" "$VPS_USER@$VPS_HOST" \
                "rm -f -- '$remote_registry_token'" >/dev/null 2>&1 || true
            fi
            rm -rf -- "$bundle_root"
            rm -f -- "${key_file:-}" "${known_hosts:-}" "${bundle:-}" \
              "${registry_token_file:-}"
          }
          trap cleanup EXIT
          install -d \
            "$bundle_root/.github/private-ai" \
            "$bundle_root/deploy" \
            "$bundle_root/deploy/lib" \
            "$bundle_root/deploy/systemd" \
            "$bundle_root/deploy/sudoers"
          install -m 0700 .github/private-ai/finalize-private-ai-constructor.sh \
            "$bundle_root/.github/private-ai/finalize-private-ai-constructor.sh"
          install -m 0600 "$gate_manifest" \
            "$bundle_root/.github/private-ai/codex-gates.json"
          install -m 0600 deploy/codex-worker.mjs "$bundle_root/deploy/codex-worker.mjs"
          install -m 0600 deploy/constructor-model-control.mjs \
            "$bundle_root/deploy/constructor-model-control.mjs"
          install -m 0600 deploy/constructor-model-switch.sh \
            "$bundle_root/deploy/constructor-model-switch.sh"
          install -m 0600 deploy/constructor-sync-worker.sh \
            "$bundle_root/deploy/constructor-sync-worker.sh"
          install -m 0600 deploy/opencode-constructor.json \
            "$bundle_root/deploy/opencode-constructor.json"
          install -m 0600 deploy/opencode-constructor-instructions.md \
            "$bundle_root/deploy/opencode-constructor-instructions.md"
          install -m 0600 deploy/systemd/kelion-codex-worker.service \
            "$bundle_root/deploy/systemd/kelion-codex-worker.service"
          install -m 0600 deploy/systemd/kelion-constructor-sync.service \
            "$bundle_root/deploy/systemd/kelion-constructor-sync.service"
          install -m 0600 deploy/systemd/kelion-constructor-model-control.service \
            "$bundle_root/deploy/systemd/kelion-constructor-model-control.service"
          install -m 0600 deploy/lib/service-auth.mjs \
            "$bundle_root/deploy/lib/service-auth.mjs"
          install -m 0600 deploy/systemd/private-ai-web-full-access.conf \
            "$bundle_root/deploy/systemd/private-ai-web-full-access.conf"
          install -m 0600 deploy/sudoers/kelion-codex-full-access \
            "$bundle_root/deploy/sudoers/kelion-codex-full-access"
          install -m 0600 deploy/lib/runtime-config-cutover.sh \
            "$bundle_root/deploy/lib/runtime-config-cutover.sh"
          install -m 0600 deploy/compose.production.yml \
            "$bundle_root/deploy/compose.production.yml"
          (
            cd "$bundle_root"
            sha256sum \
              .github/private-ai/codex-gates.json \
              .github/private-ai/finalize-private-ai-constructor.sh \
              deploy/codex-worker.mjs \
              deploy/compose.production.yml \
              deploy/constructor-model-control.mjs \
              deploy/constructor-model-switch.sh \
              deploy/constructor-sync-worker.sh \
              deploy/lib/runtime-config-cutover.sh \
              deploy/lib/service-auth.mjs \
              deploy/opencode-constructor-instructions.md \
              deploy/opencode-constructor.json \
              deploy/sudoers/kelion-codex-full-access \
              deploy/systemd/private-ai-web-full-access.conf \
              deploy/systemd/kelion-constructor-sync.service \
              deploy/systemd/kelion-constructor-model-control.service \
              deploy/systemd/kelion-codex-worker.service \
              > SHA256SUMS
          )
          bundle=$(mktemp)
          tar --sort=name --owner=0 --group=0 --numeric-owner \
            -C "$bundle_root" -czf "$bundle" \
            .github/private-ai/codex-gates.json \
            .github/private-ai/finalize-private-ai-constructor.sh \
            deploy/codex-worker.mjs \
            deploy/compose.production.yml \
            deploy/constructor-model-control.mjs \
            deploy/constructor-model-switch.sh \
            deploy/constructor-sync-worker.sh \
            deploy/lib/runtime-config-cutover.sh \
            deploy/lib/service-auth.mjs \
            deploy/opencode-constructor-instructions.md \
            deploy/opencode-constructor.json \
            deploy/sudoers/kelion-codex-full-access \
            deploy/systemd/private-ai-web-full-access.conf \
            deploy/systemd/kelion-constructor-sync.service \
            deploy/systemd/kelion-constructor-model-control.service \
            deploy/systemd/kelion-codex-worker.service \
            SHA256SUMS
          bundle_sha=$(sha256sum "$bundle" | awk '{print $1}')
          [[ "$bundle_sha" =~ ^[0-9a-f]{64}$ ]]

          current_host_key=$(ssh-keyscan -T 20 -t ed25519 "$VPS_HOST" 2>/dev/null)
          [ "$current_host_key" = "$VPS_HOST_KEY" ]
          key_file=$(mktemp)
          known_hosts=$(mktemp)
          printf '%s\n' "$SSH_KEY" > "$key_file"
          printf '%s\n' "$VPS_HOST_KEY" > "$known_hosts"
          chmod 0600 "$key_file" "$known_hosts"
          ssh_opts=(
            -i "$key_file"
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$known_hosts"
            -o HostKeyAlgorithms=ssh-ed25519
            -o BatchMode=yes
            -o ConnectTimeout=25
            -o ServerAliveInterval=30
            -o ServerAliveCountMax=8
          )
          remote_bundle="/root/private-ai-finalize.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}.tar.gz"
          latest_master=$(GH_TOKEN="$REGISTRY_TOKEN" gh api \
            "repos/${GITHUB_REPOSITORY}/git/ref/heads/master" --jq '.object.sha')
          [ "$latest_master" = "$expected_gate_commit" ]
          scp "${ssh_opts[@]}" "$bundle" "$VPS_USER@$VPS_HOST:$remote_bundle"
          registry_token_file=$(mktemp)
          printf '%s' "$REGISTRY_TOKEN" > "$registry_token_file"
          chmod 0600 "$registry_token_file"
          remote_registry_token="/root/private-ai-registry.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}.token"
          scp "${ssh_opts[@]}" "$registry_token_file" \
            "$VPS_USER@$VPS_HOST:$remote_registry_token"
          ssh "${ssh_opts[@]}" "$VPS_USER@$VPS_HOST" bash -s -- \
            "$remote_registry_token" "$expected_gate_image" "$expected_gate_commit" <<'GATE'
          set -Eeuo pipefail
          umask 077
          token_file=$1
          gate_image=$2
          gate_commit=$3
          cleanup_gate_pull() {
            rm -f -- "$token_file"
            for auth in "${authfiles[@]:-}"; do [ -z "$auth" ] || rm -f -- "$auth"; done
          }
          trap cleanup_gate_pull EXIT
          [ -f "$token_file" ] && [ ! -L "$token_file" ]
          [ "$(stat -Lc '%u:%g:%a:%h' "$token_file")" = '0:0:600:1' ]
          [[ "$gate_image" =~ ^ghcr\.io/kelion-team/kelionai/codex-gates@sha256:[0-9a-f]{64}$ ]] # hardcod-permis: namespace-ul OCI canonic este o ancoră de proveniență
          [[ "$gate_commit" =~ ^[0-9a-f]{40}$ ]]
          authfiles=()
          for identity in \
            'kelion-codex:/var/lib/kelion-codex:/run/kelion-codex' \
            'kelion-publisher:/var/lib/kelion-publisher:/run/kelion-publisher'; do
            IFS=: read -r user home runtime <<<"$identity"
            install -d -o "$user" -g "$user" -m 0700 "$runtime"
            auth=$(mktemp "$runtime/.constructor-gate-auth.XXXXXX")
            authfiles+=("$auth")
            printf '%s\n' '{}' > "$auth"
            chown "$user:$user" "$auth"
            chmod 0600 "$auth"
            printf '%s' "$(<"$token_file")" | (cd "$runtime" && runuser -u "$user" -- env -i \
              HOME="$home" XDG_RUNTIME_DIR="$runtime" PATH=/usr/bin:/bin \
              podman login --authfile "$auth" ghcr.io --username kelion-team --password-stdin) >/dev/null
            (cd "$runtime" && runuser -u "$user" -- env -i \
              HOME="$home" XDG_RUNTIME_DIR="$runtime" PATH=/usr/bin:/bin \
              podman pull --authfile "$auth" "$gate_image") >/dev/null
            digest=$(cd "$runtime" && runuser -u "$user" -- env -i \
              HOME="$home" XDG_RUNTIME_DIR="$runtime" PATH=/usr/bin:/bin \
              podman image inspect --format '{{.Digest}}' "$gate_image")
            [ "$digest" = "${gate_image##*@}" ]
            revision=$(cd "$runtime" && runuser -u "$user" -- env -i \
              HOME="$home" XDG_RUNTIME_DIR="$runtime" PATH=/usr/bin:/bin \
              podman image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' \
                "$gate_image")
            [ "$revision" = "$gate_commit" ]
            (cd "$runtime" && runuser -u "$user" -- env -i \
              HOME="$home" XDG_RUNTIME_DIR="$runtime" PATH=/usr/bin:/bin \
              podman logout --authfile "$auth" ghcr.io) >/dev/null
            rm -f -- "$auth"
          done
          rm -f -- "$token_file"
          GATE
          remote_registry_token=''
          proof=$(ssh "${ssh_opts[@]}" "$VPS_USER@$VPS_HOST" bash -s -- \
            "$remote_bundle" "$bundle_sha" <<'REMOTE'
          set -Eeuo pipefail
          umask 077
          archive=$1
          expected=$2
          [[ "$expected" =~ ^[0-9a-f]{64}$ ]]
          [ -f "$archive" ] && [ ! -L "$archive" ]
          [ "$(sha256sum "$archive" | awk '{print $1}')" = "$expected" ]
          durable_parent=/root/private-ai-finalize
          durable_root=$durable_parent/$expected
          unit=/etc/systemd/system/private-ai-constructor-finalize.service
          install -d -o root -g root -m 0700 "$durable_parent"
          [ -d "$durable_parent" ] && [ ! -L "$durable_parent" ]
          [ "$(stat -Lc '%u:%g:%a' "$durable_parent")" = '0:0:700' ]
          extract=$(mktemp -d "$durable_parent/.candidate.XXXXXX")
          unit_candidate=''
          cleanup_remote() {
            rm -f -- "$archive"
            [ -z "${unit_candidate:-}" ] || rm -f -- "$unit_candidate"
            case "${extract:-}" in
              "$durable_parent"/.candidate.[A-Za-z0-9]*)
                if [ -d "$extract" ] && [ ! -L "$extract" ]; then
                  rm -rf --one-file-system -- "$extract"
                fi
                ;;
            esac
          }
          trap cleanup_remote EXIT
          tar -tzf "$archive" > "$extract/entries"
          diff -u - "$extract/entries" <<'ENTRIES'
          .github/private-ai/codex-gates.json
          .github/private-ai/finalize-private-ai-constructor.sh
          deploy/codex-worker.mjs
          deploy/compose.production.yml
          deploy/constructor-model-control.mjs
          deploy/constructor-model-switch.sh
          deploy/constructor-sync-worker.sh
          deploy/lib/runtime-config-cutover.sh
          deploy/lib/service-auth.mjs
          deploy/opencode-constructor-instructions.md
          deploy/opencode-constructor.json
          deploy/sudoers/kelion-codex-full-access
          deploy/systemd/private-ai-web-full-access.conf
          deploy/systemd/kelion-constructor-sync.service
          deploy/systemd/kelion-constructor-model-control.service
          deploy/systemd/kelion-codex-worker.service
          SHA256SUMS
          ENTRIES
          rm -f -- "$extract/entries"
          tar -xzf "$archive" -C "$extract" --no-same-owner --no-same-permissions
          (cd "$extract" && sha256sum --check --strict SHA256SUMS)
          chown -R root:root "$extract"
          find "$extract" -type d -exec chmod 0700 {} +
          find "$extract" -type f -exec chmod 0600 {} +
          chmod 0700 "$extract/.github/private-ai/finalize-private-ai-constructor.sh"
          gate_manifest="$extract/.github/private-ai/codex-gates.json"
          [ -f "$gate_manifest" ] && [ ! -L "$gate_manifest" ]
          [ "$(stat -Lc '%u:%g:%a:%h' "$gate_manifest")" = '0:0:600:1' ]
          jq -e '
            type == "object" and
            (keys == ["commit", "image", "schema", "sourceRunId"]) and
            .schema == 1 and
            (.commit | strings | test("^[0-9a-f]{40}$")) and
            (.sourceRunId | type == "number" and . > 0 and floor == .) and
            (.image | strings | test("^ghcr[.]io/[a-z0-9_.-]+/[a-z0-9_.-]+/codex-gates@sha256:[0-9a-f]{64}$"))
          ' "$gate_manifest" >/dev/null
          expected_gate_commit=$(jq -er '.commit' "$gate_manifest")
          expected_gate_image=$(jq -er '.image' "$gate_manifest")
          sync -f "$extract/SHA256SUMS"
          sync -f "$extract"

          unit_candidate=$(mktemp /etc/systemd/system/.private-ai-constructor-finalize.XXXXXX)
          cat > "$unit_candidate" <<UNIT
          [Unit]
          Description=Kelion private AI Constructor durable finalization
          After=network-online.target private-ai-llm.service kelion-runtime-config-recovery.service
          Wants=network-online.target
          Requires=private-ai-llm.service
          StartLimitIntervalSec=3600
          StartLimitBurst=3

          [Service]
          Type=oneshot
          WorkingDirectory=$durable_root
          ExecStart=/usr/bin/bash $durable_root/.github/private-ai/finalize-private-ai-constructor.sh $durable_root $expected_gate_commit $expected_gate_image
          ExecStartPost=/usr/bin/systemctl disable private-ai-constructor-finalize.service
          Restart=on-failure
          RestartPreventExitStatus=75
          RestartSec=15s
          TimeoutStartSec=6900s
          TimeoutStopSec=600s

          [Install]
          WantedBy=multi-user.target
          UNIT
          chown root:root "$unit_candidate"
          chmod 0644 "$unit_candidate"
          sync -f "$unit_candidate"

          if systemctl is-active --quiet private-ai-constructor-finalize.service; then
            [ -f "$unit" ] && [ ! -L "$unit" ]
            [ "$(stat -Lc '%u:%g:%a:%h' "$unit")" = '0:0:644:1' ]
            cmp -s -- "$unit_candidate" "$unit"
            [ -d "$durable_root" ] && [ ! -L "$durable_root" ]
            [ "$(stat -Lc '%u:%g:%a' "$durable_root")" = '0:0:700' ]
            diff -qr --no-dereference "$extract" "$durable_root" >/dev/null
            (cd "$durable_root" && sha256sum --check --strict SHA256SUMS)
            rm -f -- "$unit_candidate"
            unit_candidate=''
            printf '%s\n' 'Finalizarea persistentă activă este legată de același bundle.' >&2
          else
            systemctl stop private-ai-constructor-finalize.service >/dev/null 2>&1 || true
            if [ -e "$durable_root" ] || [ -L "$durable_root" ]; then
              [ -d "$durable_root" ] && [ ! -L "$durable_root" ] \
                && [ "$(stat -Lc '%u:%g:%a' "$durable_root")" = '0:0:700' ]
              rm -rf --one-file-system -- "$durable_root"
            fi
            mv -- "$extract" "$durable_root"
            extract=''
            sync -f "$durable_parent"

            mv -f -- "$unit_candidate" "$unit"
            unit_candidate=''
            sync -f /etc/systemd/system
            systemctl daemon-reload
            systemctl enable private-ai-constructor-finalize.service >/dev/null
            systemctl reset-failed private-ai-constructor-finalize.service >/dev/null 2>&1 || true
            systemctl start --no-block private-ai-constructor-finalize.service
          fi

          [ "$(systemctl show private-ai-constructor-finalize.service -p FragmentPath --value)" = "$unit" ]
          [ -z "$(systemctl show private-ai-constructor-finalize.service -p DropInPaths --value)" ]
          [ "$(systemctl show private-ai-constructor-finalize.service -p WorkingDirectory --value)" = "$durable_root" ]
          deadline=$((SECONDS + 6850))
          success_invocation=''
          while :; do
            active=$(systemctl show private-ai-constructor-finalize.service -p ActiveState --value)
            result=$(systemctl show private-ai-constructor-finalize.service -p Result --value)
            invocation=$(systemctl show private-ai-constructor-finalize.service -p InvocationID --value)
            if [ "$active" = inactive ] && [ "$result" = success ] \
              && [[ "$invocation" =~ ^[0-9a-f]{32}$ ]]; then
              success_invocation=$invocation
              break
            fi
            restarts=$(systemctl show private-ai-constructor-finalize.service -p NRestarts --value)
            if [ "$active" = failed ]; then
              if [[ "$invocation" =~ ^[0-9a-f]{32}$ ]]; then
                journalctl --no-pager --output=cat "_SYSTEMD_INVOCATION_ID=$invocation" >&2
              else
                journalctl --no-pager --output=cat --unit=private-ai-constructor-finalize.service --lines=300 >&2
              fi
              exit 1
            fi
            [ "$SECONDS" -lt "$deadline" ] || {
              if [[ "$invocation" =~ ^[0-9a-f]{32}$ ]]; then
                journalctl --no-pager --output=cat "_SYSTEMD_INVOCATION_ID=$invocation" >&2
              else
                journalctl --no-pager --output=cat --unit=private-ai-constructor-finalize.service --lines=300 >&2
              fi
              exit 1
            }
            sleep 5
          done
          [ "$(systemctl is-enabled private-ai-constructor-finalize.service 2>/dev/null || true)" = disabled ]
          [ "$(sha256sum /opt/kelion-codex/codex-worker.mjs | awk '{print $1}')" = \
            "$(sha256sum "$durable_root/deploy/codex-worker.mjs" | awk '{print $1}')" ]
          [ "$(sha256sum /opt/kelion-constructor/constructor-sync-worker.sh | awk '{print $1}')" = \
            "$(sha256sum "$durable_root/deploy/constructor-sync-worker.sh" | awk '{print $1}')" ]
          [ "$(sha256sum /etc/systemd/system/kelion-constructor-sync.service | awk '{print $1}')" = \
            "$(sha256sum "$durable_root/deploy/systemd/kelion-constructor-sync.service" | awk '{print $1}')" ]
          [ "$(sha256sum /etc/systemd/system/kelion-codex-worker.service | awk '{print $1}')" = \
            "$(sha256sum "$durable_root/deploy/systemd/kelion-codex-worker.service" | awk '{print $1}')" ]
          [ "$(sha256sum /opt/kelion-constructor/constructor-model-control.mjs | awk '{print $1}')" = \
            "$(sha256sum "$durable_root/deploy/constructor-model-control.mjs" | awk '{print $1}')" ]
          [ "$(sha256sum /opt/private-ai/bin/constructor-model-switch | awk '{print $1}')" = \
            "$(sha256sum "$durable_root/deploy/constructor-model-switch.sh" | awk '{print $1}')" ]
          [ "$(sha256sum /opt/kelion-constructor/lib/service-auth.mjs | awk '{print $1}')" = \
            "$(sha256sum "$durable_root/deploy/lib/service-auth.mjs" | awk '{print $1}')" ]
          [ "$(sha256sum /etc/systemd/system/kelion-constructor-model-control.service | awk '{print $1}')" = \
            "$(sha256sum "$durable_root/deploy/systemd/kelion-constructor-model-control.service" | awk '{print $1}')" ]
          [ "$(stat -Lc '%u:%g:%a:%h' /root/kelion/secrets/constructor-model-control-secret)" = '0:10050:440:1' ]
          [ ! -e /root/kelion/runtime/constructor-reactivation.journal ] \
            && [ ! -L /root/kelion/runtime/constructor-reactivation.journal ]
          [ ! -e /root/kelion/runtime/private-ai-finalize-reactivation.owner ] \
            && [ ! -L /root/kelion/runtime/private-ai-finalize-reactivation.owner ]
          systemctl is-enabled --quiet kelion-constructor-model-control.service
          systemctl is-active --quiet kelion-constructor-model-control.service
          [ -S /run/kelion-constructor-model-control/control.sock ] \
            && [ ! -L /run/kelion-constructor-model-control/control.sock ] \
            && [ "$(stat -Lc '%u:%g:%a' /run/kelion-constructor-model-control/control.sock)" = '0:10050:660' ]
          [ "$(sha256sum /etc/sudoers.d/kelion-constructor-full-access | awk '{print $1}')" = \
            "$(sha256sum "$durable_root/deploy/sudoers/kelion-codex-full-access" | awk '{print $1}')" ]
          [ "$(sha256sum /srv/private-ai/home/.config/opencode/opencode.json | awk '{print $1}')" = \
            "$(sha256sum "$durable_root/deploy/opencode-constructor.json" | awk '{print $1}')" ]
          [ "$(sha256sum /srv/private-ai/home/.config/opencode/instructions.md | awk '{print $1}')" = \
            "$(sha256sum "$durable_root/deploy/opencode-constructor-instructions.md" | awk '{print $1}')" ]
          [ "$(sha256sum /etc/systemd/system/private-ai-web.service.d/90-kelion-constructor-full-access.conf | awk '{print $1}')" = \
            "$(sha256sum "$durable_root/deploy/systemd/private-ai-web-full-access.conf" | awk '{print $1}')" ]
          mapfile -t receipt_lines < /etc/private-ai/.constructor-finalized
          [ "${#receipt_lines[@]}" -eq 28 ]
          [ "${receipt_lines[0]}" = schema=3 ]
          journalctl --no-pager --output=cat "_SYSTEMD_INVOCATION_ID=$success_invocation"
          mem_total_kib=$(awk '/^MemTotal:/ { print $2 }' /proc/meminfo)
          [[ "$mem_total_kib" =~ ^[0-9]+$ ]]
          printf 'VPS_MEMORY_TOTAL_BYTES=%s\n' "$((mem_total_kib * 1024))"
          printf 'VPS_CPU_THREADS=%s\n' "$(nproc)"
          REMOTE
          )
          printf '%s\n' "$proof"
          grep -qx "WORKER_INSTALLED_SHA256=$expected_worker_sha" <<<"$proof"
          grep -qx "SYNC_WORKER_INSTALLED_SHA256=$expected_sync_worker_sha" <<<"$proof"
          grep -qx "SYNC_UNIT_INSTALLED_SHA256=$expected_sync_unit_sha" <<<"$proof"
          grep -qx "WORKER_UNIT_INSTALLED_SHA256=$expected_worker_unit_sha" <<<"$proof"
          grep -qx "MODEL_CONTROL_INSTALLED_SHA256=$expected_model_control_sha" <<<"$proof"
          grep -qx "MODEL_SWITCH_INSTALLED_SHA256=$expected_model_switch_sha" <<<"$proof"
          grep -qx "SERVICE_AUTH_INSTALLED_SHA256=$expected_service_auth_sha" <<<"$proof"
          grep -qx "MODEL_CONTROL_UNIT_INSTALLED_SHA256=$expected_model_control_unit_sha" <<<"$proof"
          grep -qx "WORKER_SUDOERS_INSTALLED_SHA256=$expected_sudoers_sha" <<<"$proof"
          grep -qx "OPENCODE_CONFIG_SHA256=$expected_config_sha" <<<"$proof"
          grep -qx "OPENCODE_INSTRUCTIONS_SHA256=$expected_instructions_sha" <<<"$proof"
          grep -qx "OPENCODE_WEB_DROPIN_SHA256=$expected_web_dropin_sha" <<<"$proof"
          grep -qx 'LLAMA_CPP_REF=c1d0e7a004015f23bc0233470b747b596f29b264' <<<"$proof"
          grep -Eq '^LLAMA_SERVER_SHA256=[0-9a-f]{64}$' <<<"$proof"
          grep -Eq '^OPENCODE_BIN_SHA256=[0-9a-f]{64}$' <<<"$proof"
          grep -qx 'MODEL_REVISION=baec3ebee244827cda0f4557eafa8b28f7545fa6' <<<"$proof"
          grep -qx 'MODEL_FILE=Qwen3.6-35B-A3B-Q4_K_M.gguf' <<<"$proof"
          grep -qx 'MODEL_FILE_BYTES=20419565568' <<<"$proof"
          grep -qx 'MODEL_FILE_SHA256=671e47e0ec53c665d048b98c3ecbfd5236b5ca9c3e02ed19fc8f81f7b85140c7' <<<"$proof"
          grep -Eq '^FINAL_RECEIPT_SHA256=[0-9a-f]{64}$' <<<"$proof"
          grep -qx 'PRIVATE_AI_BASE_VERIFIED=yes' <<<"$proof"
          grep -qx 'FULL_HOST_SUDO_PROBE=uid0' <<<"$proof"
          grep -qx 'OPENCODE_WEB_FULL_HOST_PROBE=uid0' <<<"$proof"
          grep -qx 'OPENCODE_EXECUTOR_GIT_VERIFIED status=porcelain-v1' <<<"$proof"
          grep -qx 'OPENCODE_EXECUTOR_E2E=passed' <<<"$proof"
          grep -qx 'WORKER_HMAC_HEARTBEAT_E2E=passed' <<<"$proof"
          grep -qx 'CONSTRUCTOR_RUNTIME_READY_PUBLISHED=yes' <<<"$proof"
          grep -Eq '^WORKER_CLAIM_INVOCATION_ID=[0-9a-f]{32}$' <<<"$proof"
          grep -Eq '^OPENCODE_WORKER_CLAIM_VERIFIED state=(no_claimable_job|pipeline_active|claimed)$' <<<"$proof"
          grep -qx 'WORKER_CLAIM_E2E=passed' <<<"$proof"
          grep -qx 'SYNC_SERVICE_E2E=passed' <<<"$proof"
          grep -qx 'LEGACY_CODEX_COMPAT_REMOVED=yes' <<<"$proof"
          grep -qx 'PRIVATE_AI_DUAL_ACCESS_VERIFIED=yes' <<<"$proof"
          grep -qx 'PRIVATE_AI_CONSTRUCTOR_FINALIZED=yes' <<<"$proof"
          grep -Eq '^VPS_MEMORY_TOTAL_BYTES=[0-9]+$' <<<"$proof"
          grep -Eq '^VPS_CPU_THREADS=[0-9]+$' <<<"$proof"
          {
            printf '%s\n' '### Constructor local — dovadă măsurată pe VPS'
            printf '%s\n' '```text'
            printf '%s\n' "$proof"
            printf '%s\n' '```'
          } >> "$GITHUB_STEP_SUMMARY"
