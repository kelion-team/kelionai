name: private-ai-constructor-finalize

on:
  push:
    branches:
      - ops/private-ai-install-20260830
    paths:
      - .github/workflows/private-ai-finalize.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: private-ai-constructor-finalize
  cancel-in-progress: false

jobs:
  finalize-vps:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: production
    env:
      VPS_HOST: ${{ vars.VPS_HOST }}
      VPS_USER: ${{ vars.VPS_USER }}
      VPS_HOST_KEY: ${{ vars.VPS_HOST_KEY }}
      SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      PRIVATE_AI_GITHUB_TOKEN: ${{ secrets.CONSTRUCTOR_PUBLISHER_GITHUB_TOKEN }}
    steps:
      - name: Configurează Constructorul local cu acces complet
        shell: bash
        run: |
          set -Eeuo pipefail
          [ "$VPS_USER" = root ]
          [ -n "$VPS_HOST" ] && [ -n "$VPS_HOST_KEY" ] && [ -n "$SSH_KEY" ]
          [ -n "$PRIVATE_AI_GITHUB_TOKEN" ]

          current_host_key=$(ssh-keyscan -T 20 -t ed25519 "$VPS_HOST" 2>/dev/null)
          [ "$current_host_key" = "$VPS_HOST_KEY" ]
          umask 077
          key_file=$(mktemp)
          known_hosts=$(mktemp)
          token_file=$(mktemp)
          remote_token="/root/private-ai-github-token.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            rm -f -- "$key_file" "$known_hosts" "$token_file"
          }
          trap cleanup EXIT
          printf '%s\n' "$SSH_KEY" > "$key_file"
          printf '%s\n' "$VPS_HOST_KEY" > "$known_hosts"
          printf '%s' "$PRIVATE_AI_GITHUB_TOKEN" > "$token_file"
          chmod 0600 "$key_file" "$known_hosts" "$token_file"
          ssh_opts=(
            -i "$key_file"
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$known_hosts"
            -o HostKeyAlgorithms=ssh-ed25519
            -o BatchMode=yes
            -o ConnectTimeout=25
            -o ServerAliveInterval=30
            -o ServerAliveCountMax=20
          )

          # Instalarea modelului poate fi încă în curs. Nu concurăm cu ea.
          for attempt in $(seq 1 600); do
            if ! ssh "${ssh_opts[@]}" "$VPS_USER@$VPS_HOST" \
              "pgrep -af '/root/private-ai-installer\\.' >/dev/null"; then
              break
            fi
            [ "$attempt" -lt 600 ]
            sleep 15
          done

          scp "${ssh_opts[@]}" "$token_file" "$VPS_USER@$VPS_HOST:$remote_token"
          ssh "${ssh_opts[@]}" "$VPS_USER@$VPS_HOST" \
            "chmod 0600 '$remote_token'; PRIVATE_AI_TOKEN_SOURCE='$remote_token' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          umask 077

          token_source=${PRIVATE_AI_TOKEN_SOURCE:?}
          cleanup_remote() {
            rm -f -- "$token_source"
          }
          trap cleanup_remote EXIT

          systemctl is-active --quiet private-ai-llm.service
          systemctl is-active --quiet private-ai-web.service
          curl --fail --silent --max-time 10 http://127.0.0.1:24080/health >/dev/null

          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y --no-install-recommends sudo >/dev/null

          install -d -o root -g root -m 0700 /etc/private-ai
          install -o root -g root -m 0400 "$token_source" /etc/private-ai/kelion-github-token
          printf '%s\n' 'sk-proj-local-qwen-no-paid-provider-0000000000000000' \
            > /etc/private-ai/local-codex-compat-key
          chown root:root /etc/private-ai/local-codex-compat-key
          chmod 0400 /etc/private-ai/local-codex-compat-key

          cat > /opt/private-ai/bin/git-credential-kelion <<'GIT_HELPER'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          operation=${1:-}
          [ "$operation" = get ] || exit 0
          while IFS= read -r line && [ -n "$line" ]; do :; done
          printf 'username=x-access-token\n'
          printf 'password='
          cat /etc/private-ai/kelion-github-token
          printf '\n\n'
          GIT_HELPER
          chown root:root /opt/private-ai/bin/git-credential-kelion
          chmod 0500 /opt/private-ai/bin/git-credential-kelion

          cat > /opt/private-ai/bin/opencode-constructor-root <<'ROOT_RUNNER'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          umask 077
          [ "$#" -eq 1 ]
          requested=$1
          worktree=$(realpath -e -- "$requested")
          case "$worktree" in
            /var/lib/kelion-codex/jobs/*/worktree) ;;
            *) printf 'Worktree Constructor invalid.\n' >&2; exit 64 ;;
          esac
          [ -d "$worktree/.git" ] || [ -f "$worktree/.git" ]
          prompt_file=$(mktemp /run/private-ai-constructor-order.XXXXXX)
          cleanup() { rm -f -- "$prompt_file"; }
          trap cleanup EXIT
          cat > "$prompt_file"
          [ -s "$prompt_file" ]
          cd "$worktree"
          env -i \
            HOME=/srv/private-ai/home \
            XDG_CONFIG_HOME=/srv/private-ai/home/.config \
            XDG_CACHE_HOME=/srv/private-ai/cache \
            XDG_DATA_HOME=/srv/private-ai/home/.local/share \
            OPENCODE_DISABLE_PROJECT_CONFIG=true \
            OPENCODE_DISABLE_LSP_DOWNLOAD=true \
            PATH=/opt/private-ai/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            LANG=C.UTF-8 LC_ALL=C.UTF-8 CI=1 NO_COLOR=1 \
            /opt/private-ai/bin/opencode run \
              --model llama.cpp/qwen3.6-35b-a3b-local \
              --auto \
              --file "$prompt_file" \
              'Execută integral ordinul Constructor atașat. Modifică worktree-ul, rulează testele relevante și nu te opri la plan.'
          ROOT_RUNNER
          chown root:root /opt/private-ai/bin/opencode-constructor-root
          chmod 0500 /opt/private-ai/bin/opencode-constructor-root

          real_codex=/opt/kelion-codex/bin/codex-real
          canonical_codex=/opt/kelion-codex/bin/codex
          if ! grep -q 'KELION_LOCAL_QWEN_WRAPPER_V1' "$canonical_codex" 2>/dev/null; then
            install -o root -g root -m 0555 "$canonical_codex" "$real_codex"
          fi
          [ -x "$real_codex" ]

          cat > "$canonical_codex" <<'CODEX_WRAPPER'
          #!/usr/bin/env bash
          # KELION_LOCAL_QWEN_WRAPPER_V1
          set -Eeuo pipefail
          real=/opt/kelion-codex/bin/codex-real
          if [ "${1:-}" = '--version' ]; then
            printf '%s\n' 'codex-cli 0.149.1'
            exit 0
          fi
          if [ "${1:-}" = exec ] && [ "${2:-}" = '--help' ]; then
            printf '%s\n' '--strict-config --ephemeral --ignore-user-config --ignore-rules --profile'
            exit 0
          fi
          if [ "${1:-}" = login ] && [ "${2:-}" = '--help' ]; then
            printf '%s\n' '--with-api-key'
            exit 0
          fi
          joined=" $* "
          if [[ "$joined" == *' login --with-api-key '* ]]; then
            cat >/dev/null
            auth_home=${CODEX_HOME:?}
            install -d -m 0700 "$auth_home"
            printf '%s\n' '{"auth_mode":"apikey","OPENAI_API_KEY":"sk-proj-local-qwen-compat"}' > "$auth_home/auth.json"
            chmod 0600 "$auth_home/auth.json"
            exit 0
          fi
          if [[ "$joined" == *' login status '* ]]; then
            printf '%s\n' 'Logged in using an API key - sk-proj-***local-qwen' >&2
            exit 0
          fi
          if [ "${1:-}" = exec ]; then
            worktree=''
            previous=''
            for value in "$@"; do
              if [ "$previous" = '-C' ]; then worktree=$value; break; fi
              previous=$value
            done
            [ -n "$worktree" ]
            exec /usr/bin/sudo -n /opt/private-ai/bin/opencode-constructor-root "$worktree"
          fi
          exec "$real" "$@"
          CODEX_WRAPPER
          chown root:root "$canonical_codex"
          chmod 0555 "$canonical_codex"

          printf '%s\n' \
            'kelion-codex ALL=(root) NOPASSWD: /opt/private-ai/bin/opencode-constructor-root *' \
            > /etc/sudoers.d/kelion-local-qwen-constructor
          chown root:root /etc/sudoers.d/kelion-local-qwen-constructor
          chmod 0440 /etc/sudoers.d/kelion-local-qwen-constructor
          visudo -cf /etc/sudoers.d/kelion-local-qwen-constructor >/dev/null

          install -d -o root -g root -m 0755 /etc/systemd/system/kelion-codex-worker.service.d
          cat > /etc/systemd/system/kelion-codex-worker.service.d/90-local-qwen-full-access.conf <<'DROPIN'
          [Unit]
          After=private-ai-llm.service
          Requires=private-ai-llm.service

          [Service]
          LoadCredential=
          LoadCredential=codex-worker-secret:/root/kelion/secrets/codex-worker-secret
          LoadCredential=openai-project-key:/etc/private-ai/local-codex-compat-key
          NoNewPrivileges=false
          PrivateDevices=false
          PrivateTmp=false
          ProtectClock=false
          ProtectControlGroups=false
          ProtectHome=false
          ProtectHostname=false
          ProtectKernelLogs=false
          ProtectKernelModules=false
          ProtectKernelTunables=false
          ProtectProc=default
          ProcSubset=all
          ProtectSystem=false
          RestrictNamespaces=false
          RestrictSUIDSGID=false
          CapabilityBoundingSet=~
          RestrictAddressFamilies=
          ReadWritePaths=
          DROPIN

          install -d -o root -g root -m 0755 /srv/private-ai/workspace
          if [ ! -d /srv/private-ai/workspace/kelionai/.git ]; then
            rm -rf -- /srv/private-ai/workspace/kelionai
            askpass=$(mktemp)
            cat > "$askpass" <<'ASKPASS'
          #!/usr/bin/env bash
          case "$1" in
            *Username*) printf '%s\n' x-access-token ;;
            *Password*) cat /etc/private-ai/kelion-github-token ;;
            *) exit 1 ;;
          esac
          ASKPASS
            chmod 0500 "$askpass"
            GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0 \
              git clone --no-tags https://github.com/kelion-team/kelionai.git \
              /srv/private-ai/workspace/kelionai
            rm -f -- "$askpass"
          fi
          [ "$(git -C /srv/private-ai/workspace/kelionai remote get-url origin)" = \
            'https://github.com/kelion-team/kelionai.git' ]
          git -C /srv/private-ai/workspace/kelionai config credential.helper \
            '!/opt/private-ai/bin/git-credential-kelion'
          git -C /srv/private-ai/workspace/kelionai config user.name 'Kelion Local Constructor'
          git -C /srv/private-ai/workspace/kelionai config user.email 'constructor@kelionai.local'
          chown -R root:root /srv/private-ai/workspace/kelionai

          cat > /srv/private-ai/home/.config/opencode/instructions.md <<'INSTRUCTIONS'
          You are Adrian's Kelion Constructor, powered only by the local Qwen model.
          You are the same Constructor used by the Kelion admin chat and by the separate laptop application.
          You have full root access to the Kelion repository, VPS runtime, services, containers, production files and configured credentials.
          Execute Adrian's explicit orders completely: inspect, edit, test, publish and verify the measured live result when the order requires it.
          Never claim success without measured evidence. Never expose secret values in chat, files, commits or logs.
          Do not use any paid or external AI provider. Reply in Romanian unless Adrian asks otherwise.
          INSTRUCTIONS

          jq '
            .permission = {
              "*":"allow", "read":"allow", "glob":"allow", "grep":"allow",
              "edit":"allow", "bash":"allow", "task":"allow", "skill":"allow",
              "webfetch":"allow", "websearch":"allow", "external_directory":"allow"
            }
            | .instructions = ["instructions.md"]
            | .share = "disabled"
            | .enabled_providers = ["llama.cpp"]
          ' /srv/private-ai/home/.config/opencode/opencode.json \
            > /srv/private-ai/home/.config/opencode/opencode.json.new
          mv -f /srv/private-ai/home/.config/opencode/opencode.json.new \
            /srv/private-ai/home/.config/opencode/opencode.json
          chown -R root:root /srv/private-ai/home/.config/opencode
          chmod 0600 /srv/private-ai/home/.config/opencode/opencode.json \
            /srv/private-ai/home/.config/opencode/instructions.md

          cat > /etc/systemd/system/private-ai-web.service <<'WEB_UNIT'
          [Unit]
          Description=Kelion Constructor local Qwen web interface with full access
          After=network-online.target private-ai-llm.service
          Wants=network-online.target
          Requires=private-ai-llm.service

          [Service]
          Type=simple
          User=root
          Group=root
          WorkingDirectory=/srv/private-ai/workspace/kelionai
          Environment=HOME=/srv/private-ai/home
          Environment=XDG_CONFIG_HOME=/srv/private-ai/home/.config
          Environment=XDG_CACHE_HOME=/srv/private-ai/cache
          Environment=XDG_DATA_HOME=/srv/private-ai/home/.local/share
          Environment=OPENCODE_DISABLE_PROJECT_CONFIG=true
          Environment=OPENCODE_DISABLE_LSP_DOWNLOAD=true
          EnvironmentFile=/etc/private-ai/opencode.env
          ExecStart=/opt/private-ai/bin/opencode web --hostname 127.0.0.1 --port 24096
          Restart=on-failure
          RestartSec=5
          TimeoutStartSec=300
          TimeoutStopSec=60
          UMask=0077
          CPUAccounting=yes
          CPUWeight=20
          CPUQuota=400%
          MemoryAccounting=yes
          MemoryHigh=8G
          MemoryMax=16G
          TasksMax=512

          [Install]
          WantedBy=multi-user.target
          WEB_UNIT

          systemctl daemon-reload
          systemctl restart private-ai-web.service
          systemctl restart kelion-codex-worker.timer
          systemctl start kelion-codex-worker.service

          systemctl is-active --quiet private-ai-llm.service
          systemctl is-active --quiet private-ai-web.service
          systemctl is-enabled --quiet kelion-codex-worker.timer
          ss -ltnH | awk '{print $4}' | grep -qx '127.0.0.1:24080'
          ss -ltnH | awk '{print $4}' | grep -qx '127.0.0.1:24096'
          ! ss -ltnH | awk '{print $4}' | grep -Eq '(0\.0\.0\.0|\[::\]):(24080|24096)$'
          curl --fail --silent --max-time 10 http://127.0.0.1:24080/health >/dev/null
          . /etc/private-ai/opencode.env
          auth=$(mktemp)
          printf 'user = "%s:%s"\n' "$OPENCODE_SERVER_USERNAME" "$OPENCODE_SERVER_PASSWORD" > "$auth"
          chmod 0600 "$auth"
          curl --config "$auth" --fail --silent --max-time 10 \
            http://127.0.0.1:24096/global/health | jq -e '.healthy == true' >/dev/null
          rm -f -- "$auth"
          unset OPENCODE_SERVER_PASSWORD
          sudo -u kelion-codex /opt/kelion-codex/bin/codex --version \
            | grep -qx 'codex-cli 0.149.1'
          sudo -u kelion-codex /opt/kelion-codex/bin/codex exec --help \
            | grep -q -- '--strict-config'
          systemd-analyze verify private-ai-web.service kelion-codex-worker.service >/dev/null
          test -x /opt/private-ai/bin/opencode-constructor-root
          test -r /etc/private-ai/kelion-github-token
          test -d /srv/private-ai/workspace/kelionai/.git
          grep -q 'full root access' /srv/private-ai/home/.config/opencode/instructions.md

          cat > /root/private-ai-access.txt <<EOF
          Kelion Constructor local is installed and healthy.

          It is the worker used by Kelion admin chat through the existing build_software queue.
          It is also available in the separate laptop application through this SSH tunnel:
          ssh -N -L 127.0.0.1:24096:127.0.0.1:24096 root@164.68.120.87

          Open after the tunnel starts:
          http://127.0.0.1:24096

          Web username:
          ${OPENCODE_SERVER_USERNAME}

          The web password remains in /etc/private-ai/opencode.env (root-only).
          Model: Qwen3.6-35B-A3B Q4 local via llama.cpp.
          Paid external AI execution: disabled; the Codex-compatible queue wrapper executes OpenCode locally.
          Access level: full root access to Kelion/VPS/containers/production.
          EOF
          chmod 0600 /root/private-ai-access.txt

          printf '%s\n' PRIVATE_AI_DUAL_ACCESS_VERIFIED
          REMOTE

  package-laptop-app:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Creează aplicația Windows Kelion Constructor
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p Kelion-Constructor-Windows
          cat > Kelion-Constructor-Windows/KelionConstructor.ps1 <<'LAUNCHER'
          $ErrorActionPreference = 'Stop'
          $VpsHostName = '164.68.120.87'
          $LocalPort = 24096
          $Ssh = Get-Command ssh.exe -ErrorAction Stop
          $Arguments = @(
            '-N', '-T',
            '-o', 'ExitOnForwardFailure=yes',
            '-o', 'ServerAliveInterval=30',
            '-o', 'ServerAliveCountMax=3',
            '-o', 'StrictHostKeyChecking=accept-new',
            '-L', "127.0.0.1:${LocalPort}:127.0.0.1:${LocalPort}",
            "root@${VpsHostName}"
          )
          $Tunnel = Start-Process -FilePath $Ssh.Source -ArgumentList $Arguments -PassThru
          try {
            $Ready = $false
            foreach ($Attempt in 1..40) {
              if ($Tunnel.HasExited) { throw 'Tunelul SSH nu a pornit. Verifică cheia SSH pentru VPS.' }
              try {
                $Client = [Net.Sockets.TcpClient]::new()
                $Connect = $Client.ConnectAsync('127.0.0.1', $LocalPort)
                if ($Connect.Wait(500) -and $Client.Connected) { $Ready = $true; $Client.Dispose(); break }
                $Client.Dispose()
              } catch {}
              Start-Sleep -Milliseconds 500
            }
            if (-not $Ready) { throw 'Constructorul nu a devenit accesibil prin tunel.' }
            Start-Process "http://127.0.0.1:${LocalPort}"
            $Tunnel.WaitForExit()
          } finally {
            if (-not $Tunnel.HasExited) { Stop-Process -Id $Tunnel.Id -Force }
          }
          LAUNCHER

          cat > Kelion-Constructor-Windows/Install-KelionConstructor.ps1 <<'INSTALLER'
          #requires -Version 5.1
          $ErrorActionPreference = 'Stop'
          $Source = Split-Path -Parent $MyInvocation.MyCommand.Path
          $Install = Join-Path $env:LOCALAPPDATA 'AE Studio\Kelion Constructor'
          New-Item -ItemType Directory -Force -Path $Install | Out-Null
          Copy-Item (Join-Path $Source 'KelionConstructor.ps1') (Join-Path $Install 'KelionConstructor.ps1') -Force
          $Shell = New-Object -ComObject WScript.Shell
          $Targets = @(
            (Join-Path ([Environment]::GetFolderPath('Desktop')) 'Kelion Constructor.lnk'),
            (Join-Path ([Environment]::GetFolderPath('Programs')) 'Kelion Constructor.lnk')
          )
          foreach ($Target in $Targets) {
            $Shortcut = $Shell.CreateShortcut($Target)
            $Shortcut.TargetPath = 'powershell.exe'
            $Shortcut.Arguments = '-NoProfile -ExecutionPolicy Bypass -File "' + (Join-Path $Install 'KelionConstructor.ps1') + '"'
            $Shortcut.WorkingDirectory = $Install
            $Shortcut.Description = 'Kelion Constructor local Qwen'
            $Shortcut.Save()
          }
          Write-Host 'Kelion Constructor a fost instalat pe Desktop și în meniul Start.'
          Write-Host 'La prima pornire, Windows OpenSSH folosește cheia SSH existentă pentru VPS.'
          INSTALLER

          cat > Kelion-Constructor-Windows/README.txt <<'README'
          KELION CONSTRUCTOR — WINDOWS

          1. Click dreapta pe Install-KelionConstructor.ps1 și alege Run with PowerShell.
          2. Pornește scurtătura Kelion Constructor de pe Desktop.
          3. Aplicația deschide un tunel SSH securizat și interfața OpenCode locală.

          Necesită Windows OpenSSH și cheia SSH existentă pentru root@164.68.120.87.
          Modelul și codul rulează pe VPS; portul nu este expus public.
          README

          chmod 0644 Kelion-Constructor-Windows/*
          zip -r Kelion-Constructor-Windows.zip Kelion-Constructor-Windows >/dev/null
          sha256sum Kelion-Constructor-Windows.zip > Kelion-Constructor-Windows.zip.sha256

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Kelion-Constructor-Windows
          path: |
            Kelion-Constructor-Windows.zip
            Kelion-Constructor-Windows.zip.sha256
          if-no-files-found: error
          retention-days: 30
