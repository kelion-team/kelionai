name: VPS Codex Login Bridge

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  login:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VPS_HOST: ${{ vars.VPS_HOST }}
      VPS_USER: ${{ vars.VPS_USER }}
      VPS_HOST_KEY: ${{ vars.VPS_HOST_KEY }}
      SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - name: Ceremonia de login Codex (device-auth)
        run: |
          set -euo pipefail
          umask 077
          key_file=$(mktemp)
          known_hosts=$(mktemp)
          trap 'rm -f -- "$key_file" "$known_hosts"' EXIT
          printf '%s\n' "$SSH_KEY" > "$key_file"
          printf '%s\n' "$VPS_HOST_KEY" > "$known_hosts"
          chmod 0600 "$key_file" "$known_hosts"
          ssh -i "$key_file" -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known_hosts" -o HostKeyAlgorithms=ssh-ed25519 -o BatchMode=yes -o ConnectTimeout=25 "$VPS_USER@$VPS_HOST" bash -s << 'EOF'
            set -euo pipefail
            runuser -u kelion-codex -- env HOME=/var/lib/kelion-codex-auth CODEX_HOME=/var/lib/kelion-codex-auth /opt/kelion-codex/bin/codex login --device-auth
            runuser -u kelion-codex -- env HOME=/var/lib/kelion-codex-auth CODEX_HOME=/var/lib/kelion-codex-auth /opt/kelion-codex/bin/codex login status
          EOF
