# APPLY PENDING RAILWAY CHANGES — manually or scheduled.
#
# When Railway's dashboard shows "125 pending changes to apply across 13 services
# including kelion-sync-engine, kelion-brain-interface, kelion-chat-api,
# kelion-orchestrator, kelion-google-integration", this workflow inspects the
# production project, validates that every service has a real id/name, and
# triggers a redeploy of each service. The redeploy applies the pending
# Variables/Settings updates and clears the dashboard build-up.
#
# It is safe to run repeatedly: it only triggers redeploys, it does not
# create, delete, or modify variables. If a service has no pending changes,
# the redeploy is a no-op.
#
# Run manually from the Actions tab, or schedule it for a maintenance window.
name: railway-apply-pending

on:
  workflow_dispatch:
  # Uncomment below to run automatically every hour during a migration window.
  # schedule:
  #   - cron: '0 * * * *'

concurrency:
  group: railway-apply-pending
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Apply pending changes across Railway production services
        env:
          TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set -uo pipefail
          if [ -z "$TOKEN" ]; then
            echo "::error::RAILWAY_TOKEN missing"
            exit 1
          fi
          GQL=https://backboard.railway.com/graphql/v2
          gql() { curl -sS --max-time 30 "$GQL" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -d "$1"; }

          echo "Querying Railway project..."
          RESP=$(gql '{"query":"query{projects{edges{node{id name environments{edges{node{id name}}} services{edges{node{id name}}}}}}}"}')
          P=$(echo "$RESP" | jq '[.data.projects.edges[].node | select(.name | test("kelion";"i"))][0] // .data.projects.edges[0].node')
          PID=$(echo "$P" | jq -r '.id')
          ENVID=$(echo "$P" | jq -r '[.environments.edges[].node | select(.name=="production")][0].id // .environments.edges[0].node.id')
          SVC_ROWS=$(echo "$P" | jq -r '.services.edges[]?.node | @base64')

          if [ -z "$PID" ] || [ -z "$ENVID" ]; then
            echo "::error::Could not find Railway project/environment"
            exit 1
          fi
          if [ -z "$SVC_ROWS" ]; then
            echo "No services found in project $PID — nothing to redeploy."
            exit 0
          fi

          echo "Project: $PID  Environment: $ENVID"
          total=0
          ok=0
          for row in $SVC_ROWS; do
            SID=$(echo "$row" | base64 -d | jq -r '.id')
            SNAME=$(echo "$row" | base64 -d | jq -r '.name')
            if [ -z "$SID" ] || [ -z "$SNAME" ]; then
              echo "::warning::Skipping invalid service row"
              continue
            fi
            total=$((total + 1))
            echo "[$total] Redeploying $SNAME ($SID)"
            DQ=$(jq -nc --arg e "$ENVID" --arg s "$SID" \
              '{query:"mutation($e:String!,$s:String!){serviceInstanceDeploy(environmentId:$e,serviceId:$s)}",variables:{e:$e,s:$s}}')
            if gql "$DQ" | jq -e '.data.serviceInstanceDeploy' >/dev/null 2>&1; then
              echo "     OK — pending changes queued for deploy"
              ok=$((ok + 1))
            else
              echo "::warning::     Failed to trigger redeploy for $SNAME"
            fi
          done

          echo ""
          echo "============================================"
          echo "Services redeployed: $ok / $total"
          echo "============================================"
          if [ "$ok" -eq 0 ] && [ "$total" -gt 0 ]; then
            echo "::error::No service redeploys succeeded — check RAILWAY_TOKEN permissions and the GraphQL response"
            exit 1
          fi
