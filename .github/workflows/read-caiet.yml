# CITEȘTE CAIETUL COMUN + ISTORICUL ADMIN (doar-citire, diagnostic).
# AUTORIZAT EXPLICIT de Adrian (11 iul): conținutul poate apărea în jurnalul
# rulării GitHub Actions (repo privat, vizibil doar owner-ului).
#
# NU cere parola VPS — endpoint-urile /api/bridge/memory și /api/bridge/chat-history
# sunt deja protejate de BRIDGE_SECRET. Secretul vine din GitHub Secrets
# (BRIDGE_SECRET; Railway a fost scos pe 22 iul 2026) — fără SSH, fără să
# distribuim secretul mai departe.
name: read-caiet

on:
  workflow_dispatch:
    inputs:
      post_content:
        description: 'Notă de scris în caiet înainte de citire (gol = doar citește)'
        required: false
      post_source:
        description: 'Semnătura notei (implicit: claude-cloud)'
        required: false
      post_order:
        description: 'Ordin de lucru pus direct în coada constructorului (gol = nimic)'
        required: false
  push:
    branches: [claude/chat-instant-delay-em5gjf]
    paths: ['.github/workflows/read-caiet.yml']

jobs:
  read:
    runs-on: ubuntu-latest
    steps:
      - name: Citește caietul comun (shared_memory) + istoricul admin
        env:
          SECRET: ${{ secrets.BRIDGE_SECRET }}
          POST_CONTENT: ${{ inputs.post_content }}
          POST_SOURCE: ${{ inputs.post_source }}
          POST_ORDER: ${{ inputs.post_order }}
        run: |
          set -uo pipefail
          [ -z "$SECRET" ] && { echo "::error::BRIDGE_SECRET lipsește din Settings → Secrets → Actions."; exit 1; }

          # SCRIERE în caiet (opțional) — convenția ORIGINALĂ dintre cei doi
          # Claude: Kelion citește caietul la FIECARE mesaj, deci o notă pusă
          # aici ajunge la el garantat, fără bridgeAsk (zero cost de abonament).
          if [ -n "${POST_CONTENT:-}" ]; then
            echo "=== SCRIU ÎN CAIET (semnat: ${POST_SOURCE:-claude-cloud}) ==="
            jq -nc --arg s "${POST_SOURCE:-claude-cloud}" --arg c "$POST_CONTENT" '{source:$s,content:$c}' | \
              curl -sS --max-time 15 -X POST -H "x-bridge-secret: $SECRET" -H "Content-Type: application/json" \
                -d @- https://kelionai.app/api/bridge/memory
            echo ""
          fi

          # ORDIN DE LUCRU (opțional) — intră în coada constructorului exact ca
          # un ordin din chat (POST /api/bridge/workorders, deja protejat de
          # BRIDGE_SECRET). Așa se pot instala/repara lucruri PE VPS fără să-i
          # cerem lui Adrian parola (ordinul lui, 11 iul: „fără să mă streseze").
          if [ -n "${POST_ORDER:-}" ]; then
            echo "=== TRIMIT ORDIN DE LUCRU CONSTRUCTORULUI ==="
            jq -nc --arg t "$POST_ORDER" '{text:$t}' | \
              curl -sS --max-time 15 -X POST -H "x-bridge-secret: $SECRET" -H "Content-Type: application/json" \
                -d @- https://kelionai.app/api/bridge/workorders
            echo ""
          fi

          echo "=== CAIETUL COMUN (shared_memory, ultimele 60) ==="
          curl -sS --max-time 15 -H "x-bridge-secret: $SECRET" https://kelionai.app/api/bridge/memory | jq -r '
            .memory[]? | "[\(.created_at // .at // "?")] \(.source // "?"): \(.content // .text // .)"' 2>/dev/null \
            || curl -sS --max-time 15 -H "x-bridge-secret: $SECRET" https://kelionai.app/api/bridge/memory

          echo ""
          echo "=== ISTORICUL RECENT ADMIN (ultimele 40 mesaje) ==="
          curl -sS --max-time 15 -H "x-bridge-secret: $SECRET" https://kelionai.app/api/bridge/chat-history | jq -r '
            .history[]? | "[\(.role // "?")] \((.content // "") | .[0:200])"' 2>/dev/null \
            || curl -sS --max-time 15 -H "x-bridge-secret: $SECRET" https://kelionai.app/api/bridge/chat-history
