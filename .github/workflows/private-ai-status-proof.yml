name: Constructor approved OpenCode readiness proof

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: constructor-read-only-proof
  cancel-in-progress: false

jobs:
  guard-source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/heads/master
          fetch-depth: 0
          persist-credentials: false
      - name: Verifică sursa canonică
        shell: bash
        run: |
          set -Eeuo pipefail
          [ "$GITHUB_REPOSITORY" = kelion-team/kelionai ] # hardcod-permis: repository canonic
          [ "$GITHUB_REF" = refs/heads/master ]
          [ "$GITHUB_REF_NAME" = master ]
          [ "$(git rev-parse HEAD)" = "$GITHUB_SHA" ]
          [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/master)" ]

  measured-proof:
    needs: guard-source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/heads/master
          fetch-depth: 0
          persist-credentials: false
      - name: Verifică sursa canonică
        shell: bash
        run: |
          set -Eeuo pipefail
          [ "$GITHUB_REPOSITORY" = kelion-team/kelionai ] # hardcod-permis: repository canonic
          [ "$GITHUB_REF" = refs/heads/master ]
          [ "$GITHUB_REF_NAME" = master ]
          [ "$(git rev-parse HEAD)" = "$GITHUB_SHA" ]
          [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/master)" ]
      - name: Verifică local dovada fără acces la producție
        shell: bash
        run: |
          set -Eeuo pipefail
          node --test .github/private-ai/constructor-status-proof.test.mjs
          node deploy/constructor-model-control.mjs --validate-runtime-config "$PWD/deploy/opencode-constructor.json"

      - name: Citește numai starea și dovezile instalate
        shell: bash
        env:
          PROOF_JOB_ID: status
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER }}
          VPS_HOST_KEY: ${{ vars.VPS_HOST_KEY }}
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          [ "$GITHUB_REPOSITORY" = kelion-team/kelionai ] # hardcod-permis: repository canonic
          [ "$GITHUB_REF" = refs/heads/master ]
          [ "$(git rev-parse HEAD)" = "$GITHUB_SHA" ]
          [ "$VPS_USER" = root ]
          [ -n "$VPS_HOST" ] && [ -n "$VPS_HOST_KEY" ] && [ -n "$SSH_KEY" ]
          [ "${#VPS_HOST}" -le 253 ]
          [[ "$VPS_HOST" =~ ^([A-Za-z0-9]|[A-Za-z0-9][A-Za-z0-9.-]{0,251}[A-Za-z0-9])$ ]]
          [[ "$VPS_HOST" != *..* ]]
          [ "$PROOF_JOB_ID" = status ]
          current_host_key=$(ssh-keyscan -T 20 -t ed25519 "$VPS_HOST" 2>/dev/null)
          [ "$current_host_key" = "$VPS_HOST_KEY" ]
          umask 077
          key_file=$(mktemp)
          known_hosts=$(mktemp)
          trap 'rm -f -- "$key_file" "$known_hosts"' EXIT
          printf '%s\n' "$SSH_KEY" > "$key_file"
          printf '%s\n' "$VPS_HOST_KEY" > "$known_hosts"
          chmod 0600 "$key_file" "$known_hosts"
          source_files=(
            deploy/constructor-model-control.mjs
            deploy/lib/service-auth.mjs
            deploy/codex-worker.mjs
            deploy/systemd/kelion-codex-worker.service
            deploy/opencode-constructor.json
            deploy/opencode-constructor-instructions.md
          )
          hashes=()
          for source in "${source_files[@]}"; do
            source_hash=$(sha256sum "$source" | awk '{print $1}')
            [[ "$source_hash" =~ ^[0-9a-f]{64}$ ]]
            hashes+=("$source_hash")
          done
          # No installer, inference, claim, retry, service start, or deployment here.
          ssh -i "$key_file" -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$known_hosts" -o HostKeyAlgorithms=ssh-ed25519 \
            -o BatchMode=yes -o ConnectTimeout=25 \
            "$VPS_USER@$VPS_HOST" node --input-type=module - --installed \
            "${hashes[@]}" "$PROOF_JOB_ID" \
            < .github/private-ai/constructor-status-proof.mjs
