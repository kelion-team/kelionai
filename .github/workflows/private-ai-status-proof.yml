name: private-ai-status-proof

on:
  push:
    branches:
      - ops/private-ai-install-20260830
    paths:
      - .github/workflows/private-ai-status-proof.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard-source:
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Refuză orice sursă diferită de ramura operațională canonică
        shell: bash
        run: |
          set -Eeuo pipefail
          [ "$GITHUB_REPOSITORY" = kelion-team/kelionai ]
          [ "$GITHUB_REF" = refs/heads/ops/private-ai-install-20260830 ]
          [ "$GITHUB_REF_NAME" = ops/private-ai-install-20260830 ]
          [ "$(git rev-parse HEAD)" = "$GITHUB_SHA" ]

  measured-status:
    needs: guard-source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Citește starea măsurată a instalării
        shell: bash
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER }}
          VPS_HOST_KEY: ${{ vars.VPS_HOST_KEY }}
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          [ "$GITHUB_REPOSITORY" = kelion-team/kelionai ]
          [ "$GITHUB_REF" = refs/heads/ops/private-ai-install-20260830 ]
          [ "$GITHUB_REF_NAME" = ops/private-ai-install-20260830 ]
          [ "$(git rev-parse HEAD)" = "$GITHUB_SHA" ]
          [ "$VPS_USER" = root ]
          [ -n "$VPS_HOST" ] && [ -n "$VPS_HOST_KEY" ] && [ -n "$SSH_KEY" ]
          current_host_key=$(ssh-keyscan -T 20 -t ed25519 "$VPS_HOST" 2>/dev/null)
          [ "$current_host_key" = "$VPS_HOST_KEY" ]
          umask 077
          key_file=$(mktemp)
          known_hosts=$(mktemp)
          trap 'rm -f -- "$key_file" "$known_hosts"' EXIT
          printf '%s\n' "$SSH_KEY" > "$key_file"
          printf '%s\n' "$VPS_HOST_KEY" > "$known_hosts"
          chmod 0600 "$key_file" "$known_hosts"
          ssh_opts=(
            -i "$key_file"
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$known_hosts"
            -o HostKeyAlgorithms=ssh-ed25519
            -o BatchMode=yes
            -o ConnectTimeout=25
          )
          ssh "${ssh_opts[@]}" "$VPS_USER@$VPS_HOST" bash -s <<'REMOTE'
          set -Eeuo pipefail
          printf 'MEASURED_AT=%s\n' "$(date -u +%FT%TZ)"
          if pgrep -af '/root/private-ai-installer\.' >/dev/null; then
            printf 'INSTALLER_PROCESS=running\n'
          else
            printf 'INSTALLER_PROCESS=not_running\n'
          fi
          for unit in private-ai-llm.service private-ai-web.service; do
            printf '%s=' "$unit"
            systemctl is-active "$unit" 2>/dev/null || true
          done
          if [ -d /srv/private-ai/models ]; then
            printf 'MODEL_STORAGE='; du -sh /srv/private-ai/models | awk '{print $1}'
          else
            printf 'MODEL_STORAGE=missing\n'
          fi
          if [ -f /var/lib/private-ai/model.ready ]; then
            printf 'MODEL_READY=yes\n'
          else
            printf 'MODEL_READY=no\n'
          fi
          for unit in private-ai-install-resume.service private-ai-llm.service private-ai-web.service; do
            printf '%s\n' "--- $unit ---"
            systemctl show "$unit" \
              -p ActiveState -p SubState -p Result -p ExecMainStatus -p MainPID \
              -p ControlGroup -p NRestarts --no-pager 2>/dev/null || true
          done
          printf 'LLAMA_SERVER_SHA256=%s\n' "$(sha256sum /opt/private-ai/bin/llama-server | awk '{print $1}')"
          printf 'OPENCODE_BIN_SHA256=%s\n' "$(sha256sum /opt/private-ai/bin/opencode | awk '{print $1}')"
          printf 'LLAMA_CPP_CHECKOUT=%s\n' "$(runuser -u privateai -- env -i \
            HOME=/srv/private-ai/home PATH=/usr/bin:/bin \
            git -C /opt/private-ai/src/llama.cpp rev-parse HEAD)"
          llm_pid=$(systemctl show private-ai-llm.service -p MainPID --value)
          [[ "$llm_pid" =~ ^[1-9][0-9]*$ ]]
          printf 'LLAMA_PROCESS_EXE=%s\n' "$(readlink -f "/proc/$llm_pid/exe")"
          printf '%s\n' '--- LLAMA MODEL MAPS ---'
          awk '$NF ~ /^\/srv\/private-ai\/models\// { print $NF }' "/proc/$llm_pid/maps" \
            | sort -u
          resume_group=$(systemctl show private-ai-install-resume.service -p ControlGroup --value 2>/dev/null || true)
          if [ -n "$resume_group" ] && [ -d "/sys/fs/cgroup$resume_group" ]; then
            printf '%s\n' '--- RESUME CGROUP PROCESSES ---'
            while IFS= read -r pid; do
              [[ "$pid" =~ ^[1-9][0-9]*$ ]] || continue
              ps -o pid,ppid,etime,time,%cpu,%mem,rss,vsz,stat,wchan:24,args -p "$pid" --no-headers || true
              if [ -r "/proc/$pid/io" ]; then
                printf 'PROC_IO_PID=%s ' "$pid"
                tr '\n' ' ' < "/proc/$pid/io" || true
                printf '\n'
                printf 'PROC_STDOUT_PID=%s ' "$pid"
                readlink "/proc/$pid/fd/1" || true
              fi
            done < "/sys/fs/cgroup$resume_group/cgroup.procs"
            printf 'CGROUP_MEMORY_CURRENT='; cat "/sys/fs/cgroup$resume_group/memory.current" 2>/dev/null || true
            printf 'CGROUP_CPU_STAT='; tr '\n' ' ' < "/sys/fs/cgroup$resume_group/cpu.stat" 2>/dev/null || true; printf '\n'
          fi
          printf '%s\n' '--- MODEL CACHE FILES ---'
          find /srv/private-ai/models -type f -printf '%s %TY-%Tm-%TdT%TH:%TM:%TS %p\n' 2>/dev/null \
            | sort -nr | head -n 20 || true
          if [ -f /var/lib/private-ai/model-smoke.txt ]; then
            printf 'MODEL_SMOKE_BYTES='; stat -Lc '%s' /var/lib/private-ai/model-smoke.txt
            printf 'MODEL_SMOKE_TAIL_BASE64='; tail -c 256 /var/lib/private-ai/model-smoke.txt | base64 -w0; printf '\n'
          fi
          if [ -f /root/private-ai-install.log ]; then
            printf '%s\n' '--- INSTALL LOG TAIL ---'
            tail -n 80 /root/private-ai-install.log \
              | sed -E 's/(password|token|secret|key)=([^[:space:]]+)/\1=[REDACTED]/Ig'
          else
            printf 'INSTALL_LOG=missing\n'
          fi
          if [ -f /root/private-ai-install-resume.log ]; then
            printf '%s\n' '--- RESUME LOG TAIL ---'
            tail -n 160 /root/private-ai-install-resume.log \
              | sed -E 's/(password|token|secret|key)=([^[:space:]]+)/\1=[REDACTED]/Ig'
          else
            printf 'RESUME_LOG=missing\n'
          fi
          REMOTE
