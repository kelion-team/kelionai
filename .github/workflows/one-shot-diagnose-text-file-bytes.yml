name: one-shot-diagnose-text-file-bytes

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  guard-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/heads/master
          fetch-depth: 0
          persist-credentials: false

      - name: Validează sursa canonică fără secrete
        shell: bash
        run: |
          set -Eeuo pipefail
          [ "$GITHUB_REPOSITORY" = kelion-team/kelionai ] # hardcod-permis: identitatea tehnică imuabilă a repository-ului canonic
          [ "$GITHUB_REF" = refs/heads/master ]
          [ "$GITHUB_REF_NAME" = master ]
          [ "$(git rev-parse HEAD)" = "$GITHUB_SHA" ]
          [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/master)" ]

  diagnose:
    needs: guard-source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      VPS_HOST: ${{ vars.VPS_HOST }}
      VPS_USER: ${{ vars.VPS_USER }}
      VPS_HOST_KEY: ${{ vars.VPS_HOST_KEY }}
      SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - name: Reproduce exact validate_text_file_bytes pe toate unitatile (read-only)
        shell: bash
        run: |
          set -Eeuo pipefail
          [ "$VPS_USER" = root ]
          [ -n "$VPS_HOST" ] && [ -n "$VPS_HOST_KEY" ] && [ -n "$SSH_KEY" ]
          umask 077
          key_file=$(mktemp)
          known_hosts=$(mktemp)
          cleanup() { rm -f -- "$key_file" "$known_hosts"; }
          trap cleanup EXIT
          printf '%s\n' "$SSH_KEY" > "$key_file"
          printf '%s\n' "$VPS_HOST_KEY" > "$known_hosts"
          chmod 0600 "$key_file" "$known_hosts"
          ssh_opts=(
            -i "$key_file"
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$known_hosts"
            -o HostKeyAlgorithms=ssh-ed25519
            -o BatchMode=yes
            -o ConnectTimeout=25
          )
          ssh "${ssh_opts[@]}" "$VPS_USER@$VPS_HOST" bash -s <<'REMOTE'
          set -Eeuo pipefail
          validate_text_file_bytes() {
            local file=$1 original_size clean_size last_byte
            [ -s "$file" ] && [ "$(stat -c '%s' "$file")" -le 65536 ] || { echo "FAIL:empty-or-too-big"; return 1; }
            original_size=$(wc -c < "$file")
            clean_size=$(LC_ALL=C tr -d '\000-\011\013-\037\177' < "$file" | wc -c)
            if [ "$original_size" -ne "$clean_size" ]; then
              echo "FAIL:control-chars original=$original_size clean=$clean_size"
              return 1
            fi
            last_byte=$(tail -c 1 -- "$file" | od -An -t u1 | tr -d '[:space:]')
            if [ "$last_byte" != 10 ]; then
              echo "FAIL:last-byte=$last_byte (expected 10)"
              return 1
            fi
            echo "PASS"
          }
          for u in kelion-codex-worker.service kelion-codex-worker.timer \
            kelion-constructor-publisher.service kelion-constructor-publisher.timer \
            kelion-constructor-release.service kelion-constructor-release.timer \
            kelion-constructor-sync.service kelion-runtime-config-recovery.service; do
            path="/etc/systemd/system/$u"
            printf '%s: ' "$u"
            validate_text_file_bytes "$path" || true
          done
          echo 'DIAG_DONE=yes'
          REMOTE
