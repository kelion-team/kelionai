# DIAGNOSTIC ASR (doar-citire): în ce REGIUNE acceptă Google chirp_3 streaming
# pentru proiectul nostru. Verdictul anterior: us-central1 NU are chirp_3
# (chirp_2 da). Probăm regiunile candidate cu cheia reală.

name: brain-diag

on:
  pull_request:
    paths:
      - '.github/workflows/brain-diag.yml'

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: chirp_3 streaming — matrice pe regiuni
        env:
          TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set -uo pipefail
          GQL=https://backboard.railway.com/graphql/v2
          gql() { curl -sS --max-time 30 "$GQL" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -d "$1"; }
          RESP=$(gql '{"query":"query{projects{edges{node{id name environments{edges{node{id name}}} services{edges{node{id name}}}}}}}"}')
          P=$(echo "$RESP" | jq '[.data.projects.edges[].node | select(.name | test("kelion";"i"))][0]')
          PID=$(echo "$P" | jq -r '.id'); ENVID=$(echo "$P" | jq -r '[.environments.edges[].node | select(.name=="production")][0].id')
          SVCID=$(echo "$P" | jq -r '[.services.edges[].node | select(.name=="web")][0].id // .services.edges[0].node.id')
          VQ=$(jq -nc --arg p "$PID" --arg e "$ENVID" --arg s "$SVCID" \
            '{query:"query($p:String!,$e:String!,$s:String!){variables(projectId:$p,environmentId:$e,serviceId:$s)}",variables:{p:$p,e:$e,s:$s}}')
          gql "$VQ" | jq -r '.data.variables.GOOGLE_SERVICE_ACCOUNT_JSON // empty' > /tmp/sa.json
          [ -s /tmp/sa.json ] || { echo "::error::GOOGLE_SERVICE_ACCOUNT_JSON lipsă"; exit 0; }
          npm i --no-save --silent @google-cloud/speech >/dev/null 2>&1
          node - <<'EOF'
          const { v2 } = require('@google-cloud/speech')
          const creds = require('/tmp/sa.json')
          const pid = creds.project_id
          const base = { encoding: 'LINEAR16', sampleRateHertz: 16000, audioChannelCount: 1 }
          const REGIONS = ['us', 'eu', 'us-east1', 'us-west1', 'europe-west1', 'europe-west2', 'europe-west3', 'europe-west4', 'asia-southeast1', 'northamerica-northeast1', 'global']
          const silence = Buffer.alloc(16000)
          async function probe(region, langs) {
            const ep = region === 'global' ? 'speech.googleapis.com' : `${region}-speech.googleapis.com`
            const rec = `projects/${pid}/locations/${region}/recognizers/_`
            const client = new v2.SpeechClient({ credentials: creds, projectId: pid, apiEndpoint: ep })
            return new Promise((resolve) => {
              let done = false
              let s
              const fin = (msg) => { if (!done) { done = true; console.log(`chirp_3 @ ${region} [${langs}] -> ${msg}`); try { s && s.end() } catch {} resolve() } }
              try { s = client._streamingRecognize() } catch (e) { return fin(`SPAWN FAIL: ${e.message}`) }
              s.on('error', (e) => fin(`EROARE: [${e.code ?? '?'}] ${String(e.message).slice(0, 160)}`))
              s.on('data', () => fin('OK - acceptat (a raspuns)'))
              setTimeout(() => fin('OK - nicio eroare in 4s (acceptat)'), 4000)
              try {
                s.write({ recognizer: rec, streamingConfig: { config: { model: 'chirp_3', languageCodes: [langs], explicitDecodingConfig: base }, streamingFeatures: { interimResults: true } } })
                s.write({ audio: silence })
              } catch (e) { fin(`WRITE FAIL: ${e.message}`) }
            })
          }
          ;(async () => {
            for (const r of REGIONS) await probe(r, 'auto')
            console.log('--- si cu ro-RO in regiunile-cheie ---')
            for (const r of ['us', 'eu', 'europe-west4']) await probe(r, 'ro-RO')
          })()
          EOF
