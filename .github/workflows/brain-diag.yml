# DIAGNOSTIC RUNTIME (doar-citire, NU atinge producția): rulează pe pull_request.
# Scoate jurnalul RUNTIME al serverului de pe Railway — erori, calea punții,
# joburile publice, vocea (TTS/ASR) — ca să vedem EXACT ce s-a întâmplat la
# testele lui Adrian (demo fără audio), nu să ghicim.

name: brain-diag

on:
  pull_request:
    paths:
      - '.github/workflows/brain-diag.yml'

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Jurnal runtime Railway — erori + punte + voce
        env:
          TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set -uo pipefail
          GQL=https://backboard.railway.com/graphql/v2
          gql() { curl -sS --max-time 30 "$GQL" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -d "$1"; }

          RESP=$(gql '{"query":"query{projects{edges{node{id name environments{edges{node{id name}}} services{edges{node{id name}}}}}}}"}')
          P=$(echo "$RESP" | jq '[.data.projects.edges[].node | select(.name | test("kelion";"i"))][0]')
          PID=$(echo "$P" | jq -r '.id')
          ENVID=$(echo "$P" | jq -r '[.environments.edges[].node | select(.name=="production")][0].id')
          SVCID=$(echo "$P" | jq -r '[.services.edges[].node | select(.name=="web")][0].id // .services.edges[0].node.id')

          DQ=$(jq -nc --arg p "$PID" --arg e "$ENVID" --arg s "$SVCID" \
            '{query:"query($p:String!,$e:String!,$s:String!){deployments(first:1,input:{projectId:$p,environmentId:$e,serviceId:$s}){edges{node{id status createdAt}}}}",variables:{p:$p,e:$e,s:$s}}')
          DEP=$(gql "$DQ")
          DID=$(echo "$DEP" | jq -r '.data.deployments.edges[0].node.id // empty')
          echo "deployment=$DID status=$(echo "$DEP" | jq -r '.data.deployments.edges[0].node.status // "?"') created=$(echo "$DEP" | jq -r '.data.deployments.edges[0].node.createdAt // "?"')"
          [ -z "$DID" ] && { echo "::error::nu găsesc deployment-ul"; exit 0; }

          LQ=$(jq -nc --arg d "$DID" \
            '{query:"query($d:String!){deploymentLogs(deploymentId:$d,limit:2000){timestamp message severity}}",variables:{d:$d}}')
          LOGS=$(gql "$LQ")
          echo "$LOGS" | jq -r '.errors[]?.message' 2>/dev/null || true
          ALL=$(echo "$LOGS" | jq -r '.data.deploymentLogs[]? | "\(.timestamp) [\(.severity)] \(.message)"')
          echo "linii total: $(echo "$ALL" | wc -l)"

          echo "=== ERORI — ultimele 60 ==="
          echo "$ALL" | grep -iE '\[err|error|fail|exception|unhandled|reject' | tail -60 || echo "(nimic)"

          echo "=== PUNTE + JOBURI PUBLICE — ultimele 60 ==="
          echo "$ALL" | grep -iE 'bridge|public|persona|stall' | tail -60 || echo "(nimic)"

          echo "=== VOCE (tts/asr/chirp) — ultimele 40 ==="
          echo "$ALL" | grep -iE 'tts|synth|asr|voice|chirp|speech' | tail -40 || echo "(nimic)"

          echo "=== ULTIMELE 40 LINII BRUTE ==="
          echo "$ALL" | tail -40
