# DIAGNOSTIC: ULTIMELE DEPLOYMENT-URI RAILWAY (doar-citire, NU atinge producția).
# Rulează pe pull_request. Listează ultimele 6 deployment-uri cu status/oră
# exactă/commit, apoi scoate jurnalul de BUILD pentru orice deployment care NU
# a reușit — ca să vedem EXACT ce a picat și când, nu să presupunem.

name: brain-diag

on:
  pull_request:
    paths:
      - '.github/workflows/brain-diag.yml'

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Ultimele 6 deployment-uri Railway — status, ora, commit, jurnal de build la eșec
        env:
          TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set -uo pipefail
          GQL=https://backboard.railway.com/graphql/v2
          gql() { curl -sS --max-time 30 "$GQL" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -d "$1"; }
          RESP=$(gql '{"query":"query{projects{edges{node{id name environments{edges{node{id name}}} services{edges{node{id name}}}}}}}"}')
          P=$(echo "$RESP" | jq '[.data.projects.edges[].node | select(.name | test("kelion";"i"))][0]')
          PID=$(echo "$P" | jq -r '.id')
          ENVID=$(echo "$P" | jq -r '[.environments.edges[].node | select(.name=="production")][0].id')
          SVCID=$(echo "$P" | jq -r '[.services.edges[].node | select(.name=="web")][0].id // .services.edges[0].node.id')
          echo "proiect=$PID mediu=$ENVID serviciu=$SVCID"

          DQ=$(jq -nc --arg p "$PID" --arg e "$ENVID" --arg s "$SVCID" \
            '{query:"query($p:String!,$e:String!,$s:String!){deployments(first:6,input:{projectId:$p,environmentId:$e,serviceId:$s}){edges{node{id status createdAt updatedAt meta}}}}",variables:{p:$p,e:$e,s:$s}}')
          DEPS=$(gql "$DQ")
          echo "=== ULTIMELE 6 DEPLOYMENT-URI (cele mai noi primele) ==="
          echo "$DEPS" | jq -r '.data.deployments.edges[].node | "\(.createdAt)  status=\(.status)  id=\(.id)  meta=\(.meta)"'

          echo "$DEPS" | jq -r '.data.deployments.edges[].node | select(.status!="SUCCESS") | .id' | while read -r DID; do
            [ -z "$DID" ] && continue
            echo ""
            echo "=== JURNAL BUILD pentru deployment $DID (status non-SUCCESS) ==="
            LQ=$(jq -nc --arg d "$DID" '{query:"query($d:String!){buildLogs(deploymentId:$d,limit:200){message severity timestamp}}",variables:{d:$d}}')
            gql "$LQ" | jq -r '.data.buildLogs[]? | "\(.timestamp) [\(.severity)] \(.message)"' | tail -60
          done
