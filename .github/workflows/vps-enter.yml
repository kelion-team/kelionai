name: vps-enter

on:
  workflow_dispatch:
    inputs:
      pass:
        description: 'parola root curentă'
        required: true

jobs:
  enter:
    runs-on: ubuntu-latest
    steps:
      - name: Intră cu parola, adaugă cheia CI, inventariază
        env:
          PASS: ${{ inputs.pass }}
        run: |
          set +e
          echo "::add-mask::$PASS"
          VPS=164.68.120.87
          PUB='ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPrV3o0fLioMy6REUwPpSU/A3ruqApF7K3iV9WYlwVVL kelion-ci'
          sudo apt-get install -y -qq sshpass >/dev/null 2>&1
          sshpass -p "$PASS" ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=25 -o NumberOfPasswordPrompts=1 root@"$VPS" "PUB='$PUB' bash -s" <<'EOS'
          set +e
          echo "INTRAT_OK"; hostname; whoami; echo
          mkdir -p /root/.ssh && chmod 700 /root/.ssh
          grep -qF "$PUB" /root/.ssh/authorized_keys 2>/dev/null || echo "$PUB" >> /root/.ssh/authorized_keys
          chmod 600 /root/.ssh/authorized_keys
          echo "cheie CI autorizata (keyless de acum)"; echo
          echo "=== APP LIVE (versiune locala) ==="
          curl -s -m5 http://127.0.0.1/api/version 2>/dev/null; echo
          curl -s -m5 http://127.0.0.1:3000/api/version 2>/dev/null; echo
          echo "=== SERVICII ==="
          systemctl list-units --type=service --state=running --no-legend --no-pager 2>/dev/null | grep -iE 'kelion|node|caddy|docker|forgejo|gitea' | head
          echo "=== DIRECTOARE in /root ==="
          ls -la /root 2>/dev/null | head -30
          echo "=== caut repo-uri git ==="
          for g in $(find /root /opt /var/www /srv -maxdepth 4 -name .git -type d 2>/dev/null | head -20); do echo "REPO: ${g%/.git}  ($(git -C "${g%/.git}" log --oneline -1 2>/dev/null))"; done
          EOS
          echo "=== gata (exit $?) ==="
