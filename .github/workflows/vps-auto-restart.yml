# AUTO-REPORNIRE VPS LA DEPLOY — rezolvă Problema 3 (Adrian, 12 iul: „rulează
# cod vechi"). Când master schimbă codul unui worker (bridge/*.mjs), serviciile se
# reîmprospătează SINGURE: SSH → rulăm bridge/restart-sincronizat.sh din repo
# (backup, git reset --hard origin/master, copiere pe căile reale, restart,
# verificări is-active / md5 / health / dev/status). Determinist, fără LLM,
# fără intervenția lui Adrian. Decalajul „cod în master / proces viu vechi"
# dispare definitiv.
name: vps-auto-restart

on:
  push:
    branches: [master]
    paths:
      - 'bridge/kelion-builder-server.mjs'
      - 'bridge/kelion-bridge-linux.mjs'
      - 'bridge/restart-sincronizat.sh'
  workflow_dispatch: {}

jobs:
  restart:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo (pentru scriptul determinist)
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Reîmprospătează codul + reporneşte serviciile worker (SSH)
        env:
          VPS_PASS: ${{ secrets.VPS_ROOT_PASS }}
        run: |
          set -euo pipefail
          if [ -z "$VPS_PASS" ]; then
            echo "::error::Lipseşte secretul VPS_ROOT_PASS."; exit 1
          fi
          VPS_HOST=164.68.120.87
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          export SSHPASS="$VPS_PASS"
          SSHOPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=25 -o PubkeyAuthentication=no -o PreferredAuthentications=password,keyboard-interactive -o NumberOfPasswordPrompts=1"

          # Rulează scriptul din repo fără argumente = toate serviciile implicite.
          sshpass -e ssh $SSHOPTS root@"$VPS_HOST" 'bash -s' < bridge/restart-sincronizat.sh
