            import http from 'node:http'
            import { randomUUID } from 'node:crypto'
            import { readServiceSecret, signServiceRequest } from 'file:///opt/kelion-constructor/lib/service-auth.mjs'

            const [socketPath, secretPath] = process.argv.slice(2)
            const path = '/v1/model/state'
            const body = Buffer.from('{}', 'utf8')
            const timestamp = String(Math.floor(Date.now() / 1000))
            const nonce = randomUUID()
            const secret = readServiceSecret(secretPath)
            const signature = signServiceRequest(secret, timestamp, nonce, 'POST', path, body)
            const payload = await new Promise((resolve, reject) => {
              const request = http.request({
                socketPath,
                path,
                method: 'POST',
                headers: {
                  'content-length': body.length,
                  'content-type': 'application/json',
                  'x-kelion-nonce': nonce,
                  'x-kelion-signature': signature,
                  'x-kelion-timestamp': timestamp,
                },
              }, (response) => {
                const chunks = []
                let bytes = 0
                response.on('data', (chunk) => {
