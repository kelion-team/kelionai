name: one-shot-constructor-activation-gc-fix

on:
  push:
    branches:
      - fix/constructor-activation-journal-gc-20260829

permissions:
  contents: write

concurrency:
  group: one-shot-constructor-activation-gc-fix
  cancel-in-progress: false

jobs:
  patch:
    if: github.event.head_commit.message == 'retry-one-shot-constructor-gc-repair-v4'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: fix/constructor-activation-journal-gc-20260829
          persist-credentials: true

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Aplică remedierea, pinul și regresia
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          import re

          script_path = Path('deploy/lib/runtime-config-cutover.sh')
          source = script_path.read_text(encoding='utf-8')
          start = source.index('garbage_collect_activations() {')
          end = source.index('\n}\n\ngarbage_collect_gate_transactions()', start) + 2
          body = source[start:end]
          guard = '    [ -e "$candidate" ] || continue\n'
          if body.count(guard) != 1:
              raise SystemExit('contract drift: activation GC existence guard is not unique')
          journal_skip = (
              '    # Recovery-ul quiesced păstrează intenționat jurnalul canonic. Globul\n'
              '    # directorului îl include, dar el nu este un snapshot orfan.\n'
              '    [ "$candidate" = "$ACTIVATION_JOURNAL" ] && continue\n'
          )
          if '$candidate" = "$ACTIVATION_JOURNAL' in body:
              raise SystemExit('contract drift: journal skip already exists')
          patched = source[:start] + body.replace(guard, guard + journal_skip, 1) + source[end:]
          script_path.write_text(patched, encoding='utf-8')

          installer_path = Path('deploy/instaleaza-constructor.sh')
          installer = installer_path.read_text(encoding='utf-8')
          pin_pattern = r'(?m)^readonly COMPATIBLE_RUNTIME_HELPER_SHA256=[0-9a-f]{64}$'
          if len(re.findall(pin_pattern, installer)) != 1:
              raise SystemExit('contract drift: compatible runtime helper pin is not unique')
          helper_digest = sha256(patched.encode('utf-8')).hexdigest()
          installer_path.write_text(
              re.sub(pin_pattern,
                     f'readonly COMPATIBLE_RUNTIME_HELPER_SHA256={helper_digest}',
                     installer,
                     count=1),
              encoding='utf-8',
          )

          test_path = Path('deploy/lib/constructor-publication.test.mjs')
          tests = test_path.read_text(encoding='utf-8')
          title = "test('garbage collectorul activărilor păstrează jurnalul canonic', () => {"
          if title in tests:
              raise SystemExit('contract drift: regression test already exists')
          regression = r'''

          test('garbage collectorul activărilor păstrează jurnalul canonic', () => {
            const cutover = read('deploy/lib/runtime-config-cutover.sh')
            const collector = shellFunction(cutover, 'garbage_collect_activations')
            const existsGuard = '    [ -e "$candidate" ] || continue'
            const journalSkip = '    [ "$candidate" = "$ACTIVATION_JOURNAL" ] && continue'
            const directoryGuard = '&& [ -d "$candidate" ] && [ ! -L "$candidate" ]'

            assert.equal(collector.split(journalSkip).length - 1, 1,
              'excluderea jurnalului trebuie să fie exactă și unică')
            assert.ok(collector.indexOf(existsGuard) < collector.indexOf(journalSkip),
              'candidatul trebuie să existe înainte de comparație')
            assert.ok(collector.indexOf(journalSkip) < collector.indexOf(directoryGuard),
              'jurnalul trebuie exclus înainte de testul de director')
            assert.match(collector, /remove_activation_dir "\$canonical" \|\| return 1/,
              'snapshoturile reale trebuie curățate în continuare')
          })
          '''
          test_path.write_text(tests.rstrip() + regression, encoding='utf-8')
          PY

          cat > docs/operations/CURRENT.md <<'CURRENT'
          # Checkpoint operațional curent

          Actualizat: `2026-08-29T19:49:00Z`

          ## Stare verificată

          - Repo: `kelion-team/kelionai`; singura țintă de producție este `master`.
            Vârful remote și release-ul activ sunt
            `ff6d2e30991b4f35adaf68f4b3a88ada8504d350`.
          - Diagnoza VPS a confirmat containerele slotului verde sănătoase și
            răspuns `200` pentru `/livez`, `/readyz` și `/api/version`. Interfața
            publică rămâne disponibilă.
          - Remedierea ACL pentru Codex CLI este inclusă în release-ul curent, dar
            activarea Constructorului nu ajunge încă la proba CLI.
          - `vps-constructor-control` run `33254987691`, inclusiv relansarea
            controlată, și recovery-ul generic run `33255194656` se opresc
            fail-closed cu mesajul că snapshoturile de activare orfane nu pot fi
            curățate sigur.
          - Cauza este deterministă în `runtime-config-cutover.sh`:
            `garbage_collect_activations` iterează globul `constructor-activation.*`,
            care include și fișierul legitim `constructor-activation.journal`.
            Recovery-ul quiesced păstrează intenționat jurnalul, apoi garbage
            collectorul îl respinge fiindcă nu este director.
          - Toate cele trei timere Constructor sunt inactive, iar stamp-ul de
            execuție este retras. Constructorul rămâne fail-closed fără să oprească
            release-ul web activ.
          - Cheia OpenAI API de producție rămâne revocată; chatul și vocea online
            nu sunt declarate funcționale până la configurarea explicită a unei
            chei valide sau a modului suportat „API dezactivat”.
          - Remedierea este pregătită pe ramura
            `fix/constructor-activation-journal-gc-20260829`: exclude numai calea
            exactă a jurnalului înainte de validarea directoarelor, păstrează
            refuzul pentru orice alt nod neașteptat, actualizează pinul SHA-256 al
            helperului compatibil și adaugă regresia în suita Constructor deja
            obligatorie în CI.

          ## Următorul pas sigur

          1. Deschide PR-ul unic pentru remedierea garbage collectorului și lasă
             `verify` plus `container-isolation` să treacă integral.
          2. Îmbină prin rebase numai pe verde și confirmă deploy-ul noului `master`.
          3. Rulează recovery-ul Constructor, apoi `activate-worker-publisher`;
             acceptă rezultatul numai după proba `codex --version` ca
             `kelion-codex` și starea activă a celor două timere.
          4. Rulează ceremonia oficială `VPS Codex Login Bridge`, verifică
             `codex login status`, apoi activează și probează release-ul Constructor.
          5. Separat, repară modul explicit „OpenAI API dezactivat” sau rotește o
             cheie validă înainte de a relua testarea chatului și vocii online.

          ## Legături canonice

          - Workflow control Constructor: <https://github.com/kelion-team/kelionai/actions/workflows/vps-run.yml>
          - Activare/retry eșuat: <https://github.com/kelion-team/kelionai/actions/runs/33254987691>
          - Recovery eșuat: <https://github.com/kelion-team/kelionai/actions/runs/33255194656>
          - Versiune live: <https://kelionai.app/api/release-proof>
          CURRENT

          bash -n deploy/lib/runtime-config-cutover.sh
          bash -n deploy/instaleaza-constructor.sh
          node --test \
            --test-name-pattern='garbage collectorul activărilor păstrează jurnalul canonic|bootstrapul recovery acceptă numai helperul b911' \
            deploy/lib/constructor-publication.test.mjs
          node scripts/verifica-sintaxa.mjs
          node scripts/verifica-contract-deploy.mjs
          git diff --check

      - name: Publică numai fișierele de produs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deploy/lib/runtime-config-cutover.sh \
            deploy/instaleaza-constructor.sh \
            deploy/lib/constructor-publication.test.mjs \
            docs/operations/CURRENT.md
          git diff --cached --check
          git commit -m 'fix(constructor): preserve activation journal during GC'
          git push origin HEAD:fix/constructor-activation-journal-gc-20260829
