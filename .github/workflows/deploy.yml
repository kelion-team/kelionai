# Deploy pe producție (Railway) — COMPLET AUTOMAT, fără VPS, fără terminal,
# fără ca Adrian să copieze vreun ID.
#
# Cum funcționează (auto-configurare totală):
#   1. Cu RAILWAY_TOKEN (secretul din GitHub) întreabă API-ul Railway ce
#      proiecte există. Găsește SINGUR proiectul de producție (numele conține
#      „kelion") + mediul „production" + serviciul (preferă „web").
#   2. SIGURANȚĂ „un singur proiect": dacă găsește mai multe proiecte kelion și
#      nu poate alege fără dubiu, SE OPREȘTE și listează ce a găsit — nu publică
#      niciodată într-o țintă ghicită. Nu creează și nu șterge NIMIC, niciodată.
#   3. Publică (railway up = build din Dockerfile, identic cu VPS-ul) și apoi
#      verifică EL că kelionai.app răspunde 200 — abia atunci declară succes.
#
# Merge și cu un token de PROIECT (dacă secretul e înlocuit vreodată): atunci
# sare peste căutare și publică direct, tokenul fiind deja legat de proiect.
#
# Secret necesar (o singură dată): RAILWAY_TOKEN — deja pus.

name: deploy

on:
  # Pornit din comandă (Run workflow / API) — „deploy la comanda creierului".
  workflow_dispatch:
  # Automat când o reparație intră în master.
  push:
    branches: [master]

# O singură publicare odată — un deploy nou îl anulează pe cel în curs.
concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalează Railway CLI
        run: npm i -g @railway/cli

      # AMPRENTA DE DINAINTE (10 iul): salvăm ce versiune rulează ACUM, ca după
      # publicare să dovedim că s-a SCHIMBAT. „/health = 200" nu dovedea nimic —
      # venea de la containerul vechi când deploy-ul nou nu-l înlocuia.
      - name: Amprenta versiunii de dinainte
        id: before
        run: |
          V=$(curl -s --max-time 8 https://kelionai.app/api/version || echo '{}')
          echo "Versiune înainte: $V"
          echo "ver=$V" >> "$GITHUB_OUTPUT"

      - name: Găsește singur ținta de producție (proiect + mediu + serviciu)
        id: target
        env:
          TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$TOKEN" ]; then
            echo "::error::RAILWAY_TOKEN lipsește din Settings → Secrets → Actions."
            exit 1
          fi
          # Întreabă API-ul Railway (GraphQL) ce proiecte vede cheia asta.
          Q='{"query":"query{projects{edges{node{id name environments{edges{node{id name}}} services{edges{node{id name}}}}}}}"}'
          RESP=$(curl -sS --max-time 30 https://backboard.railway.com/graphql/v2 \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            -d "$Q" || echo '{}')
          if ! echo "$RESP" | jq -e '.data.projects.edges' >/dev/null 2>&1; then
            # Cheie de PROIECT (nu are voie să listeze proiecte) → e deja legată
            # de proiectul ei; publicăm direct, fără căutare.
            echo "mode=project-token" >> "$GITHUB_OUTPUT"
            echo "Cheia e token de proiect — deja țintită, public direct."
            exit 0
          fi
          echo "Proiecte văzute de cheie:"
          echo "$RESP" | jq -r '.data.projects.edges[].node.name'
          # Alege proiectul de producție: numele conține „kelion" (insensibil).
          MATCHES=$(echo "$RESP" | jq '[.data.projects.edges[].node | select(.name | test("kelion";"i"))]')
          COUNT=$(echo "$MATCHES" | jq 'length')
          TOTAL=$(echo "$RESP" | jq '.data.projects.edges | length')
          if [ "$COUNT" -eq 0 ] && [ "$TOTAL" -eq 1 ]; then
            # Un singur proiect în tot contul → el e, oricum s-ar numi.
            MATCHES=$(echo "$RESP" | jq '[.data.projects.edges[].node]')
            COUNT=1
          fi
          if [ "$COUNT" -ne 1 ]; then
            echo "::error::Nu pot alege FĂRĂ DUBIU proiectul (găsite: $COUNT potriviri din $TOTAL proiecte). NU public într-o țintă ghicită. Proiectele văzute sunt listate mai sus — spune-i creierului care e cel bun."
            exit 1
          fi
          P=$(echo "$MATCHES" | jq '.[0]')
          PID=$(echo "$P" | jq -r '.id')
          PNAME=$(echo "$P" | jq -r '.name')
          ENVID=$(echo "$P" | jq -r '[.environments.edges[].node | select(.name=="production")][0].id // empty')
          ENVNAME="production"
          if [ -z "$ENVID" ]; then
            ENVNAME=$(echo "$P" | jq -r '.environments.edges[0].node.name')
            ENVID=$(echo "$P" | jq -r '.environments.edges[0].node.id')
          fi
          SVC=$(echo "$P" | jq -r '[.services.edges[].node | select(.name=="web")][0].name // empty')
          NSVC=$(echo "$P" | jq -r '.services.edges | length')
          if [ -z "$SVC" ]; then
            if [ "$NSVC" -eq 1 ]; then
              SVC=$(echo "$P" | jq -r '.services.edges[0].node.name')
            else
              LIST=$(echo "$P" | jq -r '[.services.edges[].node.name] | join(", ")')
              # Fara ghilimele romanesti in stringuri bash: un " ASCII ratacit
              # dupa „ inchidea stringul devreme -> syntax error near '(' (run #2).
              echo "::error::Serviciul 'web' nu exista si sunt $NSVC servicii in '$PNAME' - nu ghicesc. Servicii: $LIST"
              exit 1
            fi
          fi
          echo "TINTA ALEASA: proiect '$PNAME' ($PID), mediu '$ENVNAME', serviciu '$SVC'"
          {
            echo "mode=account-token"
            echo "project_id=$PID"
            echo "env_id=$ENVID"
            echo "env_name=$ENVNAME"
            echo "service=$SVC"
          } >> "$GITHUB_OUTPUT"

      - name: Publică pe Railway
        id: publish
        env:
          TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          MODE: ${{ steps.target.outputs.mode }}
          PROJECT_ID: ${{ steps.target.outputs.project_id }}
          ENV_ID: ${{ steps.target.outputs.env_id }}
          SERVICE: ${{ steps.target.outputs.service }}
        run: |
          set -euo pipefail
          if [ "$MODE" = "project-token" ]; then
            # Token de proiect: CLI-ul îl ia din RAILWAY_TOKEN și e deja legat.
            export RAILWAY_TOKEN="$TOKEN"
            railway up --service "${RAILWAY_SERVICE:-web}" --ci
            exit 0
          fi
          # Token de cont/workspace: CLI-ul refuza 'railway link' cu el (run #3:
          # Unauthorized). Solutia stabila: cu cheia de cont FABRICAM prin API un
          # token de PROIECT efemer, legat strict de Kelionai/production — tipul
          # care merge garantat cu 'railway up' — si il stergem la final.
          GQL=https://backboard.railway.com/graphql/v2
          TNAME="gh-deploy-${GITHUB_RUN_ID}"
          MUT=$(jq -nc --arg n "$TNAME" --arg p "$PROJECT_ID" --arg e "$ENV_ID" \
            '{query:"mutation($n:String!,$p:String!,$e:String!){projectTokenCreate(input:{name:$n,projectId:$p,environmentId:$e})}",variables:{n:$n,p:$p,e:$e}}')
          PT=$(curl -sS --max-time 30 "$GQL" -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" -d "$MUT" | jq -r '.data.projectTokenCreate // empty')
          if [ -z "$PT" ]; then
            echo "::error::Nu am putut fabrica tokenul de proiect prin API (projectTokenCreate a refuzat). Verifica permisiunile cheii din RAILWAY_TOKEN."
            exit 1
          fi
          echo "::add-mask::$PT"
          # Curatenie garantata: tokenul efemer se sterge si la succes, si la esec.
          cleanup() {
            DELQ=$(jq -nc --arg p "$PROJECT_ID" \
              '{query:"query($p:String!){projectTokens(projectId:$p){edges{node{id name}}}}",variables:{p:$p}}')
            TID=$(curl -sS --max-time 30 "$GQL" -H "Authorization: Bearer $TOKEN" \
              -H "Content-Type: application/json" -d "$DELQ" \
              | jq -r --arg n "$TNAME" '.data.projectTokens.edges[]?.node | select(.name==$n) | .id' | head -1)
            if [ -n "$TID" ]; then
              DELM=$(jq -nc --arg i "$TID" \
                '{query:"mutation($i:String!){projectTokenDelete(id:$i)}",variables:{i:$i}}')
              curl -sS --max-time 30 "$GQL" -H "Authorization: Bearer $TOKEN" \
                -H "Content-Type: application/json" -d "$DELM" >/dev/null || true
              echo "Token efemer sters."
            fi
          }
          trap cleanup EXIT
          export RAILWAY_TOKEN="$PT"
          unset RAILWAY_API_TOKEN || true
          railway up --service "$SERVICE" --ci

      - name: Verifică REAL că noul build a preluat (versiunea s-a schimbat)
        id: verify
        env:
          BEFORE: ${{ steps.before.outputs.ver }}
        run: |
          # „Trimis ≠ gata" ȘI „200 ≠ nou". /api/version raportează momentul
          # pornirii containerului (se schimbă la ORICE publicare reală). Așteptăm
          # până când versiunea DIFERĂ de cea de dinainte — dovada că build-ul nou
          # a preluat traficul, nu containerul vechi care oricum dădea /health 200.
          echo "Versiune înainte: $BEFORE"
          ok=""
          for i in $(seq 1 48); do
            NOW=$(curl -s --max-time 8 https://kelionai.app/api/version || echo '{}')
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 8 https://kelionai.app/health || echo 000)
            echo "încercarea $i → HTTP $code   version=$NOW"
            if [ "$code" = "200" ] && [ -n "$NOW" ] && [ "$NOW" != "$BEFORE" ] && [ "$NOW" != "{}" ]; then
              ok="1"; break
            fi
            sleep 5
          done
          if [ -z "$ok" ]; then
            echo "::error::Deploy trimis, DAR versiunea live nu s-a schimbat după ~4 min — producția a rămas pe build vechi (containerul nou nu a preluat)."
            exit 1
          fi
          echo "🟢 PUBLICAT + VERIFICAT LIVE — versiunea s-a schimbat, noul build a preluat."

      # ALERTĂ INSTANT (Adrian, 10 iul: „kelion trebuie să primească instant err
      # de la railway" — nu tu să-mi arăți poze din dashboard). Rulează la ORICE
      # eșec al pipeline-ului de mai sus (țintă negăsită, build picat, sau
      # kelionai.app nu răspunde) — auto-conținut, nu depinde de pașii de dinainte
      # (ei pot fi cei care au picat). Kelion îi spune lui Adrian pe loc, în chat.
      - name: Alertă Kelion la eșec (instant, în chatul lui Adrian)
        if: failure()
        env:
          TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set -uo pipefail
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          FAILED_STEP="${{ steps.target.outcome == 'failure' && 'găsire țintă' || steps.publish.outcome == 'failure' && 'publicare pe Railway' || steps.verify.outcome == 'failure' && 'verificare live (kelionai.app nu răspunde 200)' || 'necunoscută' }}"
          GQL=https://backboard.railway.com/graphql/v2
          gql() { curl -sS --max-time 20 "$GQL" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -d "$1" 2>/dev/null || echo '{}'; }
          # Rezoluție auto-conținută (nu depinde de pașii de mai sus — ei pot fi
          # exact cei picați): găsește proiectul/mediul/serviciul din nou.
          RESP=$(gql '{"query":"query{projects{edges{node{id name environments{edges{node{id name}}} services{edges{node{id name}}}}}}}"}')
          P=$(echo "$RESP" | jq '[.data.projects.edges[].node | select(.name | test("kelion";"i"))][0] // .data.projects.edges[0].node // empty')
          PID=$(echo "$P" | jq -r '.id // empty')
          ENVID=$(echo "$P" | jq -r '[.environments.edges[].node | select(.name=="production")][0].id // .environments.edges[0].node.id // empty')
          SVCID=$(echo "$P" | jq -r '[.services.edges[].node | select(.name=="web")][0].id // .services.edges[0].node.id // empty')
          BSECRET=""
          if [ -n "$PID" ] && [ -n "$ENVID" ] && [ -n "$SVCID" ]; then
            VQ=$(jq -nc --arg p "$PID" --arg e "$ENVID" --arg s "$SVCID" \
              '{query:"query($p:String!,$e:String!,$s:String!){variables(projectId:$p,environmentId:$e,serviceId:$s)}",variables:{p:$p,e:$e,s:$s}}')
            BSECRET=$(gql "$VQ" | jq -r '.data.variables.BRIDGE_SECRET // empty')
          fi
          if [ -z "$BSECRET" ]; then
            echo "::warning::Nu am putut obține BRIDGE_SECRET — nu pot alerta chatul lui Adrian. Vezi jurnalul: $RUN_URL"
            exit 0
          fi
          curl -sS --max-time 15 -X POST "https://kelionai.app/api/bridge/deploy-alert" \
            -H "x-bridge-secret: $BSECRET" -H "Content-Type: application/json" \
            -d "$(jq -nc --arg stage "$FAILED_STEP" --arg url "$RUN_URL" '{stage:$stage,runUrl:$url}')" \
            >/dev/null || echo "::warning::Alerta n-a ajuns la server."
          echo "Alertă trimisă spre chatul lui Adrian (etapă: $FAILED_STEP)."
