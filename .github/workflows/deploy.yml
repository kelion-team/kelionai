name: production-release
run-name: production-${{ inputs.release_request_id }}-${{ inputs.commit_sha }}-${{ inputs.ci_run_id }}-${{ inputs.build_run_id }}

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Commit integral din master, cu CI și imagini semnate
        required: true
        type: string
      auto_routed_to_master:
        description: Setare internă; rulează doar dacă workflow-ul a fost redirecționat automat pe master
        required: false
        default: false
        type: boolean
      release_mode:
        description: Release curent sau rollback la un artefact încă disponibil
        required: true
        default: release
        type: choice
        options: [release, rollback]
      release_request_id:
        description: UUID idempotent al cererii de release
        required: true
        type: string
      ci_run_id:
        description: Runul push CI canonic; gol numai pentru dispatcherul v1 din rollout
        required: false
        default: ''
        type: string
      build_run_id:
        description: Buildul legat de ci_run_id; gol numai pentru dispatcherul v1 din rollout
        required: false
        default: ''
        type: string

permissions: {}

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  route-to-master:
    if: github.event_name == 'workflow_dispatch' && github.ref_name != 'master' && inputs.auto_routed_to_master != true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Redirecționează automat pe master
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ inputs.commit_sha }}
          RELEASE_MODE: ${{ inputs.release_mode }}
          RELEASE_REQUEST_ID: ${{ inputs.release_request_id }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
        run: |
          set -euo pipefail
          gh workflow run "deploy.yml" \
            --repo "${GITHUB_REPOSITORY}" \
            --ref master \
            -f commit_sha="$COMMIT_SHA" \
            -f auto_routed_to_master=true \
            -f release_mode="$RELEASE_MODE" \
            -f release_request_id="$RELEASE_REQUEST_ID" \
            -f ci_run_id="$CI_RUN_ID" \
            -f build_run_id="$BUILD_RUN_ID"
  idempotency:
    if: github.ref == 'refs/heads/master' && github.ref_name == 'master'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      execute: ${{ steps.guard.outputs.execute }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Alege runul canonic pentru requestul persistent
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REQUEST_ID: ${{ inputs.release_request_id }}
          RELEASE_MODE: ${{ inputs.release_mode }}
          CANDIDATE_SHA: ${{ inputs.commit_sha }}
          CANONICAL_WORKFLOW_SHA: ${{ github.sha }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_REQUEST_ID" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$ ]]
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          if [ -n "$CI_RUN_ID" ] || [ -n "$BUILD_RUN_ID" ]; then
            [[ "$CI_RUN_ID" =~ ^[1-9][0-9]*$ ]]
            [[ "$BUILD_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          fi
          [[ "$GITHUB_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$CANONICAL_WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]
          title="production-$RELEASE_REQUEST_ID-$CANDIDATE_SHA-$CI_RUN_ID-$BUILD_RUN_ID"
          work=$(mktemp -d)
          cleanup() { rm -rf -- "$work"; }
          trap cleanup EXIT
          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/deploy.yml/runs?event=workflow_dispatch&per_page=100" \
            > "$work/deploy-runs-pages.json"
          canonical=$(node scripts/release-dispatch-owner.mjs canonical-production-run \
            "$work/deploy-runs-pages.json" "$title" "$CANONICAL_WORKFLOW_SHA" "$GITHUB_RUN_ID")
          [[ "$canonical" =~ ^[1-9][0-9]*$ ]]
          [[ "$RELEASE_MODE" = release || "$RELEASE_MODE" = rollback ]]
          # Un request nou (alt UUID) pentru aceeași tuplă commit+CI+build deja
          # publicată cu succes este un dispatch duplicat: candidatul ar boota cu
          # markerul activ egal cu propriul RELEASE_ID și s-ar declara activ, iar
          # rollback-ul ar lăsa Constructor quiesced. Nu atingem VPS-ul.
          released=0
          if [ "$RELEASE_MODE" = release ] && [ -n "$CI_RUN_ID" ] && [ -n "$BUILD_RUN_ID" ]; then
            released=$(node scripts/release-dispatch-owner.mjs released-production-run \
              "$work/deploy-runs-pages.json" "$CANDIDATE_SHA" "$CI_RUN_ID" "$BUILD_RUN_ID" "$GITHUB_RUN_ID")
            [[ "$released" =~ ^[0-9]+$ ]]
          fi
          if [ "$released" != 0 ]; then
            echo 'execute=false' >> "$GITHUB_OUTPUT"
            echo "::notice::Commitul $CANDIDATE_SHA a fost deja publicat de runul $released; requestul $RELEASE_REQUEST_ID este un duplicat și nu atinge producția."
          elif [ "$canonical" = "$GITHUB_RUN_ID" ]; then
            echo 'execute=true' >> "$GITHUB_OUTPUT"
          else
            echo 'execute=false' >> "$GITHUB_OUTPUT"
            echo "::notice::Run duplicat pentru același request; runul canonic este $canonical."
          fi

  verify-candidate:
    if: needs.idempotency.outputs.execute == 'true' && github.ref == 'refs/heads/master' && github.ref_name == 'master'
    needs: idempotency
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      ci_run_id: ${{ steps.proof.outputs.ci_run_id }}
      build_run_id: ${{ steps.proof.outputs.build_run_id }}
      commit_sha: ${{ steps.proof.outputs.commit_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verifică dovada CI și build pe commitul imuabil
        id: proof
        env:
          CANDIDATE_SHA: ${{ inputs.commit_sha }}
          RELEASE_MODE: ${{ inputs.release_mode }}
          RELEASE_REQUEST_ID: ${{ inputs.release_request_id }}
          EXPECTED_CI_RUN_ID: ${{ inputs.ci_run_id }}
          EXPECTED_BUILD_RUN_ID: ${{ inputs.build_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RELEASE_MODE" = release || "$RELEASE_MODE" = rollback ]]
          [[ "$RELEASE_REQUEST_ID" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$ ]]
          git cat-file -e "${CANDIDATE_SHA}^{commit}"
          git merge-base --is-ancestor "$CANDIDATE_SHA" origin/master
          if [ "$RELEASE_MODE" = release ]; then
            [ "$CANDIDATE_SHA" = "$(git rev-parse origin/master)" ]
          fi

          if [ -z "$EXPECTED_CI_RUN_ID" ] && [ -z "$EXPECTED_BUILD_RUN_ID" ]; then
            # Compatibilitate strictă pentru singurul rollout condus de
            # dispatcherul v1. Identitățile sunt reconstruite din aceeași
            # pereche commit -> push CI -> build cu titlu determinist.
            for page in $(seq 1 100); do
              ci_page=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/pr-verify.yml/runs?head_sha=${CANDIDATE_SHA}&event=push&status=completed&per_page=100&page=$page")
              ci_count=$(jq -er '.workflow_runs | length' <<<"$ci_page")
              while IFS= read -r candidate_run; do
                [[ "$candidate_run" =~ ^[1-9][0-9]*$ ]]
                jobs=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${candidate_run}/jobs?filter=latest&per_page=100")
                if jq -e '[.jobs[] | select((.name == "verify" or .name == "container-isolation") and .conclusion == "success") | .name] | unique | sort == ["container-isolation", "verify"]' <<<"$jobs" >/dev/null; then
                  EXPECTED_CI_RUN_ID=$candidate_run
                  break
                fi
              done < <(jq -r --arg sha "$CANDIDATE_SHA" '.workflow_runs[] | select(.head_sha == $sha and .event == "push" and .conclusion == "success") | .id' <<<"$ci_page")
              [ -z "$EXPECTED_CI_RUN_ID" ] || break
              if [ "$ci_count" -lt 100 ]; then break; fi
              [ "$page" -lt 100 ] || { echo '::error::Căutarea CI v1 nu a fost exhaustivă.'; exit 1; }
            done
            [[ "$EXPECTED_CI_RUN_ID" =~ ^[1-9][0-9]*$ ]]
            expected_title="build-release-${EXPECTED_CI_RUN_ID}-${CANDIDATE_SHA}"
            for page in $(seq 1 100); do
              build_page=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/build-images.yml/runs?event=workflow_run&status=completed&per_page=100&page=$page")
              build_count=$(jq -er '.workflow_runs | length' <<<"$build_page")
              EXPECTED_BUILD_RUN_ID=$(jq -r --arg title "$expected_title" '[.workflow_runs[] | select((.head_sha | type) == "string" and (.head_sha | test("^[0-9a-f]{40}$")) and .event == "workflow_run" and .conclusion == "success" and (.path == ".github/workflows/build-images.yml" or (.path | startswith(".github/workflows/build-images.yml@"))) and .display_title == $title)][0].id // empty' <<<"$build_page")
              [ -z "$EXPECTED_BUILD_RUN_ID" ] || break
              if [ "$build_count" -lt 100 ]; then break; fi
              [ "$page" -lt 100 ] || { echo '::error::Căutarea buildului v1 nu a fost exhaustivă.'; exit 1; }
            done
          elif [ -z "$EXPECTED_CI_RUN_ID" ] || [ -z "$EXPECTED_BUILD_RUN_ID" ]; then
            echo '::error::Checkpointul CI/build primit este parțial.'
            exit 1
          fi
          [[ "$EXPECTED_CI_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$EXPECTED_BUILD_RUN_ID" =~ ^[1-9][0-9]*$ ]]

          ci_run=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${EXPECTED_CI_RUN_ID}")
          jq -e --arg sha "$CANDIDATE_SHA" '
            .head_sha == $sha and .event == "push" and .conclusion == "success"
            and (.path == ".github/workflows/pr-verify.yml" or (.path | startswith(".github/workflows/pr-verify.yml@")))
          ' <<<"$ci_run" >/dev/null
          ci_run_id=$EXPECTED_CI_RUN_ID

          build_run=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${EXPECTED_BUILD_RUN_ID}")
          jq -e --arg title "build-release-${EXPECTED_CI_RUN_ID}-${CANDIDATE_SHA}" '
            (.head_sha | type) == "string" and (.head_sha | test("^[0-9a-f]{40}$"))
            and .event == "workflow_run" and .conclusion == "success"
            and (.path == ".github/workflows/build-images.yml" or (.path | startswith(".github/workflows/build-images.yml@")))
            and .display_title == $title
          ' <<<"$build_run" >/dev/null
          build_run_id=$EXPECTED_BUILD_RUN_ID
          printf 'ci_run_id=%s\nbuild_run_id=%s\ncommit_sha=%s\n' "$ci_run_id" "$build_run_id" "$CANDIDATE_SHA" >> "$GITHUB_OUTPUT"

  release:
    if: github.ref == 'refs/heads/master' && github.ref_name == 'master'
    needs: verify-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: production
    permissions:
      contents: read
      actions: read
      packages: read
    env:
      CANDIDATE_SHA: ${{ needs.verify-candidate.outputs.commit_sha }}
      CI_RUN_ID: ${{ needs.verify-candidate.outputs.ci_run_id }}
      BUILD_RUN_ID: ${{ needs.verify-candidate.outputs.build_run_id }}
      RELEASE_MODE: ${{ inputs.release_mode }}
      RELEASE_REQUEST_ID: ${{ inputs.release_request_id }}
      VPS_HOST: ${{ vars.VPS_HOST }}
      VPS_USER: ${{ vars.VPS_USER }}
      VPS_HOST_KEY: ${{ vars.VPS_HOST_KEY }}
      SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      REGISTRY_TOKEN: ${{ github.token }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.verify-candidate.outputs.commit_sha }}
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-images-${{ needs.verify-candidate.outputs.commit_sha }}
          path: release-manifest
          github-token: ${{ github.token }}
          run-id: ${{ needs.verify-candidate.outputs.build_run_id }}

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Verifică manifestul și semnăturile keyless
        run: |
          set -euo pipefail
          [ -n "$REGISTRY_TOKEN" ]
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          cleanup_registry() { docker logout ghcr.io >/dev/null 2>&1 || true; }
          trap cleanup_registry EXIT
          manifest=release-manifest/images.json
          jq -e --arg sha "$CANDIDATE_SHA" --argjson source "$CI_RUN_ID" \
            '.schema == 1 and .commit == $sha and .sourceRunId == $source and (.images | length == 5)' "$manifest" >/dev/null
          identity="^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/build-images\\.yml@refs/heads/master$"
          registry_repo=${GITHUB_REPOSITORY,,}
          for component in app browser browser-egress converter-gateway converter-parser; do
            ref=$(jq -er --arg component "$component" '.images[$component]' "$manifest")
            prefix="ghcr.io/$registry_repo/$component@sha256:"
            case "$ref" in "$prefix"*) ;; *) exit 1 ;; esac
            digest=${ref#"$prefix"}
            [[ "$digest" =~ ^[0-9a-f]{64}$ ]]
            cosign verify \
              --certificate-identity-regexp "$identity" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              --annotations "git_sha=$CANDIDATE_SHA" \
              "$ref" >/dev/null
          done

          gate_manifest=release-manifest/codex-gates.json
          jq -e --arg sha "$CANDIDATE_SHA" --argjson source "$CI_RUN_ID" '
            type == "object"
            and .schema == 1
            and .commit == $sha
            and .sourceRunId == $source
            and (.image | type == "string")
          ' "$gate_manifest" >/dev/null
          gate_ref=$(jq -er '.image' "$gate_manifest")
          gate_prefix="ghcr.io/$registry_repo/codex-gates@sha256:"
          case "$gate_ref" in "$gate_prefix"*) ;; *) exit 1 ;; esac
          gate_digest=${gate_ref#"$gate_prefix"}
          [[ "$gate_digest" =~ ^[0-9a-f]{64}$ ]]
          cosign verify \
            --certificate-identity-regexp "$identity" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --annotations "git_sha=$CANDIDATE_SHA" \
            "$gate_ref" >/dev/null

      - name: Release blue-green pe VPS
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CI_RUN_ID" =~ ^[0-9]+$ ]] && [[ "$BUILD_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$RELEASE_MODE" = release || "$RELEASE_MODE" = rollback ]]
          [[ "$RELEASE_REQUEST_ID" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$ ]]
          [[ "$GITHUB_ACTOR" =~ ^[A-Za-z0-9-]+(\[bot\])?$ ]]
          [ -n "$VPS_HOST" ] && [ -n "$VPS_USER" ] && [ -n "$VPS_HOST_KEY" ] && [ -n "$SSH_KEY" ] && [ -n "$REGISTRY_TOKEN" ]

          umask 077
          key_file=$(mktemp)
          known_hosts=$(mktemp)
          archive=$(mktemp --suffix=.tar.gz)
          remote_archive="/root/kelion/runtime/release-bundle.${GITHUB_RUN_ID}.tar.gz"
          cleanup() {
            ssh -i "$key_file" -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known_hosts" \
              -o HostKeyAlgorithms=ssh-ed25519 -o BatchMode=yes "$VPS_USER@$VPS_HOST" \
              'docker logout ghcr.io >/dev/null 2>&1 || true' >/dev/null 2>&1 || true
            rm -f -- "$key_file" "$known_hosts" "$archive"
          }
          trap cleanup EXIT
          printf '%s\n' "$SSH_KEY" > "$key_file"
          printf '%s\n' "$VPS_HOST_KEY" > "$known_hosts"
          chmod 0600 "$key_file" "$known_hosts"
          ssh_opts=(-i "$key_file" -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known_hosts" -o HostKeyAlgorithms=ssh-ed25519 -o BatchMode=yes -o ConnectTimeout=25 -o ServerAliveInterval=30 -o ServerAliveCountMax=10)

          SOURCE_DATE_EPOCH=$(git show -s --format=%ct "$CANDIDATE_SHA")
          tar --sort=name --mtime="@$SOURCE_DATE_EPOCH" --owner=0 --group=0 --numeric-owner \
            -czf "$archive" deploy config/product.json release-manifest/images.json release-manifest/codex-gates.json
          # Environment approval may wait after verify-candidate.  Re-read the
          # protected ref immediately before the first VPS side effect so an
          # ancestor cannot be deployed as a normal forward release.
          current_master=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/master" --jq '.object.sha')
          [[ "$current_master" =~ ^[0-9a-f]{40}$ ]]
          if [ "$RELEASE_MODE" = release ] && [ "$CANDIDATE_SHA" != "$current_master" ]; then
            echo "::error::Master a avansat în timpul aprobării production; release-ul vechi este retras."
            exit 1
          fi
          # Provisioning owns this directory. Recreating it during login used
          # to replace the Constructor runtime group/mode and break upgrades.
          ssh "${ssh_opts[@]}" "$VPS_USER@$VPS_HOST" bash -s <<'RUNTIME_PREFLIGHT'
          set -euo pipefail
          runtime_root=/root/kelion/runtime
          [ -d "$runtime_root" ] && [ ! -L "$runtime_root" ]
          [ "$(realpath -e -- "$runtime_root")" = "$runtime_root" ]
          [ "$(stat -c '%u:%g:%a' -- "$runtime_root")" = 0:10050:750 ] \
            || { echo 'runtime directory violates the canonical ownership/mode contract' >&2; exit 1; }
          # The pinned Constructor recovery must finish against its live SHA
          # before a different application release may touch the VPS.
          [ ! -e "$runtime_root/constructor-upgrade.journal" ] && [ ! -L "$runtime_root/constructor-upgrade.journal" ] \
            || { echo 'finish the pinned Constructor upgrade recovery before application deployment' >&2; exit 1; }
          RUNTIME_PREFLIGHT
          printf '%s' "$REGISTRY_TOKEN" | ssh "${ssh_opts[@]}" "$VPS_USER@$VPS_HOST" \
            "docker login ghcr.io --username '$GITHUB_ACTOR' --password-stdin" >/dev/null
          scp "${ssh_opts[@]}" "$archive" "$VPS_USER@$VPS_HOST:$remote_archive"
          ssh "${ssh_opts[@]}" "$VPS_USER@$VPS_HOST" bash -s -- \
            "$CANDIDATE_SHA" "$CI_RUN_ID" "$BUILD_RUN_ID" "$RELEASE_MODE" "$RELEASE_REQUEST_ID" "$GITHUB_RUN_ID" "$remote_archive" <<'REMOTE'
          set -euo pipefail
          sha=$1; ci_run=$2; build_run=$3; release_mode=$4; release_request_id=$5; release_workflow_run_id=$6; archive=$7
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$ci_run" =~ ^[0-9]+$ ]] && [[ "$build_run" =~ ^[0-9]+$ ]]
          [[ "$release_mode" = release || "$release_mode" = rollback ]]
          [[ "$release_request_id" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$ ]]
          [[ "$release_workflow_run_id" =~ ^[1-9][0-9]*$ ]]
          case "$archive" in /root/kelion/runtime/release-bundle.[0-9]*.tar.gz) ;; *) exit 1 ;; esac
          [ -f "$archive" ] && [ ! -L "$archive" ]
          work=$(mktemp -d /root/kelion/runtime/release.XXXXXX)
          cleanup_remote() {
            rm -f -- "$archive"
            case "$work" in /root/kelion/runtime/release.[A-Za-z0-9]*) rm -rf -- "$work" ;; esac
          }
          trap cleanup_remote EXIT
          if tar -tzf "$archive" | grep -Eq '(^/|(^|/)\.\.(/|$))'; then exit 1; fi
          tar --extract --gzip --file "$archive" --directory "$work" --no-same-owner --no-same-permissions
          KELION_RELEASE_APPROVED=1 KELION_RELEASE_REQUEST_ID="$release_request_id" \
            KELION_RELEASE_WORKFLOW_RUN_ID="$release_workflow_run_id" \
            KELION_CI_RUN_ID="$ci_run" KELION_BUILD_RUN_ID="$build_run" \
            bash "$work/deploy/deploy.sh" "$sha" "$work/release-manifest/images.json" "$release_mode"
          REMOTE

      - name: Dovadă externă exactă
        run: |
          set -euo pipefail
          origin=$(jq -er '.publicAppOrigin' config/product.json)
          proof=$(curl --fail --silent --show-error --max-time 12 "$origin/api/release-proof")
          jq -e --arg expected "$CANDIDATE_SHA" '
            .ready == true and .release.sideEffectsActive == true and .activeCommit == $expected
          ' <<<"$proof" >/dev/null
