name: one-shot-diagnose-opencode-e2e

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  guard-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/heads/master
          fetch-depth: 0
          persist-credentials: false

      - name: Validează sursa canonică fără secrete
        shell: bash
        run: |
          set -Eeuo pipefail
          [ "$GITHUB_REPOSITORY" = kelion-team/kelionai ] # hardcod-permis: identitatea tehnică imuabilă a repository-ului canonic
          [ "$GITHUB_REF" = refs/heads/master ]
          [ "$GITHUB_REF_NAME" = master ]
          [ "$(git rev-parse HEAD)" = "$GITHUB_SHA" ]
          [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/master)" ]

  diagnose:
    needs: guard-source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      VPS_HOST: ${{ vars.VPS_HOST }}
      VPS_USER: ${{ vars.VPS_USER }}
      VPS_HOST_KEY: ${{ vars.VPS_HOST_KEY }}
      SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - name: Diagnostichează testul OpenCode end-to-end (read-only)
        shell: bash
        run: |
          set -Eeuo pipefail
          [ "$VPS_USER" = root ]
          [ -n "$VPS_HOST" ] && [ -n "$VPS_HOST_KEY" ] && [ -n "$SSH_KEY" ]
          umask 077
          key_file=$(mktemp)
          known_hosts=$(mktemp)
          cleanup() { rm -f -- "$key_file" "$known_hosts"; }
          trap cleanup EXIT
          printf '%s\n' "$SSH_KEY" > "$key_file"
          printf '%s\n' "$VPS_HOST_KEY" > "$known_hosts"
          chmod 0600 "$key_file" "$known_hosts"
          ssh_opts=(
            -i "$key_file"
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$known_hosts"
            -o HostKeyAlgorithms=ssh-ed25519
            -o BatchMode=yes
            -o ConnectTimeout=25
          )
          ssh "${ssh_opts[@]}" "$VPS_USER@$VPS_HOST" bash -s <<'REMOTE'
          set -Eeuo pipefail
          echo '=== llama-server health (port 24080) ==='
          curl --fail --silent --show-error --max-time 5 http://127.0.0.1:24080/health 2>&1 || echo 'health check failed'
          echo '=== direct chat completion probe ==='
          curl --fail --silent --show-error --max-time 60 \
            -H 'Content-Type: application/json' \
            -d '{"model":"qwen3.6-35b-a3b-local","messages":[{"role":"user","content":"Reply only with OK."}],"chat_template_kwargs":{"enable_thinking":false},"max_tokens":32,"temperature":0}' \
            "http://127.0.0.1:24080/v1/chat/completions" 2>&1 || echo 'chat completion probe failed'
          echo '=== opencode-e2e.txt (raw, redacted) ==='
          if [ -f /var/lib/private-ai/opencode-e2e.txt ]; then
            sed -E 's/(password|token|secret|key|Bearer)[=: ]+[^[:space:]"]+/\1=[REDACTED]/Ig' /var/lib/private-ai/opencode-e2e.txt
          else
            echo 'FILE_ABSENT'
          fi
          echo '=== opencode config ==='
          cat /etc/private-ai/opencode.env 2>&1 | sed -E 's/(password|token|secret|key)=.*/\1=[REDACTED]/Ig' || echo 'NO_ENV_FILE'
          find /etc/private-ai /home/privateai -iname 'opencode.json*' -o -iname '*.opencode*' 2>/dev/null | head -20 || true
          echo '=== opencode binary version ==='
          runuser -u privateai -- env -i HOME=/home/privateai PATH=/usr/local/bin:/usr/bin:/bin \
            /opt/private-ai/bin/opencode --version 2>&1 || true
          echo 'DIAG_DONE=yes'
          REMOTE
