# CONFIGURARE ACCES VPS PRIN CHEIE — o singură dată (22 iul 2026).
#
# VPS-ul (164.68.120.87) acceptă DOAR autentificare cu cheie (parola e oprită).
# Workflow-ul ăsta generează o pereche de chei pe runner, stochează PRIVATA
# direct în secretul repo-ului `VPS_SSH_KEY` (prin `gh secret set` — nu apare
# niciodată în log, nu trece prin chat), și AFIȘEAZĂ doar cheia PUBLICĂ.
# Publica se lipește o singură dată pe VPS (în /root/.ssh/authorized_keys),
# prin consola providerului. După aceea, `vps-run.yml` are mâna pe server.
#
# Cere secretul VPS_GITHUB_TOKEN să aibă drept de scriere pe „Secrets".
name: vps-key-setup

on:
  workflow_dispatch: {}

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Generează cheia, salvează privata ca secret, afișează publica
        env:
          GH_TOKEN: ${{ secrets.VPS_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::VPS_GITHUB_TOKEN lipsește — nu pot scrie secretul."; exit 1
          fi
          ssh-keygen -t ed25519 -f key -N "" -C "kelion-ci" >/dev/null
          echo "=== stochez cheia PRIVATĂ în secretul repo-ului VPS_SSH_KEY (nu se afișează) ==="
          if gh secret set VPS_SSH_KEY --repo "${GITHUB_REPOSITORY}" < key; then
            echo "✅ secretul VPS_SSH_KEY a fost scris."
          else
            echo "::error::gh secret set a eșuat — tokenul VPS_GITHUB_TOKEN nu are dreptul «Secrets: write». Fără el, privata trebuie pusă manual în secret."
            exit 1
          fi
          echo ""
          echo "=== CHEIA PUBLICĂ (asta se lipește pe VPS, e inofensivă) ==="
          echo "PUBKEY_START"
          cat key.pub
          echo "PUBKEY_END"
          echo ""
          echo "Comanda de lipit în consola VPS (ca root), o singură dată:"
          echo "MKCMD_START"
          echo "mkdir -p /root/.ssh && chmod 700 /root/.ssh && printf '%s\\n' \"$(cat key.pub)\" >> /root/.ssh/authorized_keys && chmod 600 /root/.ssh/authorized_keys && echo AUTORIZAT"
          echo "MKCMD_END"
          rm -f key
