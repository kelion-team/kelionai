# iOS release: builds, signs and uploads the Kelionai .ipa to App Store Connect.
# Runs on every push that changes the iOS shell or when triggered manually.
# The web app itself updates live (the shell loads kelionai.app), so this only
# needs to run when the SHELL changes — same philosophy as desktop/android.
#
# Required repository secrets (see ios/CI-SETUP.md):
#   IOS_DIST_P12_BASE64        - Kelionai-secrets/ios-dist.p12, base64
#   IOS_DIST_P12_PASSWORD      - Kelionai-secrets/ios-dist-p12-password.txt
#   IOS_PROFILE_BASE64         - Kelionai-secrets/Kelionai_App_Store.mobileprovision, base64
#   ASC_API_KEY_ID             - App Store Connect API key ID
#   ASC_API_ISSUER_ID          - App Store Connect API issuer ID
#   ASC_API_KEY_P8_BASE64      - AuthKey_XXXX.p8, base64
name: ios-release

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths: ['ios/**']

jobs:
  build-upload:
    # Pe întrerupătorul ACTIONS_PORNIT (15 aug, ca deploy.yml și gemini-lock):
    # facturarea blocată = niciun runner alocat vreodată → orice declanșare pe
    # push (schimbări în ios/**) murea roșu cu email către owner. Sărit ≠ picat.
    if: ${{ vars.ACTIONS_PORNIT == 'true' }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Import signing certificate
        env:
          P12_BASE64: ${{ secrets.IOS_DIST_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
        run: |
          KEYCHAIN=build.keychain
          KEYCHAIN_PASS=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PASS" $KEYCHAIN
          security default-keychain -s $KEYCHAIN
          security unlock-keychain -p "$KEYCHAIN_PASS" $KEYCHAIN
          security set-keychain-settings -t 3600 -u $KEYCHAIN
          echo "$P12_BASE64" | base64 -d > /tmp/dist.p12
          security import /tmp/dist.p12 -k $KEYCHAIN -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASS" $KEYCHAIN
          rm /tmp/dist.p12

      - name: Install provisioning profile
        env:
          PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILE_BASE64" | base64 -d > ~/Library/MobileDevice/Provisioning\ Profiles/kelionai-appstore.mobileprovision

      - name: Archive
        working-directory: ios/ios/App
        run: |
          xcodebuild archive \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Kelionai.xcarchive \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=982XP625JT \
            PRODUCT_BUNDLE_IDENTIFIER=app.kelionai.ios \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="Kelionai App Store"

      - name: Export .ipa
        working-directory: ios/ios/App
        run: |
          xcodebuild -exportArchive \
            -archivePath build/Kelionai.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist ../../ExportOptions.plist

      - name: Upload to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_KEY_B64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$ASC_KEY_B64" | base64 -d > ~/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8
          xcrun altool --upload-app -f ios/ios/App/build/export/*.ipa -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
