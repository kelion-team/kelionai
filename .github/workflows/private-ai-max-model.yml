name: private-ai-max-model

on:
  push:
    branches:
      - ops/private-ai-install-20260830
    paths:
      - .github/private-ai/upgrade-private-ai-max-model.sh
      - .github/workflows/private-ai-max-model.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: private-ai-max-model
  cancel-in-progress: false

jobs:
  validate-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Validează instalatorul modelului maxim
        shell: bash
        run: |
          set -Eeuo pipefail
          [ "$GITHUB_REPOSITORY" = kelion-team/kelionai ]
          [ "$GITHUB_REF" = refs/heads/ops/private-ai-install-20260830 ]
          [ "$(git rev-parse HEAD)" = "$GITHUB_SHA" ]
          bash -n .github/private-ai/upgrade-private-ai-max-model.sh
          grep -Fqx "readonly MODEL_REPO='unsloth/Qwen3.5-122B-A10B-GGUF'" \
            .github/private-ai/upgrade-private-ai-max-model.sh
          grep -Fqx "readonly MODEL_REVISION='a97b483a9f8cad9788776aa0112a2c63bf349e9e'" \
            .github/private-ai/upgrade-private-ai-max-model.sh
          grep -Fqx "readonly MODEL_TOTAL_BYTES='76536964608'" \
            .github/private-ai/upgrade-private-ai-max-model.sh
          [ "$(grep -cE "^[[:space:]]+'[0-9a-f]{64}'$" \
            .github/private-ai/upgrade-private-ai-max-model.sh)" -eq 3 ]
          ! grep -Ein '(BEGIN (RSA|OPENSSH) PRIVATE KEY|ghp_[A-Za-z0-9]|sk-[A-Za-z0-9])' \
            .github/private-ai/upgrade-private-ai-max-model.sh

  install-on-contabo:
    needs: validate-source
    runs-on: ubuntu-latest
    timeout-minutes: 330
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Instalează, activează și probează Qwen3.5 122B
        shell: bash
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER }}
          VPS_HOST_KEY: ${{ vars.VPS_HOST_KEY }}
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          [ "$GITHUB_REPOSITORY" = kelion-team/kelionai ]
          [ "$GITHUB_REF" = refs/heads/ops/private-ai-install-20260830 ]
          [ "$(git rev-parse HEAD)" = "$GITHUB_SHA" ]
          [ "$VPS_USER" = root ]
          [ -n "$VPS_HOST" ] && [ -n "$VPS_HOST_KEY" ] && [ -n "$SSH_KEY" ]

          installer=.github/private-ai/upgrade-private-ai-max-model.sh
          bash -n "$installer"
          installer_sha=$(sha256sum "$installer" | awk '{print $1}')
          [[ "$installer_sha" =~ ^[0-9a-f]{64}$ ]]

          key_file=$(mktemp)
          known_hosts=$(mktemp)
          cleanup() {
            rm -f -- "$key_file" "$known_hosts"
          }
          trap cleanup EXIT
          printf '%s\n' "$SSH_KEY" > "$key_file"
          printf '%s\n' "$VPS_HOST_KEY" > "$known_hosts"
          chmod 0600 "$key_file" "$known_hosts"
          current_host_key=$(ssh-keyscan -T 20 -t ed25519 "$VPS_HOST" 2>/dev/null)
          [ "$current_host_key" = "$VPS_HOST_KEY" ]
          ssh_opts=(
            -i "$key_file"
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$known_hosts"
            -o HostKeyAlgorithms=ssh-ed25519
            -o BatchMode=yes
            -o ConnectTimeout=25
            -o ServerAliveInterval=30
            -o ServerAliveCountMax=8
          )

          # A queued rerun after a completed 122B cutover must be observational only.
          # The root-owned receipt is the SHA attestation created only after the full
          # installer proof.  Revalidate its exact contract, live files and services,
          # but do not upload, hash 76 GB again, start or restart any unit on this path.
          set +e
          fast_proof=$(ssh "${ssh_opts[@]}" "$VPS_USER@$VPS_HOST" bash -s <<'REMOTE_FAST'
          set -uo pipefail

          fast_miss() { exit 42; }

          readonly model_id='llama.cpp/qwen3.5-122b-a10b-local'
          readonly model_alias='qwen3.5-122b-a10b-local'
          readonly model_root='/srv/private-ai/models/qwen3.5-122b-a10b-q4_k_m'
          readonly model_first='Qwen3.5-122B-A10B-Q4_K_M-00001-of-00003.gguf'
          readonly receipt='/etc/private-ai/.max-model-complete'
          readonly dropin='/etc/systemd/system/private-ai-llm.service.d/90-qwen35-122b-max.conf'
          readonly config='/srv/private-ai/home/.config/opencode/opencode.json'
          readonly worker='/opt/kelion-codex/codex-worker.mjs'
          readonly worker_unit='/etc/systemd/system/kelion-codex-worker.service'
          readonly opencode='/opt/private-ai/bin/opencode'

          [ -f "$receipt" ] && [ ! -L "$receipt" ] || fast_miss
          [ "$(stat -Lc '%u:%g:%a:%h' "$receipt" 2>/dev/null)" = '0:0:600:1' ] || fast_miss
          mapfile -t max_lines < "$receipt" || fast_miss
          [ "${#max_lines[@]}" -eq 12 ] || fast_miss
          [ "${max_lines[0]}" = 'schema=1' ] || fast_miss
          [ "${max_lines[1]}" = 'model=llama.cpp/qwen3.5-122b-a10b-local' ] || fast_miss
          [ "${max_lines[2]}" = 'model_repo=unsloth/Qwen3.5-122B-A10B-GGUF' ] || fast_miss
          [ "${max_lines[3]}" = 'model_revision=a97b483a9f8cad9788776aa0112a2c63bf349e9e' ] || fast_miss
          [ "${max_lines[4]}" = 'model_quant=Q4_K_M' ] || fast_miss
          [ "${max_lines[5]}" = 'model_total_bytes=76536964608' ] || fast_miss
          [ "${max_lines[6]}" = 'shard_1_sha256=467c9bd92ea518539cf75bf5a5fbfbd35e9a0b40d766ccaa67bf120e12041df3' ] || fast_miss
          [ "${max_lines[7]}" = 'shard_2_sha256=90db14846413aebdac365b57206441437cac5f7e5037d94b325f0167f902e6e7' ] || fast_miss
          [ "${max_lines[8]}" = 'shard_3_sha256=e3c24b8ebec070bb4f69ea0aca25a16531da7440cd515529953e046882901f97' ] || fast_miss
          [ "${max_lines[9]}" = 'context=16384' ] || fast_miss
          [ "${max_lines[10]}" = 'worker_unit_model=llama.cpp/qwen3.5-122b-a10b-local' ] || fast_miss
          [[ "${max_lines[11]}" =~ ^verified_at=[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]] || fast_miss

          [ -d "$model_root" ] && [ ! -L "$model_root" ] || fast_miss
          [ "$(stat -Lc '%U:%G:%a' "$model_root" 2>/dev/null)" = 'root:privateai:750' ] || fast_miss
          while IFS='|' read -r shard bytes; do
            path="$model_root/$shard"
            [ -f "$path" ] && [ ! -L "$path" ] || fast_miss
            [ "$(stat -Lc '%U:%G:%a:%s:%h' "$path" 2>/dev/null)" = "root:privateai:440:${bytes}:1" ] || fast_miss
          done <<'SHARDS'
          Qwen3.5-122B-A10B-Q4_K_M-00001-of-00003.gguf|10943552
          Qwen3.5-122B-A10B-Q4_K_M-00002-of-00003.gguf|49968146912
          Qwen3.5-122B-A10B-Q4_K_M-00003-of-00003.gguf|26557874144
          SHARDS

          [ -f "$dropin" ] && [ ! -L "$dropin" ] || fast_miss
          [ "$(stat -Lc '%u:%g:%a:%h' "$dropin" 2>/dev/null)" = '0:0:644:1' ] || fast_miss
          expected_dropin=$(cat <<'DROPIN'
          [Service]
          ExecStart=
          ExecStart=/opt/private-ai/bin/llama-server --model /srv/private-ai/models/qwen3.5-122b-a10b-q4_k_m/Qwen3.5-122B-A10B-Q4_K_M-00001-of-00003.gguf --alias qwen3.5-122b-a10b-local --host 127.0.0.1 --port 24080 --ctx-size 16384 --n-predict 4096 --threads 16 --parallel 1 --batch-size 2048 --ubatch-size 512 --load-mode mmap --cache-ram 0 --spec-type none --no-mmproj --jinja --chat-template-kwargs '{"enable_thinking":false}'
          TimeoutStartSec=3600
          CPUQuota=1600%
          MemoryHigh=84G
          MemoryMax=88G
          DROPIN
          )
          [ "$(<"$dropin")" = "$expected_dropin" ] || fast_miss
          [ "$(systemctl show private-ai-llm.service -p DropInPaths --value 2>/dev/null)" = "$dropin" ] || fast_miss

          [ -f "$config" ] && [ ! -L "$config" ] || fast_miss
          [ "$(stat -Lc '%U:%G:%a:%h' "$config" 2>/dev/null)" = 'root:privateai:640:1' ] || fast_miss
          jq -e --arg model "$model_id" --arg alias "$model_alias" '
            .model == $model and .small_model == $model and
            .enabled_providers == ["llama.cpp"] and
            .provider["llama.cpp"].options.baseURL == "http://127.0.0.1:24080/v1" and
            .provider["llama.cpp"].models[$alias].limit.context == 16384 and
            .provider["llama.cpp"].models[$alias].limit.output == 4096
          ' "$config" >/dev/null 2>&1 || fast_miss

          [ -x "$opencode" ] && [ -f "$opencode" ] && [ ! -L "$opencode" ] || fast_miss
          [ -f "$worker" ] && [ ! -L "$worker" ] || fast_miss
          [ -f "$worker_unit" ] && [ ! -L "$worker_unit" ] || fast_miss
          [ "$(stat -Lc '%u:%g:%a:%h' "$worker_unit" 2>/dev/null)" = '0:0:644:1' ] || fast_miss
          [ "$(grep -c '^Environment=OPENCODE_MODEL=llama.cpp/qwen3.5-122b-a10b-local$' "$worker_unit")" -eq 1 ] || fast_miss
          ! grep -Fq 'qwen3.6-35b-a3b-local' "$worker_unit" || fast_miss

          systemctl is-active --quiet private-ai-llm.service || fast_miss
          systemctl is-active --quiet private-ai-web.service || fast_miss
          systemctl is-active --quiet kelion-codex-worker.timer || fast_miss
          systemctl is-enabled --quiet kelion-codex-worker.timer || fast_miss
          systemctl show kelion-codex-worker.service -p Environment --value 2>/dev/null \
            | tr ' ' '\n' \
            | grep -qx 'OPENCODE_MODEL=llama.cpp/qwen3.5-122b-a10b-local' || fast_miss

          llm_pid=$(systemctl show private-ai-llm.service -p MainPID --value 2>/dev/null)
          [[ "$llm_pid" =~ ^[1-9][0-9]*$ ]] || fast_miss
          [ -r "/proc/$llm_pid/maps" ] || fast_miss
          awk -v target="$model_root/$model_first" '$NF == target {found=1} END {exit !found}' \
            "/proc/$llm_pid/maps" || fast_miss
          ss -ltnH | awk '{print $4}' | grep -qx '127.0.0.1:24080' || fast_miss
          ! ss -ltnH | awk '{print $4}' | grep -Eq '(0[.]0[.]0[.]0|\[::\]):24080$' || fast_miss

          curl --fail --silent --show-error --max-time 15 \
            http://127.0.0.1:24080/health >/dev/null || fast_miss
          models=$(curl --fail --silent --show-error --max-time 30 \
            http://127.0.0.1:24080/v1/models) || fast_miss
          jq -e --arg id "$model_alias" '.data | any(.id == $id)' \
            <<<"$models" >/dev/null 2>&1 || fast_miss
          reply=$(curl --fail --silent --show-error --max-time 1800 \
            -H 'Content-Type: application/json' \
            --data-binary '{"model":"qwen3.5-122b-a10b-local","messages":[{"role":"user","content":"Reply only with OK."}],"max_tokens":16,"temperature":0}' \
            http://127.0.0.1:24080/v1/chat/completions) || fast_miss
          jq -e '.choices[0].message.content | type == "string" and length > 0' \
            <<<"$reply" >/dev/null 2>&1 || fast_miss
          HOME=/srv/private-ai/home XDG_CONFIG_HOME=/srv/private-ai/home/.config \
            "$opencode" models llama.cpp | grep -Fq "$model_alias" || fast_miss
          node "$worker" --self-test | grep -qx 'codex-worker self-test: TRECE' || fast_miss

          printf 'FAST_PATH=existing-valid\n'
          printf 'MODEL_ID=%s\n' "$model_id"
          printf 'MODEL_REPO=unsloth/Qwen3.5-122B-A10B-GGUF\n'
          printf 'MODEL_REVISION=a97b483a9f8cad9788776aa0112a2c63bf349e9e\n'
          printf 'MODEL_QUANT=Q4_K_M\n'
          printf 'MODEL_TOTAL_BYTES=76536964608\n'
          printf 'MODEL_CONTEXT=16384\n'
          printf 'VPS_MEMORY_TOTAL_BYTES=%s\n' "$(awk '/MemTotal:/ {print $2 * 1024}' /proc/meminfo | cut -d. -f1)"
          printf 'VPS_CPU_THREADS=%s\n' "$(nproc)"
          printf 'LLAMA_HEALTH=ok\n'
          printf 'LLAMA_INFERENCE=passed\n'
          printf 'OPENCODE_PROVIDER=passed\n'
          printf 'WORKER_SELF_TEST=passed\n'
          printf 'WORKER_UNIT_MODEL=passed\n'
          printf 'MAX_MODEL_INSTALLED=yes\n'
          REMOTE_FAST
          )
          fast_status=$?
          set -e

          if [ "$fast_status" -eq 0 ]; then
            proof=$fast_proof
          elif [ "$fast_status" -eq 42 ]; then
            remote_candidate="/root/private-ai-max-model.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}.sh"
            scp "${ssh_opts[@]}" "$installer" "$VPS_USER@$VPS_HOST:$remote_candidate"
            proof=$(ssh "${ssh_opts[@]}" "$VPS_USER@$VPS_HOST" bash -s -- \
              "$remote_candidate" "$installer_sha" <<'REMOTE'
          set -Eeuo pipefail
          umask 077
          candidate=$1
          expected_sha=$2
          [[ "$expected_sha" =~ ^[0-9a-f]{64}$ ]]
          [ -f "$candidate" ] && [ ! -L "$candidate" ]
          [ "$(stat -Lc '%u:%g:%h' "$candidate")" = '0:0:1' ]
          [ "$(sha256sum "$candidate" | awk '{print $1}')" = "$expected_sha" ]

          durable_parent=/root/private-ai-max-model
          durable_root=$durable_parent/$expected_sha
          durable_script=$durable_root/upgrade.sh
          unit=/etc/systemd/system/private-ai-max-model-upgrade.service
          install -d -o root -g root -m 0700 "$durable_parent"
          [ -d "$durable_parent" ] && [ ! -L "$durable_parent" ]
          [ "$(stat -Lc '%u:%g:%a' "$durable_parent")" = '0:0:700' ]

          if systemctl is-active --quiet private-ai-max-model-upgrade.service; then
            [ -f "$durable_script" ] && [ ! -L "$durable_script" ]
            [ "$(sha256sum "$durable_script" | awk '{print $1}')" = "$expected_sha" ]
            rm -f -- "$candidate"
          else
            systemctl stop private-ai-max-model-upgrade.service >/dev/null 2>&1 || true
            if [ -e "$durable_root" ] || [ -L "$durable_root" ]; then
              [ -d "$durable_root" ] && [ ! -L "$durable_root" ]
              rm -rf --one-file-system -- "$durable_root"
            fi
            install -d -o root -g root -m 0700 "$durable_root"
            install -o root -g root -m 0700 "$candidate" "$durable_script"
            rm -f -- "$candidate"
            sync -f "$durable_script"

            unit_candidate=$(mktemp /etc/systemd/system/.private-ai-max-model-upgrade.XXXXXX)
            cat > "$unit_candidate" <<UNIT
          [Unit]
          Description=Kelion private AI maximum stable model upgrade
          After=network-online.target
          Wants=network-online.target
          StartLimitIntervalSec=3600
          StartLimitBurst=3

          [Service]
          Type=oneshot
          WorkingDirectory=$durable_root
          ExecStart=/usr/bin/bash $durable_script
          ExecStartPost=/usr/bin/systemctl disable private-ai-max-model-upgrade.service
          Restart=on-failure
          RestartSec=20s
          TimeoutStartSec=21600s
          TimeoutStopSec=600s

          [Install]
          WantedBy=multi-user.target
          UNIT
            chown root:root "$unit_candidate"
            chmod 0644 "$unit_candidate"
            mv -f -- "$unit_candidate" "$unit"
            sync -f "$unit"
            systemctl daemon-reload
            systemd-analyze verify "$unit"
            systemctl enable private-ai-max-model-upgrade.service >/dev/null
            systemctl reset-failed private-ai-max-model-upgrade.service >/dev/null 2>&1 || true
            systemctl start --no-block private-ai-max-model-upgrade.service
          fi

          deadline=$((SECONDS + 19500))
          success_invocation=''
          while :; do
            active=$(systemctl show private-ai-max-model-upgrade.service -p ActiveState --value)
            result=$(systemctl show private-ai-max-model-upgrade.service -p Result --value)
            invocation=$(systemctl show private-ai-max-model-upgrade.service -p InvocationID --value)
            if [ "$active" = inactive ] && [ "$result" = success ] \
              && [[ "$invocation" =~ ^[0-9a-f]{32}$ ]]; then
              success_invocation=$invocation
              break
            fi
            if [ "$active" = failed ]; then
              journalctl --no-pager --output=cat --unit=private-ai-max-model-upgrade.service \
                --lines=300 >&2
              exit 1
            fi
            [ "$SECONDS" -lt "$deadline" ] || {
              journalctl --no-pager --output=cat --unit=private-ai-max-model-upgrade.service \
                --lines=300 >&2
              exit 1
            }
            sleep 10
          done

          [ -f /etc/private-ai/.max-model-complete ]
          [ ! -L /etc/private-ai/.max-model-complete ]
          [ "$(stat -Lc '%u:%g:%a:%h' /etc/private-ai/.max-model-complete)" = '0:0:600:1' ]
          mapfile -t max_lines < /etc/private-ai/.max-model-complete
          [ "${#max_lines[@]}" -eq 12 ]
          [ "${max_lines[0]}" = 'schema=1' ]
          [ "${max_lines[1]}" = 'model=llama.cpp/qwen3.5-122b-a10b-local' ]
          [ "${max_lines[2]}" = 'model_repo=unsloth/Qwen3.5-122B-A10B-GGUF' ]
          [ "${max_lines[3]}" = 'model_revision=a97b483a9f8cad9788776aa0112a2c63bf349e9e' ]
          [ "${max_lines[4]}" = 'model_quant=Q4_K_M' ]
          [ "${max_lines[5]}" = 'model_total_bytes=76536964608' ]
          [ "${max_lines[6]}" = 'shard_1_sha256=467c9bd92ea518539cf75bf5a5fbfbd35e9a0b40d766ccaa67bf120e12041df3' ]
          [ "${max_lines[7]}" = 'shard_2_sha256=90db14846413aebdac365b57206441437cac5f7e5037d94b325f0167f902e6e7' ]
          [ "${max_lines[8]}" = 'shard_3_sha256=e3c24b8ebec070bb4f69ea0aca25a16531da7440cd515529953e046882901f97' ]
          [ "${max_lines[9]}" = 'context=16384' ]
          [ "${max_lines[10]}" = 'worker_unit_model=llama.cpp/qwen3.5-122b-a10b-local' ]
          [[ "${max_lines[11]}" =~ ^verified_at=[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]]
          systemctl is-active --quiet private-ai-llm.service
          systemctl is-active --quiet private-ai-web.service
          systemctl is-active --quiet kelion-codex-worker.timer
          journalctl --no-pager --output=cat "_SYSTEMD_INVOCATION_ID=$success_invocation"
          REMOTE
            )
          else
            printf 'Fast-path SSH failed with exit %s; refusing an ambiguous fallback.\n' \
              "$fast_status" >&2
            exit "$fast_status"
          fi

          printf '%s\n' "$proof"
          grep -qx 'MODEL_ID=llama.cpp/qwen3.5-122b-a10b-local' <<<"$proof"
          grep -qx 'MODEL_REPO=unsloth/Qwen3.5-122B-A10B-GGUF' <<<"$proof"
          grep -qx 'MODEL_REVISION=a97b483a9f8cad9788776aa0112a2c63bf349e9e' <<<"$proof"
          grep -qx 'MODEL_QUANT=Q4_K_M' <<<"$proof"
          grep -qx 'MODEL_TOTAL_BYTES=76536964608' <<<"$proof"
          grep -qx 'MODEL_CONTEXT=16384' <<<"$proof"
          grep -Eq '^VPS_MEMORY_TOTAL_BYTES=[0-9]+$' <<<"$proof"
          grep -Eq '^VPS_CPU_THREADS=[0-9]+$' <<<"$proof"
          grep -qx 'LLAMA_HEALTH=ok' <<<"$proof"
          grep -qx 'LLAMA_INFERENCE=passed' <<<"$proof"
          grep -qx 'OPENCODE_PROVIDER=passed' <<<"$proof"
          grep -qx 'WORKER_SELF_TEST=passed' <<<"$proof"
          grep -qx 'WORKER_UNIT_MODEL=passed' <<<"$proof"
          grep -qx 'MAX_MODEL_INSTALLED=yes' <<<"$proof"
          {
            printf '%s\n' '### Qwen3.5 122B — dovadă live Contabo'
            printf '%s\n' '```text'
            printf '%s\n' "$proof"
            printf '%s\n' '```'
          } >> "$GITHUB_STEP_SUMMARY"
