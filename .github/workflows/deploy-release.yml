# DEPLOY RELEASE — auto-publishes an approved release to Railway without
# relying on the VPS builder. Triggered by the backend when an admin approves a
# staged release in the Admin panel.
#
# Pipeline:
#   1. Merge the release branch into master.
#   2. Dispatch deploy.yml to publish the web service on Railway.
#   3. Trigger a redeploy of every Railway production service so any pending
#      Variables/Settings changes are applied (fixes the "125 pending changes
#      across 13 services" build-up).
#   4. Report the result in the job log.
#
# Why this workflow: the old path depended on a headless builder on the VPS
# polling /api/bridge/approved-releases. If that builder is offline, approved
# releases pile up. This GitHub-native path runs as a workflow_dispatch from
# the backend the moment Adrian approves, so approved releases reach Railway
# without manual intervention.
name: deploy-release

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Release branch to merge into master and deploy'
        required: true
        type: string
      title:
        description: 'Release title'
        required: true
        type: string
      detail:
        description: 'Release detail'
        required: false
        type: string

# One production pipeline at a time — same group as deploy.yml so a new release
# cancels any stale in-flight deployment.
concurrency:
  group: deploy-production
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config --global user.name "Kelion Release Bot"
          git config --global user.email "builder@kelionai.app"

      - name: Merge release branch into master
        env:
          BRANCH: ${{ inputs.branch }}
          TITLE: ${{ inputs.title }}
        run: |
          set -euo pipefail
          git checkout -B master origin/master
          git merge --no-ff "origin/$BRANCH" -m "release: $TITLE"
          git push origin master

      - name: Dispatch deploy workflow for the web service
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          CODE=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/actions/workflows/deploy.yml/dispatches" \
            -d '{"ref":"master"}')
          if [ "$CODE" != "204" ]; then
            echo "::error::Failed to dispatch deploy.yml (HTTP $CODE)"
            exit 1
          fi
          echo "deploy.yml dispatched for master"

      - name: Apply pending Railway changes across production services
        env:
          TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set -uo pipefail
          if [ -z "$TOKEN" ]; then
            echo "::error::RAILWAY_TOKEN missing — cannot apply pending changes"
            exit 1
          fi
          GQL=https://backboard.railway.com/graphql/v2
          gql() { curl -sS --max-time 30 "$GQL" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -d "$1"; }

          RESP=$(gql '{"query":"query{projects{edges{node{id name environments{edges{node{id name}}} services{edges{node{id name}}}}}}}"}')
          P=$(echo "$RESP" | jq '[.data.projects.edges[].node | select(.name | test("kelion";"i"))][0] // .data.projects.edges[0].node')
          PID=$(echo "$P" | jq -r '.id')
          ENVID=$(echo "$P" | jq -r '[.environments.edges[].node | select(.name=="production")][0].id // .environments.edges[0].node.id')
          SVC_ROWS=$(echo "$P" | jq -r '.services.edges[]?.node | @base64')

          if [ -z "$SVC_ROWS" ]; then
            echo "No Railway services found in project $PID"
            exit 0
          fi

          echo "Applying pending changes across Railway services (project=$PID env=$ENVID)"
          for row in $SVC_ROWS; do
            SID=$(echo "$row" | base64 -d | jq -r '.id')
            SNAME=$(echo "$row" | base64 -d | jq -r '.name')
            echo "  → Redeploying $SNAME ($SID)"
            DQ=$(jq -nc --arg e "$ENVID" --arg s "$SID" \
              '{query:"mutation($e:String!,$s:String!){serviceInstanceDeploy(environmentId:$e,serviceId:$s)}",variables:{e:$e,s:$s}}')
            gql "$DQ" | jq -e '.data.serviceInstanceDeploy' >/dev/null 2>&1 && echo "     OK" || echo "::warning::     Failed to trigger redeploy for $SNAME (will be retried by next release)"
          done
          echo "Railway service redeploys triggered. Pending Variables/Settings updates are now being applied."
