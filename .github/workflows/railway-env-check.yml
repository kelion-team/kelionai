# VERIFICARE VARIABILE RAILWAY (doar-citire). Răspunde la „ce am setat și ce nu"
# fără să atingă nimic: interoghează API-ul Railway și listează DOAR NUMELE
# variabilelor de pe producție (NICIODATĂ valorile — acelea rămân secrete), plus
# un checklist al variabilelor așteptate (setată ✅ / lipsește ❌).
name: railway-env-check

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Listează numele variabilelor de producție (fără valori)
        env:
          TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$TOKEN" ]; then
            echo "::error::RAILWAY_TOKEN lipsește din Settings → Secrets → Actions."
            exit 1
          fi
          GQL=https://backboard.railway.com/graphql/v2
          gql() { curl -sS --max-time 30 "$GQL" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -d "$1"; }

          RESP=$(gql '{"query":"query{projects{edges{node{id name environments{edges{node{id name}}} services{edges{node{id name}}}}}}}"}')
          P=$(echo "$RESP" | jq '[.data.projects.edges[].node | select(.name | test("kelion";"i"))][0]')
          PID=$(echo "$P" | jq -r '.id')
          ENVID=$(echo "$P" | jq -r '[.environments.edges[].node | select(.name=="production")][0].id')
          SVCID=$(echo "$P" | jq -r '[.services.edges[].node | select(.name=="web")][0].id // .services.edges[0].node.id')
          echo "Proiect: $(echo "$P" | jq -r '.name')  (serviciu web găsit)"
          echo ""

          VQ=$(jq -nc --arg p "$PID" --arg e "$ENVID" --arg s "$SVCID" \
            '{query:"query($p:String!,$e:String!,$s:String!){variables(projectId:$p,environmentId:$e,serviceId:$s)}",variables:{p:$p,e:$e,s:$s}}')
          # DOAR numele (keys). Valorile NU se ating, NU se afișează.
          KEYS=$(gql "$VQ" | jq -r '.data.variables | keys[]' | sort)

          echo "===== VARIABILE SETATE PE PRODUCȚIE (doar nume) ====="
          echo "$KEYS" | sed 's/^/  ✅ /'
          echo ""
          echo "===== CHECKLIST (ce ai / ce lipsește) ====="
          check() { if echo "$KEYS" | grep -qx "$1"; then echo "  ✅ $1 — $2"; else echo "  ❌ $1 — LIPSEȘTE — $2"; fi; }
          echo "-- Bază (obligatorii) --"
          check GOOGLE_CLIENT_ID "login Google"
          check GOOGLE_CLIENT_SECRET "login Google"
          check GOOGLE_REDIRECT_URI "login Google"
          check SESSION_SECRET "sesiuni"
          check DATABASE_URL "istoric/memorie/portofel"
          check BRIDGE_SECRET "creierul-abonament (chat)"
          echo "-- Voce --"
          check GOOGLE_SERVICE_ACCOUNT_JSON "vocea Chirp 3 HD"
          check LIVEKIT_URL "server LiveKit propriu (self-hosted)"
          check LIVEKIT_API_KEY "server LiveKit propriu (self-hosted)"
          check LIVEKIT_API_SECRET "server LiveKit propriu (self-hosted)"
          echo "-- Funcții opționale --"
          check GEMINI_API_KEY "traducere + imagini + grounded"
          check MAIL_PASS "inbox + răspuns contact@kelionai.app"
          check SERPER_API_KEY "căutare web reală"
          check GOOGLE_MAPS_KEY "rute Google Maps cu trafic"
          check STRIPE_SECRET_KEY "plăți/credite"
          check STRIPE_WEBHOOK_SECRET "confirmare plăți Stripe"
          check ANTHROPIC_API_KEY "creierul pe API (acum ocolit)"
          echo ""
          echo "== GATA — niciun secret afișat, nimic modificat. =="
