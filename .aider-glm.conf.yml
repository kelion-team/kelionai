# Configurație Aider — GLM (rezervă)
# Locație: .aider-glm.conf.yml în repo

# Model
model: openai/glm-5.2

# API base pentru GLM (compatibil Anthropic/OpenAI)
openai-api-base: https://api.z.ai/api/anthropic/v1

# API key — citit din fișier pe VPS
openai-api-key: ${GLM_API_KEY}

# Fereastra de context
max-chat-history-tokens: 131072

# Comportament
auto-commits: true
dirty-commits: false
watch-files: true

# Unelte
code-theme: monokai
show-diffs: true

# Lint/check la salvare
lint-cmd: "npx eslint --fix"

# Repo
git: true
gitignore: true

# Output
verbose: false
stream: true
