<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="google-site-verification" content="T5ciCW6HP_xVOtOQjgP3roLzZoh3R2OXXa86au29ers" />
    <link rel="icon" type="image/png" href="/kelion-logo.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <!-- iOS PWA: full-screen standalone app when added to the Home Screen. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Kelionai" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0b0d12" />
    <!-- PRELOAD AVATAR (auditul de fluiditate 27 iul): modelul 3D (~9MB) pornea
         abia DUPĂ parsarea bundle-ului JS → ecranul de încărcare stătea mult la
         prima deschidere. Preload = descărcarea începe odată cu pagina. -->
    <!-- FĂRĂ crossorigin (9 aug, alerta „preloaded but not used"): loaderul GLTF
         cere fișierul same-origin FĂRĂ mod CORS, deci preload-ul cu crossorigin
         nu se potrivea NICIODATĂ cu cererea reală — modelul se descărca de două
         ori și consola striga. Fără atribut, preload-ul chiar e folosit. -->
    <link rel="preload" href="/kelion-rpm.glb" as="fetch" type="model/gltf-binary" />
    <!-- SEO (rescris 2 aug, auditul de onestitate): era în ROMÂNĂ pe o
         suprafață publică în engleză prin regulă, și promitea „Încearcă 3
         minute gratuit” — proba gratuită NU există (decizia lui Adrian, vezi
         Landing.tsx: „Nobody gets free minutes anymore”). Engleză + adevăr. -->
    <title>Kelionai — your AI assistant that sees, hears and speaks</title>
    <meta
      name="description"
      content="Kelionai — a personal AI assistant with a 3D avatar and voice. It sees through your camera, hears and speaks. Maps, images, live web, in any language."
    />
    <meta name="author" content="AE Studio" />
    <link rel="canonical" href="https://kelionai.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Kelionai" />
    <meta property="og:title" content="Kelionai — your AI assistant that sees, hears and speaks" />
    <meta
      property="og:description"
      content="A personal AI assistant with a 3D avatar and voice. It sees, hears and speaks — in any language."
    />
    <meta property="og:url" content="https://kelionai.app/" />
    <meta property="og:image" content="https://kelionai.app/kelion-logo.png" />
    <meta property="og:locale" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Kelionai — your AI assistant that sees, hears and speaks" />
    <meta
      name="twitter:description"
      content="A personal AI assistant with a 3D avatar and voice. It sees, hears and speaks — in any language."
    />
    <meta name="twitter:image" content="https://kelionai.app/kelion-logo.png" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Kelionai",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Web, Windows, Android, iOS",
        "url": "https://kelionai.app/",
        "description": "A personal AI assistant with a 3D avatar and voice. It sees through your camera, hears and speaks, in any language.",
        "author": { "@type": "Organization", "name": "AE Studio" }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // PWA: installable on any phone/desktop; the service worker caches the app
      // SHELL only (never live data) so Kelionai opens instantly on weak links.
      // updateViaCache:'none' — browserul ia MEREU sw.js proaspăt din rețea (nu
      // dintr-un cache HTTP), iar reg.update() periodic forțează verificarea unei
      // versiuni noi. Așa un deploy ajunge automat la TOȚI (demo, clienți, PWA/
      // TWA din magazine care încarcă site-ul live), fără shell vechi lipit.
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker
            .register('/sw.js', { updateViaCache: 'none' })
            .then((reg) => {
              void reg.update()
              setInterval(() => void reg.update(), 60_000)
            })
            .catch(() => {})
        })
      }
    </script>
  </body>
</html>
