        "operatingSystem": "Web, Windows, Android, iOS",

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // PWA INSTALL (Faza 1 offline-first, M1): Chrome/Edge/Android emit
      // `beforeinstallprompt` EARLY — often before React mounts — and the event
      // can only be used ONCE. We catch it here, stash it on a global, and ping
      // the app so the inline "Install" button (ButonInstalarePwa, on Landing)
      // can fire the NATIVE prompt on demand. iOS Safari never sends this event
      // (handled in the component with the real Add-to-Home-Screen hint, no fake button).
      window.__kelionDeferredInstall = null
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault()
        window.__kelionDeferredInstall = e
        window.dispatchEvent(new Event('kelion-installable'))
      })
      window.addEventListener('appinstalled', () => {
        window.__kelionDeferredInstall = null
        window.dispatchEvent(new Event('kelion-installed'))
      })
    </script>
    <script>
      // PWA: installable on any phone/desktop; the service worker caches the app
      // SHELL only (never live data) so Kelionai opens instantly on weak links.
      // updateViaCache:'none' — browserul ia MEREU sw.js proaspăt din rețea (nu
      // dintr-un cache HTTP), iar reg.update() periodic forțează verificarea unei
      // versiuni noi. Așa un deploy ajunge automat la TOȚI (demo, clienți, PWA/
      // TWA din magazine care încarcă site-ul live), fără shell vechi lipit.
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker
            .register('/sw.js', { updateViaCache: 'none' })
            .then((reg) => {
              reg.update().catch(() => {})
              setInterval(() => {
                reg.update().catch(() => {})
              }, 60_000)
            })
            .catch(() => {})
        })
      }
    </script>
  </body>
