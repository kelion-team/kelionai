[package]
name = "kelion-constructor-desktop"
version = "1.0.0"
description = "Kelion Constructor — client dedicat pentru coada Kelion"
authors = ["AE Studio"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-deep-link = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
keyring = { version = "=4.1.5", default-features = false, features = ["v1"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
